name: demo function smoke (e2e)

# 통합 smoke test — wrangler pages dev 로 실제 Cloudflare Pages 런타임을 띄워
# /demo/* 의 핵심 분기를 HTTP 요청으로 검증.
#
# scripts/check-demo-fn.js (단위) 는 mock 으로 분기 검증하지만, Pages 의
# 실제 라우팅 / 정적 자산 / env.ASSETS 동작은 wrangler dev 에서만 재현 가능.
# 이게 깔리면 PR #144 같은 회귀가 단위 테스트를 통과했다 해도 e2e 단계에서
# 잡힘 (워크스페이스 랜딩 콘텐츠가 응답에 새어들어가는지 직접 본문 검사).

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'demo/**'
      - 'scripts/smoke-test-demo-fn.js'
      - '.github/workflows/check-demo-fn-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'functions/**'
      - 'demo/**'
      - 'scripts/smoke-test-demo-fn.js'
      - '.github/workflows/check-demo-fn-smoke.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치 (wrangler)
        run: npm install --no-audit --no-fund
      - name: wrangler pages dev 백그라운드 실행
        # 정적 자산 + functions/ 자동 감지. --port 8788 기본.
        # --log-level error 로 stdout 노이즈 줄임.
        run: |
          npx wrangler pages dev . --port 8788 --log-level error > wrangler.log 2>&1 &
          echo $! > wrangler.pid
      - name: wrangler 준비 대기 (최대 30s)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8788/demo/_blank.html 2>/dev/null; then
              echo "wrangler ready (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "❌ wrangler 30s 안에 준비 안 됨 — 로그:"
          cat wrangler.log || true
          exit 1
      - name: 통합 smoke test 실행
        env:
          SMOKE_BASE_URL: http://localhost:8788
        run: node scripts/smoke-test-demo-fn.js
      - name: wrangler 로그 출력 (디버깅용)
        if: always()
        run: cat wrangler.log || true
      - name: wrangler 종료
        if: always()
        run: |
          if [ -f wrangler.pid ]; then
            kill "$(cat wrangler.pid)" 2>/dev/null || true
          fi
