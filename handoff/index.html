<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCM HUB · Handoff</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root { --bg:#0E0E14; --surface:#15151D; --surface-h:#1B1B25; --line:#25252F; --line-2:#34344A; --fg:#FFFFFF; --fg-mute:rgba(255,255,255,0.62); --fg-dim:rgba(255,255,255,0.40); --accent:#6E6BFF; --accent-bg:rgba(110,107,255,0.14); }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; }
    body { background:var(--bg); color:var(--fg); font-family:'Pretendard Variable', Pretendard, -apple-system, sans-serif; letter-spacing:-0.01em; min-height:100vh; }
    a { color:inherit; text-decoration:none; }
    .shell { max-width:1080px; margin:0 auto; padding:64px 56px 120px; }
    .top { display:flex; align-items:center; justify-content:space-between; padding:8px 0 32px; font-size:12px; color:var(--fg-mute); }
    .top__brand { display:inline-flex; align-items:center; gap:10px; font-weight:700; font-size:14px; color:var(--fg); letter-spacing:0.4px; }
    .top__back { color:var(--fg-mute); font-size:12px; padding:6px 12px; border:1px solid var(--line); border-radius:999px; }
    .top__back:hover { color:var(--fg); border-color:var(--line-2); }

    .hero { padding:8px 0 48px; }
    .hero__eyebrow { font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--accent); }
    .hero__title { margin:12px 0 0; font-size:36px; font-weight:700; letter-spacing:-0.5px; }
    .hero__sub { margin:14px 0 0; font-size:15px; color:var(--fg-mute); max-width:720px; line-height:1.7; }

    .empty {
      margin-top:32px; padding:48px 32px; text-align:center;
      background:var(--surface); border:1px dashed var(--line-2); border-radius:14px;
      color:var(--fg-mute);
    }
    .empty__icon { font-size:48px; margin-bottom:16px; opacity:0.6; }
    .empty__title { font-size:18px; font-weight:600; color:var(--fg); margin-bottom:8px; }
    .empty__text { font-size:14px; line-height:1.6; }

    .footer { margin-top:64px; padding:18px 4px 0; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--fg-dim); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <span class="top__brand">SCM HUB · Handoff</span>
      <a class="top__back" href="../index.html">← Workspace 로 돌아가기</a>
    </header>

    <section class="hero">
      <span class="hero__eyebrow">Documents</span>
      <h1 class="hero__title">핸드오프 (Handoff)</h1>
      <p class="hero__sub">디자이너 ↔ 개발자 인계 산출물. Figma export, 명세서, 가이드 등 공유 폴더.</p>
    </section>

    <div class="empty">
      <div class="empty__icon">📦</div>
      <div class="empty__title">아직 준비 중입니다</div>
      <div class="empty__text">핸드오프 산출물이 등록되면 이곳에 표시됩니다.<br/>현재 폴더 내 파일은 <code>README.md</code> 참고.</div>
    </div>

    <footer class="footer">
      <span>SCM HUB · Internal</span>
      <span><a href="./README.md">README.md</a></span>
    </footer>
  </div>
</body>
</html>
