<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCM HUB · 협업 VOC</title>
  <script src="/auth-gate.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg:        #0E0E14;
      --surface:   #15151D;
      --surface-h: #1B1B25;
      --line:      #25252F;
      --line-2:    #34344A;
      --fg:        #FFFFFF;
      --fg-mute:   rgba(255,255,255,0.62);
      --fg-dim:    rgba(255,255,255,0.40);
      --accent:    #6E6BFF;
      --accent-bg: rgba(110,107,255,0.14);
      --accent-2:  #5754ff;
      --ok:        #34D399;
      --ok-bg:     rgba(52,211,153,0.14);
      --warn:      #F59E0B;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.01em;
      overflow: hidden;
      min-width: 1280px;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    /* ============ Top header ============ */
    .topbar {
      position: relative; z-index: 50;
      display: flex; align-items: center; gap: 14px;
      height: 56px; padding: 0 20px;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 700; font-size: 14px; color: var(--fg); letter-spacing: 0.4px; white-space: nowrap; }
    .brand .dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--accent); margin: 0 8px 1px; vertical-align: middle; }
    .topbar__sep { width: 1px; height: 20px; background: var(--line); }

    .page-select {
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--line); border-radius: 8px;
      font-family: inherit; font-size: 13px;
      padding: 7px 30px 7px 12px; outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23999' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 10px center;
      cursor: pointer; min-width: 220px;
    }
    .page-select:hover { border-color: var(--line-2); }
    .page-select:focus { border-color: var(--accent); }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      background: transparent; color: var(--fg-mute);
      border: 1px solid var(--line); border-radius: 8px;
      transition: all 0.12s ease;
    }
    .icon-btn:hover { color: var(--fg); border-color: var(--line-2); background: var(--surface-h); }
    .icon-btn svg { width: 14px; height: 14px; }

    .topbar__spacer { flex: 1; }
    .topbar__user { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-mute); }
    .topbar__role {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      background: var(--accent-bg); color: var(--accent);
    }
    .topbar__back {
      font-size: 12px; padding: 6px 12px;
      border: 1px solid var(--line); border-radius: 999px;
      color: var(--fg-mute); transition: all 0.12s ease;
    }
    .topbar__back:hover { color: var(--fg); border-color: var(--line-2); }

    /* ============ Hint banner ============ */
    .hint {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px;
      background: linear-gradient(90deg, rgba(110,107,255,0.18) 0%, rgba(110,107,255,0.04) 60%, transparent 100%);
      border-bottom: 1px solid var(--line);
      font-size: 13px; color: var(--fg);
    }
    .hint__em {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
      background: var(--accent); color: #fff; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      box-shadow: 0 0 0 0 rgba(110,107,255,0.6);
      animation: hintPulse 1.6s infinite;
    }
    @keyframes hintPulse {
      0%   { box-shadow: 0 0 0 0 rgba(110,107,255,0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(110,107,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(110,107,255,0); }
    }
    .hint .arrow { color: var(--accent); font-weight: 700; }
    .hint__close {
      margin-left: auto;
      background: transparent; border: 0; color: var(--fg-mute);
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
    }
    .hint__close:hover { color: var(--fg); background: var(--surface-h); }
    .hint.is-hidden { display: none; }

    /* ============ Layout ============ */
    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: calc(100vh - 56px);
    }
    .layout.has-hint { height: calc(100vh - 56px - 45px); }
    @media (min-width: 1680px) {
      .layout { grid-template-columns: 1fr 420px; }
    }

    /* ============ Browser window ============ */
    .stage {
      padding: 18px;
      overflow: hidden;
      display: flex; flex-direction: column;
      min-width: 0;
    }
    .browser {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 24px 48px -16px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02);
      position: relative;
    }
    .browser__chrome {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: #0B0B12;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .traffic { display: inline-flex; gap: 6px; }
    .traffic span { width: 11px; height: 11px; border-radius: 999px; }
    .traffic span:nth-child(1) { background: #FF5F57; }
    .traffic span:nth-child(2) { background: #FEBC2E; }
    .traffic span:nth-child(3) { background: #28C840; }
    .urlbar {
      flex: 1; height: 28px; padding: 0 14px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11.5px; color: var(--fg-mute);
      overflow: hidden;
    }
    .urlbar .lock { color: var(--ok); flex-shrink: 0; }
    .urlbar .url { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .urlbar__open {
      flex-shrink: 0; font-size: 11px; color: var(--fg-dim); padding: 2px 8px; border-radius: 4px;
    }
    .urlbar__open:hover { color: var(--fg); background: var(--surface-h); }

    .browser__body {
      flex: 1; min-height: 0;
      position: relative;
      background: #fff;
    }
    .browser__body iframe {
      width: 100%; height: 100%; border: 0; display: block;
    }

    /* Arrow pointer hinting at the FAB inside iframe */
    .fab-pointer {
      position: absolute; right: 22px; bottom: 22px;
      pointer-events: none;
      z-index: 5;
      display: flex; align-items: center; gap: 8px;
      color: var(--accent);
      font-size: 12px; font-weight: 700;
      background: rgba(14,14,20,0.92);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 6px 12px;
      box-shadow: 0 8px 24px rgba(110,107,255,0.4);
      animation: fabBounce 1.6s ease-in-out infinite;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .fab-pointer.is-on { opacity: 1; }
    .fab-pointer .arrow { font-size: 14px; }
    @keyframes fabBounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    .browser__loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(14, 14, 20, 0.6);
      color: var(--fg-mute); font-size: 13px;
      pointer-events: none; opacity: 0; transition: opacity 0.15s ease;
    }
    .browser__loading.is-on { opacity: 1; }

    /* ============ Sidebar ============ */
    .sidebar {
      display: flex; flex-direction: column;
      background: var(--surface); border-left: 1px solid var(--line);
      min-height: 0;
    }
    .side__head {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .side__title {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 14px; font-weight: 700; color: var(--fg);
      margin: 0 0 10px;
    }
    .side__title .count {
      font-size: 12px; font-weight: 600; color: var(--fg-mute);
      padding: 2px 8px; border-radius: 999px;
      background: var(--bg); border: 1px solid var(--line);
    }
    .side__filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      background: transparent; border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px; color: var(--fg-mute);
      transition: all 0.12s ease;
    }
    .chip:hover { color: var(--fg); border-color: var(--line-2); }
    .chip.is-active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .chip .num { font-size: 11px; font-weight: 600; opacity: 0.7; }

    .side__list {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 12px;
    }
    .side__list::-webkit-scrollbar { width: 6px; }
    .side__list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }

    .side__empty {
      padding: 60px 20px; text-align: center;
      color: var(--fg-dim); font-size: 13px; line-height: 1.7;
    }
    .side__empty .em {
      font-size: 32px; margin-bottom: 12px; opacity: 0.6;
    }
    .side__empty .accent { color: var(--accent); }

    .cmt {
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px;
      margin-bottom: 8px;
      transition: border-color 0.12s ease, background 0.12s ease;
      cursor: pointer;
    }
    .cmt:hover { border-color: var(--line-2); background: var(--surface-h); }
    .cmt.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .cmt.is-resolved { opacity: 0.55; }
    .cmt.is-other-page { opacity: 0.55; }

    .cmt__head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .cmt__num {
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff;
      border-radius: 999px;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }
    .cmt.is-resolved .cmt__num { background: var(--ok); }
    .cmt__target {
      flex: 1; min-width: 0;
      font-size: 11px; color: var(--fg-dim);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cmt__status {
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      padding: 2px 6px; border-radius: 4px;
      background: var(--accent-bg); color: var(--accent);
      flex-shrink: 0;
    }
    .cmt.is-resolved .cmt__status { background: var(--ok-bg); color: var(--ok); }
    .cmt__page {
      font-size: 10.5px; color: var(--fg-dim);
      margin-bottom: 6px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .cmt__body {
      font-size: 13px; color: var(--fg); line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cmt__meta {
      margin-top: 6px;
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--fg-dim);
    }
    .cmt__meta .author { color: var(--fg-mute); }
    .cmt__replies {
      margin-left: 4px; color: var(--accent);
      display: inline-flex; align-items: center; gap: 4px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="brand">SCM HUB<span class="dot"></span>협업 VOC</span>
    <span class="topbar__sep"></span>
    <select class="page-select" id="pageSelect"></select>
    <button class="icon-btn" id="reloadBtn" title="새로고침">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8M21 4v4h-4M21 12a9 9 0 0 1-15.3 6.4L3 16M3 20v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="topbar__spacer"></span>
    <span class="topbar__user">
      <span id="userName">—</span>
      <span class="topbar__role" id="userRole" style="display:none;">—</span>
    </span>
    <a class="topbar__back" href="/index.html">← Workspace</a>
  </header>

  <div class="hint" id="hint">
    <span class="hint__em">💬</span>
    <span>데모의 <b>우하단 보라색 버튼</b><span class="arrow"> →</span> 누르면 <b>코멘트 모드</b> 시작 → 화면 위 컴포넌트를 클릭해 의견을 남겨주세요.</span>
    <button class="hint__close" id="hintClose">알겠어요</button>
  </div>

  <div class="layout" id="layout">
    <section class="stage">
      <div class="browser" id="browser">
        <div class="browser__chrome">
          <span class="traffic"><span></span><span></span><span></span></span>
          <span class="urlbar">
            <svg class="lock" width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5V11z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="url" id="urlText">/demo/dashboard.html</span>
            <a class="urlbar__open" id="urlOpen" href="#" target="_blank" rel="noopener" title="새 탭에서 열기">↗</a>
          </span>
        </div>
        <div class="browser__body" id="browserBody">
          <div class="browser__loading is-on" id="browserLoading">불러오는 중…</div>
          <iframe id="demoFrame" src="about:blank"></iframe>
          <div class="fab-pointer" id="fabPointer"><span>여기 보세요</span><span class="arrow">↘</span></div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="side__head">
        <h3 class="side__title">코멘트 <span class="count" id="cmtCount">0</span></h3>
        <div class="side__filters" id="filters">
          <button class="chip is-active" data-filter="page">이 페이지 <span class="num" id="cntPage">0</span></button>
          <button class="chip" data-filter="open">미해결 <span class="num" id="cntOpen">0</span></button>
          <button class="chip" data-filter="resolved">해결됨 <span class="num" id="cntResolved">0</span></button>
          <button class="chip" data-filter="all">전체 <span class="num" id="cntAll">0</span></button>
        </div>
      </div>
      <div class="side__list" id="cmtList"></div>
    </aside>
  </div>

  <script>
  (function () {
    'use strict';
    const STORAGE_KEY = 'scm:voc:comments:v1';
    const PAGES = [
      { path: '/demo/dashboard.html',                label: '대시보드' },
      { path: '/demo/sku-management.html',           label: 'SKU 관리' },
      { path: '/demo/sku-detail.html',               label: 'SKU 상세' },
      { path: '/demo/sku-register.html',             label: 'SKU 등록' },
      { path: '/demo/editshop-restock-request.html', label: '편집샵 보충 요청' },
      { path: '/demo/editshop-restock-status.html',  label: '편집샵 보충 현황' },
      { path: '/demo/index.html',                    label: '무탠 전개상품 관리' },
    ];

    const state = {
      comments: load(),
      filter: 'page',
      currentPage: PAGES[0].path,
      iframeReady: false,
      pendingOpenId: null,
    };

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch { return []; }
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }
    function relTime(t) {
      const d = (Date.now() - t) / 1000;
      if (d < 60)        return '방금';
      if (d < 3600)      return Math.floor(d / 60) + '분 전';
      if (d < 86400)     return Math.floor(d / 3600) + '시간 전';
      if (d < 86400 * 7) return Math.floor(d / 86400) + '일 전';
      const dt = new Date(t);
      return `${dt.getMonth() + 1}/${dt.getDate()}`;
    }
    function formatTarget(c) {
      if (!c) return '';
      const tag = (c.elementTag || '').toLowerCase();
      const txt = (c.elementText || '').replace(/\s+/g, ' ').trim();
      if (txt) return `<${tag || 'el'}> "${txt.length > 36 ? txt.slice(0, 36) + '…' : txt}"`;
      return c.selector || `<${tag}>`;
    }
    function pageLabel(p) {
      const f = PAGES.find((x) => x.path === p);
      return f ? f.label : p;
    }

    const $ = (s) => document.querySelector(s);
    const pageSelect = $('#pageSelect');
    const reloadBtn = $('#reloadBtn');
    const iframe = $('#demoFrame');
    const urlText = $('#urlText');
    const urlOpen = $('#urlOpen');
    const browserLoading = $('#browserLoading');
    const fabPointer = $('#fabPointer');
    const cmtList = $('#cmtList');
    const cmtCount = $('#cmtCount');
    const filters = $('#filters');
    const hint = $('#hint');
    const layout = $('#layout');
    const HINT_KEY = 'scm:voc:hintDismissed';

    // ====================================================
    // Init
    // ====================================================
    function init() {
      // hint visibility
      if (localStorage.getItem(HINT_KEY) === '1') {
        hint.classList.add('is-hidden');
      } else {
        layout.classList.add('has-hint');
      }
      $('#hintClose').addEventListener('click', () => {
        hint.classList.add('is-hidden');
        layout.classList.remove('has-hint');
        try { localStorage.setItem(HINT_KEY, '1'); } catch {}
      });

      // page selector
      pageSelect.innerHTML = PAGES.map((p) => `<option value="${p.path}">${p.label}</option>`).join('');
      pageSelect.value = state.currentPage;
      urlText.textContent = state.currentPage;
      urlOpen.href = state.currentPage;
      navigateTo(state.currentPage);

      pageSelect.addEventListener('change', () => {
        navigateTo(pageSelect.value);
      });
      reloadBtn.addEventListener('click', () => {
        if (!iframe.contentWindow) return;
        showLoading(true);
        try { iframe.contentWindow.location.reload(); }
        catch { iframe.src = state.currentPage; }
      });
      iframe.addEventListener('load', () => {
        showLoading(false);
        try {
          const path = iframe.contentWindow.location.pathname;
          if (path && path !== 'about:blank') {
            state.currentPage = path;
            urlText.textContent = path;
            urlOpen.href = path;
            if (PAGES.some((p) => p.path === path)) pageSelect.value = path;
          }
        } catch {}
        // pointer hint shown briefly per page
        showFabPointer();
      });

      filters.addEventListener('click', onFilterClick);

      // listen to overlay messages
      window.addEventListener('message', (e) => {
        const d = e && e.data;
        if (!d || typeof d !== 'object') return;
        if (d.type === 'voc-ready') {
          state.iframeReady = true;
          // if a pending comment was queued before iframe was ready, open now
          if (state.pendingOpenId) {
            sendOpen(state.pendingOpenId);
            state.pendingOpenId = null;
          }
        } else if (d.type === 'voc-changed') {
          state.comments = load();
          renderList();
        }
      });

      // localStorage cross-tab sync
      window.addEventListener('storage', (e) => {
        if (e.key !== STORAGE_KEY) return;
        state.comments = load();
        renderList();
      });

      // auth
      document.addEventListener('scm:auth-ready', (e) => {
        const u = e.detail && e.detail.user;
        if (!u) return;
        $('#userName').textContent = u.name || u.email;
        const roleEl = $('#userRole');
        roleEl.textContent = u.role;
        roleEl.dataset.role = u.role;
        roleEl.style.display = '';
      });

      renderList();
    }

    function navigateTo(path, openCmtId) {
      state.currentPage = path;
      urlText.textContent = path;
      urlOpen.href = path;
      pageSelect.value = path;
      state.iframeReady = false;
      state.pendingOpenId = openCmtId || null;
      showLoading(true);
      // use hash for cross-page open as a fallback (overlay handles it on load)
      iframe.src = openCmtId ? (path + '#voc=' + openCmtId) : path;
      renderList();
    }

    function showLoading(on) { browserLoading.classList.toggle('is-on', !!on); }

    let pointerTimer = null;
    function showFabPointer() {
      // only show when there are no comments yet on this page (first-time UX)
      const hasAny = state.comments.some((c) => c.page === state.currentPage);
      if (hasAny) { fabPointer.classList.remove('is-on'); return; }
      fabPointer.classList.add('is-on');
      if (pointerTimer) clearTimeout(pointerTimer);
      pointerTimer = setTimeout(() => fabPointer.classList.remove('is-on'), 4200);
    }

    function sendOpen(id) {
      try { iframe.contentWindow && iframe.contentWindow.postMessage({ type: 'voc-open', id }, '*'); }
      catch {}
    }

    // ====================================================
    // Comments list
    // ====================================================
    function renderList() {
      const all = state.comments;
      const onPage = all.filter((c) => c.page === state.currentPage);
      const open   = all.filter((c) => c.status !== 'resolved');
      const done   = all.filter((c) => c.status === 'resolved');

      $('#cntAll').textContent = all.length;
      $('#cntPage').textContent = onPage.length;
      $('#cntOpen').textContent = open.length;
      $('#cntResolved').textContent = done.length;

      let list;
      if (state.filter === 'page') list = onPage;
      else if (state.filter === 'open') list = open;
      else if (state.filter === 'resolved') list = done;
      else list = all;

      list = [...list].sort((a, b) => {
        const ap = a.page === state.currentPage ? 0 : 1;
        const bp = b.page === state.currentPage ? 0 : 1;
        if (ap !== bp) return ap - bp;
        return b.createdAt - a.createdAt;
      });

      cmtCount.textContent = list.length;

      if (list.length === 0) {
        cmtList.innerHTML = `
          <div class="side__empty">
            <div class="em">💭</div>
            <div>${state.filter === 'page'
              ? '이 페이지에 아직 코멘트가 없습니다.<br/>데모의 <span class="accent">우하단 💬 버튼</span>을 눌러<br/>의견을 남겨보세요.'
              : '조건에 맞는 코멘트가 없습니다.'}</div>
          </div>
        `;
        return;
      }

      const idxByPage = new Map();
      [...state.comments].sort((a, b) => a.createdAt - b.createdAt).forEach((c) => {
        const arr = idxByPage.get(c.page) || [];
        arr.push(c.id);
        idxByPage.set(c.page, arr);
      });
      const idxOf = (c) => (idxByPage.get(c.page) || []).indexOf(c.id) + 1;

      cmtList.innerHTML = list.map((c) => {
        const last = c.thread[c.thread.length - 1];
        const cls = ['cmt'];
        if (c.status === 'resolved') cls.push('is-resolved');
        if (c.page !== state.currentPage) cls.push('is-other-page');
        return `
          <div class="${cls.join(' ')}" data-cmt-id="${c.id}">
            <div class="cmt__head">
              <span class="cmt__num">${idxOf(c)}</span>
              <span class="cmt__target">${escapeHtml(formatTarget(c))}</span>
              <span class="cmt__status">${c.status === 'resolved' ? '해결됨' : '미해결'}</span>
            </div>
            <div class="cmt__page">📄 ${escapeHtml(pageLabel(c.page))}</div>
            <div class="cmt__body">${escapeHtml(last ? last.text : '')}</div>
            <div class="cmt__meta">
              <span class="author">${escapeHtml(c.author || '익명')}</span>
              <span>·</span>
              <span>${relTime(c.createdAt)}</span>
              ${c.thread.length > 1 ? `<span class="cmt__replies">💬 ${c.thread.length}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');

      cmtList.querySelectorAll('.cmt').forEach((el) => {
        el.addEventListener('click', () => {
          const id = el.dataset.cmtId;
          const c = state.comments.find((x) => x.id === id);
          if (!c) return;
          if (c.page !== state.currentPage) {
            navigateTo(c.page, c.id);
          } else if (state.iframeReady) {
            sendOpen(c.id);
          } else {
            state.pendingOpenId = c.id;
          }
        });
      });
    }

    function onFilterClick(e) {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      filters.querySelectorAll('.chip').forEach((b) => b.classList.toggle('is-active', b === btn));
      state.filter = btn.dataset.filter;
      renderList();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
