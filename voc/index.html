<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCM HUB · 협업 VOC (작업자)</title>
  <script src="/auth-gate.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg:        #0E0E14;
      --surface:   #15151D;
      --surface-h: #1B1B25;
      --line:      #25252F;
      --line-2:    #34344A;
      --fg:        #FFFFFF;
      --fg-mute:   rgba(255,255,255,0.62);
      --fg-dim:    rgba(255,255,255,0.40);
      --accent:    #6E6BFF;
      --accent-bg: rgba(110,107,255,0.14);
      --accent-2:  #5754ff;
      --ok:        #34D399;
      --ok-bg:     rgba(52,211,153,0.14);
      --warn:      #F59E0B;
      --warn-bg:   rgba(245,158,11,0.14);
      --danger:    #F87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.01em;
      overflow: hidden;
      min-width: 1280px;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }

    /* ============ Top header ============ */
    .topbar {
      position: relative; z-index: 50;
      display: flex; align-items: center; gap: 12px;
      height: 56px; padding: 0 20px;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 700; font-size: 14px; color: var(--fg); letter-spacing: 0.4px; white-space: nowrap; }
    .brand .dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--accent); margin: 0 8px 1px; vertical-align: middle; }
    .brand .role-tag {
      display: inline-block; margin-left: 8px;
      padding: 2px 7px; border-radius: 999px;
      background: var(--warn-bg); color: var(--warn);
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .topbar__sep { width: 1px; height: 20px; background: var(--line); }

    .page-select {
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--line); border-radius: 8px;
      font-family: inherit; font-size: 13px;
      padding: 7px 30px 7px 12px; outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23999' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 10px center;
      cursor: pointer; min-width: 220px;
    }
    .page-select:hover { border-color: var(--line-2); }
    .page-select:focus { border-color: var(--accent); }
    .page-select.menu-l2 { min-width: 200px; }

    /* L1 menu chips (depth 1) */
    .menu-l1 {
      display: inline-flex; gap: 2px;
      padding: 3px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 8px;
    }
    .menu-l1__chip {
      padding: 5px 12px;
      background: transparent; color: var(--fg-mute); border: 0;
      border-radius: 6px;
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .menu-l1__chip:hover { color: var(--fg); }
    .menu-l1__chip.is-active { background: var(--accent); color: #fff; }
    .menu-arrow { color: var(--fg-dim); font-size: 16px; user-select: none; }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      background: transparent; color: var(--fg-mute);
      border: 1px solid var(--line); border-radius: 8px;
      transition: all 0.12s ease;
    }
    .icon-btn:hover { color: var(--fg); border-color: var(--line-2); background: var(--surface-h); }
    .icon-btn svg { width: 14px; height: 14px; }

    .sim-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px;
      background: var(--warn-bg); color: var(--warn);
      border: 1px solid rgba(245,158,11,0.4); border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }
    .sim-status .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; animation: simPulse 1.4s infinite; }
    @keyframes simPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .sim-status button {
      background: transparent; border: 0; color: currentColor;
      font-size: 11px; font-weight: 600; padding: 0 0 0 4px; cursor: pointer;
    }
    .sim-status button:hover { text-decoration: underline; }

    .topbar__spacer { flex: 1; }
    .topbar__user { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-mute); }
    .topbar__role {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      background: var(--accent-bg); color: var(--accent);
    }
    .topbar__back {
      font-size: 12px; padding: 6px 12px;
      border: 1px solid var(--line); border-radius: 999px;
      color: var(--fg-mute); transition: all 0.12s ease;
    }
    .topbar__back:hover { color: var(--fg); border-color: var(--line-2); }

    /* ============ Layout ============ */
    .layout {
      display: grid;
      grid-template-columns: 1fr 440px;
      height: calc(100vh - 56px);
    }
    @media (min-width: 1680px) {
      .layout { grid-template-columns: 1fr 480px; }
    }

    /* ============ Browser window ============ */
    .stage {
      padding: 18px;
      overflow: hidden;
      display: flex; flex-direction: column;
      min-width: 0;
    }
    .browser {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 24px 48px -16px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02);
      position: relative;
    }
    .browser__chrome {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: #0B0B12;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .traffic { display: inline-flex; gap: 6px; }
    .traffic span { width: 11px; height: 11px; border-radius: 999px; }
    .traffic span:nth-child(1) { background: #FF5F57; }
    .traffic span:nth-child(2) { background: #FEBC2E; }
    .traffic span:nth-child(3) { background: #28C840; }
    .urlbar {
      flex: 1; height: 28px; padding: 0 14px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11.5px; color: var(--fg-mute);
      overflow: hidden;
    }
    .urlbar .lock { color: var(--ok); flex-shrink: 0; }
    .urlbar .url { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .urlbar__open {
      flex-shrink: 0; font-size: 11px; color: var(--fg-dim); padding: 2px 8px; border-radius: 4px;
    }
    .urlbar__open:hover { color: var(--fg); background: var(--surface-h); }

    .browser__body { flex: 1; min-height: 0; position: relative; background: #fff; }
    .browser__body iframe { width: 100%; height: 100%; border: 0; display: block; }
    .browser__loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(14, 14, 20, 0.6);
      color: var(--fg-mute); font-size: 13px;
      pointer-events: none; opacity: 0; transition: opacity 0.15s ease;
    }
    .browser__loading.is-on { opacity: 1; }

    /* ============ Sidebar ============ */
    .sidebar {
      display: flex; flex-direction: column;
      background: var(--surface); border-left: 1px solid var(--line);
      min-height: 0;
      overflow: hidden;
    }
    .sidebar__view {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }

    /* ---- LIST VIEW ---- */
    .side__head {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .side__title {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 14px; font-weight: 700; color: var(--fg);
      margin: 0 0 10px;
    }
    .side__title .count {
      font-size: 12px; font-weight: 600; color: var(--fg-mute);
      padding: 2px 8px; border-radius: 999px;
      background: var(--bg); border: 1px solid var(--line);
    }
    .side__filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      background: transparent; border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px; color: var(--fg-mute);
      transition: all 0.12s ease;
    }
    .chip:hover { color: var(--fg); border-color: var(--line-2); }
    .chip.is-active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .chip .num { font-size: 11px; font-weight: 600; opacity: 0.7; }

    .side__list {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 12px;
    }
    .side__list::-webkit-scrollbar { width: 6px; }
    .side__list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }

    .side__empty {
      padding: 60px 20px; text-align: center;
      color: var(--fg-dim); font-size: 13px; line-height: 1.7;
    }
    .side__empty .em { font-size: 32px; margin-bottom: 12px; opacity: 0.6; }
    .side__empty .accent { color: var(--accent); }

    .cmt {
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px;
      margin-bottom: 8px;
      transition: border-color 0.12s ease, background 0.12s ease;
      cursor: pointer;
      position: relative;
    }
    .cmt:hover { border-color: var(--line-2); background: var(--surface-h); }
    .cmt.is-resolved { opacity: 0.55; }
    .cmt.is-other-page { opacity: 0.55; }
    .cmt.has-proposal {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
    }
    .cmt.is-sim-active {
      border-color: var(--warn);
      box-shadow: 0 0 0 1px var(--warn-bg);
    }

    .cmt__head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .cmt__num {
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff;
      border-radius: 999px;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }
    .cmt.is-resolved .cmt__num { background: var(--ok); }
    .cmt__target {
      flex: 1; min-width: 0;
      font-size: 11px; color: var(--fg-dim);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cmt__status {
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      padding: 2px 6px; border-radius: 4px;
      background: var(--accent-bg); color: var(--accent);
      flex-shrink: 0;
    }
    .cmt.is-resolved .cmt__status { background: var(--ok-bg); color: var(--ok); }
    .cmt__page {
      font-size: 10.5px; color: var(--fg-dim);
      margin-bottom: 6px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .cmt__body {
      font-size: 13px; color: var(--fg); line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cmt__meta {
      margin-top: 6px;
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--fg-dim);
    }
    .cmt__meta .author { color: var(--fg-mute); }
    .cmt__replies { margin-left: 4px; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; }
    .cmt__sim {
      margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      padding: 2px 6px; border-radius: 4px;
      background: var(--warn-bg); color: var(--warn);
    }
    .cmt__proposal-flag {
      margin-left: 4px;
      font-size: 10.5px; color: var(--accent); font-weight: 700;
    }

    /* ---- DETAIL VIEW ---- */
    .detail__head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .detail__back {
      background: transparent; color: var(--fg-mute);
      border: 1px solid var(--line); border-radius: 8px;
      height: 30px; padding: 0 12px;
      font-size: 12px; transition: all 0.12s ease;
    }
    .detail__back:hover { color: var(--fg); border-color: var(--line-2); }
    .detail__num {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff; border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .detail__num.is-resolved { background: var(--ok); }
    .detail__head__page { flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail__status {
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      padding: 3px 8px; border-radius: 4px;
      background: var(--accent-bg); color: var(--accent);
    }
    .detail__status.is-resolved { background: var(--ok-bg); color: var(--ok); }

    .detail__body {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 18px 20px 24px;
    }
    .detail__body::-webkit-scrollbar { width: 6px; }
    .detail__body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }

    .sec { margin-bottom: 22px; }
    .sec__lab {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
      color: var(--fg-mute);
      margin-bottom: 8px;
    }
    .sec__lab__act {
      background: transparent; border: 0; color: var(--accent);
      font-size: 11px; font-weight: 600; cursor: pointer; letter-spacing: 0;
      padding: 2px 6px; border-radius: 4px;
    }
    .sec__lab__act:hover { background: var(--accent-bg); }

    .loc {
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      padding: 12px 14px;
    }
    .loc__row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 12px; }
    .loc__row:last-child { margin-bottom: 0; }
    .loc__k { width: 56px; flex-shrink: 0; font-size: 11px; color: var(--fg-dim); }
    .loc__v { color: var(--fg); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; word-break: break-all; }
    .loc__v.text { font-family: inherit; font-size: 13px; }

    .replies { display: flex; flex-direction: column; gap: 8px; }
    .reply {
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px;
    }
    .reply__meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--fg-dim); margin-bottom: 4px;
    }
    .reply__author { color: var(--fg); font-weight: 600; font-size: 12px; }
    .reply__del {
      margin-left: auto; background: transparent; border: 0; color: var(--fg-dim);
      font-size: 11px; padding: 2px 4px; cursor: pointer;
    }
    .reply__del:hover { color: var(--danger); }
    .reply__body {
      font-size: 13px; color: var(--fg); line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }

    .compose { margin-top: 10px; }
    .compose textarea {
      width: 100%;
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      color: var(--fg);
      font-family: inherit; font-size: 13px; line-height: 1.55;
      padding: 10px 12px; resize: vertical; min-height: 64px;
      outline: none;
      transition: border-color 0.12s ease;
    }
    .compose textarea:focus { border-color: var(--accent); }
    .compose textarea::placeholder { color: var(--fg-dim); }
    .compose__row {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
    }
    .compose__hint { flex: 1; font-size: 11px; color: var(--fg-dim); }

    .proposal__row { display: flex; flex-direction: column; gap: 10px; }
    .proposal__field { display: flex; flex-direction: column; gap: 6px; }
    .proposal__field label {
      font-size: 11px; color: var(--fg-mute); font-weight: 600;
    }
    .proposal__note, .proposal__css {
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      color: var(--fg);
      padding: 10px 12px; resize: vertical;
      outline: none;
      transition: border-color 0.12s ease;
    }
    .proposal__note {
      font-family: inherit; font-size: 13px; line-height: 1.55;
      min-height: 56px;
    }
    .proposal__css {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px; line-height: 1.5;
      min-height: 110px;
      tab-size: 2;
    }
    .proposal__note:focus, .proposal__css:focus { border-color: var(--accent); }
    .proposal__hint {
      font-size: 11px; color: var(--fg-dim); line-height: 1.6;
      padding: 8px 10px; background: var(--bg); border: 1px dashed var(--line);
      border-radius: 6px; margin-top: 4px;
    }
    .proposal__hint code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px; color: var(--accent);
      padding: 1px 4px; border-radius: 3px; background: var(--accent-bg);
    }

    .row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      height: 32px; padding: 0 14px;
      border: 0; border-radius: 7px;
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      transition: all 0.12s ease;
    }
    .btn--ghost { background: transparent; color: var(--fg-mute); border: 1px solid var(--line); }
    .btn--ghost:hover { color: var(--fg); border-color: var(--line-2); }
    .btn--primary { background: var(--accent); color: #fff; }
    .btn--primary:hover { background: var(--accent-2); }
    .btn--ok { background: var(--ok); color: #062b21; }
    .btn--ok:hover { background: #2bc78c; }
    .btn--warn { background: var(--warn); color: #3a2700; }
    .btn--warn:hover { background: #e58a06; }
    .btn--danger { background: transparent; color: var(--danger); border: 1px solid rgba(248,113,113,0.4); }
    .btn--danger:hover { background: rgba(248,113,113,0.12); border-color: var(--danger); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .saved-note {
      font-size: 11px; color: var(--ok);
      opacity: 0; transition: opacity 0.2s ease;
    }
    .saved-note.is-on { opacity: 1; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      z-index: 200;
      background: var(--surface); color: var(--fg);
      border: 1px solid var(--line-2); border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none;
      transition: all 0.2s ease;
    }
    .toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="brand">SCM HUB<span class="dot"></span>협업 VOC<span class="role-tag">작업자</span></span>
    <span class="topbar__sep"></span>
    <div class="menu-l1" id="menuL1"></div>
    <span class="menu-arrow">›</span>
    <select class="page-select menu-l2" id="l2Select"></select>
    <button class="icon-btn" id="reloadBtn" title="새로고침">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8M21 4v4h-4M21 12a9 9 0 0 1-15.3 6.4L3 16M3 20v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span id="simStatus" class="sim-status" hidden>
      <span class="dot"></span><span>시뮬 적용 중 <span id="simStatusCount">0</span></span>
      <button id="simResetAll">모두 해제</button>
    </span>
    <span class="topbar__spacer"></span>
    <span class="topbar__user">
      <span id="userName">—</span>
      <span class="topbar__role" id="userRole" style="display:none;">—</span>
    </span>
    <a class="topbar__back" href="/index.html">← Workspace</a>
  </header>

  <div class="layout">
    <section class="stage">
      <div class="browser" id="browser">
        <div class="browser__chrome">
          <span class="traffic"><span></span><span></span><span></span></span>
          <span class="urlbar">
            <svg class="lock" width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5V11z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="url" id="urlText">/demo/dashboard.html</span>
            <a class="urlbar__open" id="urlOpen" href="#" target="_blank" rel="noopener" title="새 탭에서 열기">↗</a>
          </span>
        </div>
        <div class="browser__body" id="browserBody">
          <div class="browser__loading is-on" id="browserLoading">불러오는 중…</div>
          <iframe id="demoFrame" src="about:blank"></iframe>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <!-- LIST VIEW -->
      <div class="sidebar__view" id="listView">
        <div class="side__head">
          <h3 class="side__title">코멘트 <span class="count" id="cmtCount">0</span></h3>
          <div class="side__filters" id="filters">
            <button class="chip is-active" data-filter="page">이 페이지 <span class="num" id="cntPage">0</span></button>
            <button class="chip" data-filter="open">미해결 <span class="num" id="cntOpen">0</span></button>
            <button class="chip" data-filter="resolved">해결됨 <span class="num" id="cntResolved">0</span></button>
            <button class="chip" data-filter="all">전체 <span class="num" id="cntAll">0</span></button>
          </div>
        </div>
        <div class="side__list" id="cmtList"></div>
      </div>

      <!-- DETAIL VIEW -->
      <div class="sidebar__view" id="detailView" hidden>
        <div class="detail__head">
          <button class="detail__back" id="detailBack">← 목록</button>
          <span class="detail__num" id="dNum">1</span>
          <span class="detail__head__page" id="dPage"></span>
          <span class="detail__status" id="dStatus">미해결</span>
        </div>
        <div class="detail__body">
          <!-- Location -->
          <section class="sec">
            <div class="sec__lab">
              <span>📍 위치</span>
              <button class="sec__lab__act" id="dLocate">위치로 이동 ↗</button>
            </div>
            <div class="loc">
              <div class="loc__row"><span class="loc__k">엘리먼트</span><span class="loc__v" id="dTag">—</span></div>
              <div class="loc__row"><span class="loc__k">텍스트</span><span class="loc__v text" id="dText">—</span></div>
              <div class="loc__row"><span class="loc__k">셀렉터</span><span class="loc__v" id="dSel">—</span></div>
              <div class="loc__row"><span class="loc__k">좌표</span><span class="loc__v" id="dCoord">—</span></div>
            </div>
          </section>

          <!-- Thread -->
          <section class="sec">
            <div class="sec__lab"><span>💬 스레드</span></div>
            <div class="replies" id="dReplies"></div>
            <div class="compose">
              <textarea id="dReply" placeholder="답글을 남기거나 추가 질문을 작성…"></textarea>
              <div class="compose__row">
                <span class="compose__hint">⌘/Ctrl + Enter 전송</span>
                <button class="btn btn--primary" id="dReplySend">답글 등록</button>
              </div>
            </div>
          </section>

          <!-- Proposal + simulate -->
          <section class="sec">
            <div class="sec__lab">
              <span>💡 개선안 / 시뮬레이션</span>
              <span class="saved-note" id="dSaved">저장됨</span>
            </div>
            <div class="proposal__row">
              <div class="proposal__field">
                <label>개선안 메모</label>
                <textarea class="proposal__note" id="dNote" placeholder="이 컴포넌트를 어떻게 고칠지 설명…"></textarea>
              </div>
              <div class="proposal__field">
                <label>CSS 오버라이드 (시뮬레이션용)</label>
                <textarea class="proposal__css" id="dCss" spellcheck="false" placeholder="예: .btn--primary { background: #DC2626; color: #fff; }"></textarea>
                <div class="proposal__hint">
                  💡 <code id="dSelHint">selector</code> 가 자동으로 채워졌습니다. 값을 바꾼 뒤 <b>시뮬레이션 적용</b> 을 누르면 실제 데모에 즉시 반영돼서 결과를 미리 볼 수 있습니다.
                </div>
              </div>
              <div class="row-btns">
                <button class="btn btn--warn" id="simApplyBtn">▶ 시뮬레이션 적용</button>
                <button class="btn btn--ghost" id="simResetBtn">↺ 시뮬 해제</button>
                <button class="btn btn--ghost" id="proposalSaveBtn">💾 저장</button>
              </div>
            </div>
          </section>

          <!-- Status / actions -->
          <section class="sec">
            <div class="sec__lab"><span>⚙️ 상태</span></div>
            <div class="row-btns">
              <button class="btn btn--ok" id="dResolveBtn">✓ 해결됨으로 표시</button>
              <button class="btn btn--danger" id="dDeleteBtn">핀 삭제</button>
            </div>
          </section>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    'use strict';
    const STORAGE_KEY = 'scm:voc:comments:v1';
    // Two-depth menu mirroring the demo's LNB structure.
    const MENU = [
      { l1: 'dashboard', label: '대시보드', children: [
        { path: '/demo/dashboard.html', label: '대시보드' },
      ]},
      { l1: 'store', label: '스토어', children: [
        { path: '/demo/index.html',                    label: '무탠 전개상품 관리' },
        { path: '/demo/editshop-restock-request.html', label: '편집샵 보충 요청' },
        { path: '/demo/editshop-restock-status.html',  label: '편집샵 보충 현황' },
      ]},
      { l1: 'hanger', label: '상품 관리', children: [
        { path: '/demo/sku-management.html', label: 'SKU 관리' },
        { path: '/demo/sku-register.html',   label: 'SKU 등록' },
        { path: '/demo/sku-detail.html',     label: 'SKU 상세' },
      ]},
    ];
    // Flat list — preserved for label lookups (sidebar 'pageLabel(path)').
    const PAGES = MENU.flatMap((m) => m.children);
    function findMenuByPath(path) {
      for (const m of MENU) {
        const c = m.children.find((x) => x.path === path);
        if (c) return { l1: m, l2: c };
      }
      return null;
    }

    const state = {
      comments: load(),
      filter: 'page',
      currentPage: PAGES[0].path,
      iframeReady: false,
      view: 'list',          // 'list' | 'detail'
      selectedId: null,
      simActive: new Set(),  // ids whose CSS sim is currently injected in iframe
      saveTimer: null,
      user: { email: 'guest@local', name: '게스트' },
    };

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch { return []; }
    }
    // 권한 키 → 화면 표기. DB/API 키는 그대로 super/admin/biz/internal.
    const ROLE_LABEL_KO = {
      super:    '최고 어드민',
      admin:    '어드민',
      biz:      '현업',
      internal: '내부',
    };
    // Pin/badge color per role — mirrors comment-overlay.js. Keep in sync.
    const ROLE_COLORS = {
      super:    '#F59E0B',
      admin:    '#6E6BFF',
      biz:      '#10B981',
      internal: '#9CA3AF',
    };
    const FALLBACK_COLORS = [
      '#6E6BFF', '#34D399', '#F59E0B', '#EC4899',
      '#3B82F6', '#A855F7', '#F43F5E', '#14B8A6',
      '#FB923C', '#22D3EE', '#84CC16', '#F97316',
    ];
    function roleColor(role, fallbackEmail) {
      if (role && ROLE_COLORS[role]) return ROLE_COLORS[role];
      const s = String(fallbackEmail || 'guest');
      let h = 0;
      for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0;
      return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
    }
    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.comments)); }
      catch (e) { console.warn('voc: save failed', e); }
    }
    function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 10); }
    function now() { return Date.now(); }
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }
    function relTime(t) {
      const d = (Date.now() - t) / 1000;
      if (d < 60)        return '방금';
      if (d < 3600)      return Math.floor(d / 60) + '분 전';
      if (d < 86400)     return Math.floor(d / 3600) + '시간 전';
      if (d < 86400 * 7) return Math.floor(d / 86400) + '일 전';
      const dt = new Date(t);
      return `${dt.getMonth() + 1}/${dt.getDate()}`;
    }
    function pageLabel(p) {
      const f = PAGES.find((x) => x.path === p);
      return f ? f.label : p;
    }
    function shortTarget(c) {
      if (!c) return '';
      const tag = (c.elementTag || '').toLowerCase();
      const txt = (c.elementText || '').replace(/\s+/g, ' ').trim();
      if (txt) return `<${tag || 'el'}> "${txt.length > 36 ? txt.slice(0, 36) + '…' : txt}"`;
      return c.selector || `<${tag}>`;
    }
    function indexOfInPage(c) {
      const sorted = state.comments
        .filter((x) => x.page === c.page)
        .sort((a, b) => a.createdAt - b.createdAt);
      return sorted.findIndex((x) => x.id === c.id) + 1;
    }
    function findById(id) { return state.comments.find((x) => x.id === id); }
    function defaultCssTemplate(c) {
      const sel = c.selector || 'body';
      return `${sel} {\n  /* 여기에 변경할 CSS 작성 */\n}\n`;
    }

    const $ = (s) => document.querySelector(s);
    const menuL1 = $('#menuL1');
    const l2Select = $('#l2Select');
    const reloadBtn = $('#reloadBtn');
    const iframe = $('#demoFrame');
    const urlText = $('#urlText');
    const urlOpen = $('#urlOpen');
    const browserLoading = $('#browserLoading');
    const cmtList = $('#cmtList');
    const cmtCount = $('#cmtCount');
    const filters = $('#filters');
    const listView = $('#listView');
    const detailView = $('#detailView');
    const dNum = $('#dNum');
    const dPage = $('#dPage');
    const dStatus = $('#dStatus');
    const dTag = $('#dTag');
    const dText = $('#dText');
    const dSel = $('#dSel');
    const dCoord = $('#dCoord');
    const dSelHint = $('#dSelHint');
    const dReplies = $('#dReplies');
    const dReply = $('#dReply');
    const dNote = $('#dNote');
    const dCss = $('#dCss');
    const dSaved = $('#dSaved');
    const simStatusEl = $('#simStatus');
    const simStatusCount = $('#simStatusCount');
    const toastEl = $('#toast');

    // ====================================================
    // Init
    // ====================================================
    function init() {
      // L1 chips
      menuL1.innerHTML = MENU.map((m) => `<button type="button" class="menu-l1__chip" data-l1="${m.l1}">${escapeHtml(m.label)}</button>`).join('');
      menuL1.addEventListener('click', (e) => {
        const btn = e.target.closest('.menu-l1__chip');
        if (!btn) return;
        const target = selectL1(btn.dataset.l1);
        if (target !== state.currentPage) navigateTo(target);
      });
      l2Select.addEventListener('change', () => navigateTo(l2Select.value));

      urlText.textContent = state.currentPage;
      urlOpen.href = state.currentPage;
      // initial render — set up the menu UI then explicitly navigate so
      // the iframe actually loads (iframe.src starts at about:blank).
      const initialMatch = findMenuByPath(state.currentPage) || { l1: MENU[0], l2: MENU[0].children[0] };
      const initialPath = selectL1(initialMatch.l1.l1, initialMatch.l2.path);
      navigateTo(initialPath);

      reloadBtn.addEventListener('click', () => {
        if (!iframe.contentWindow) return;
        showLoading(true);
        try { iframe.contentWindow.location.reload(); }
        catch { iframe.src = state.currentPage; }
      });

      iframe.addEventListener('load', () => {
        showLoading(false);
        try {
          const path = iframe.contentWindow.location.pathname;
          if (path && path !== 'about:blank') {
            state.currentPage = path;
            urlText.textContent = path;
            urlOpen.href = path;
            syncMenuFromPath(path);
          }
        } catch {}
        // page change resets sim tracking (style tags died with previous doc)
        state.simActive.clear();
        updateSimStatus();
        renderList();
      });

      filters.addEventListener('click', onFilterClick);

      $('#detailBack').addEventListener('click', () => goList());
      $('#dLocate').addEventListener('click', onLocate);
      $('#dReplySend').addEventListener('click', onReply);
      dReply.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); onReply(); }
      });

      $('#simApplyBtn').addEventListener('click', onSimApply);
      $('#simResetBtn').addEventListener('click', onSimReset);
      $('#proposalSaveBtn').addEventListener('click', () => saveProposal(true));
      $('#simResetAll').addEventListener('click', onSimResetAll);

      $('#dResolveBtn').addEventListener('click', onResolveToggle);
      $('#dDeleteBtn').addEventListener('click', onDelete);

      // Auto-save proposal as worker types (debounced)
      [dNote, dCss].forEach((el) => {
        el.addEventListener('input', () => {
          if (state.saveTimer) clearTimeout(state.saveTimer);
          state.saveTimer = setTimeout(() => saveProposal(false), 600);
        });
      });

      // overlay messages
      window.addEventListener('message', (e) => {
        const d = e && e.data;
        if (!d || typeof d !== 'object') return;
        if (d.type === 'voc-ready') {
          state.iframeReady = true;
          // VOC iframe → permanently lock GNB/LNB (no nav, no hover-expand).
          postIframe({ type: 'voc-worker-mode', on: true });
          // re-apply any sims we know about (in case of nav-back to same page)
          state.simActive.forEach((id) => {
            const c = findById(id);
            if (c && c.page === state.currentPage && c.proposal && c.proposal.css) {
              postIframe({ type: 'voc-sim-apply', id, css: c.proposal.css });
            }
          });
          updateSimStatus();
        } else if (d.type === 'voc-changed') {
          state.comments = load();
          // refresh detail if same id still present
          if (state.view === 'detail' && state.selectedId) {
            const c = findById(state.selectedId);
            if (c) renderDetail(c);
            else goList();
          }
          renderList();
        }
      });
      window.addEventListener('storage', (e) => {
        if (e.key !== STORAGE_KEY) return;
        state.comments = load();
        if (state.view === 'detail' && state.selectedId) {
          const c = findById(state.selectedId);
          if (c) renderDetail(c);
        }
        renderList();
      });
      document.addEventListener('scm:auth-ready', (e) => {
        const u = e.detail && e.detail.user;
        if (!u) return;
        state.user.email = u.email;
        state.user.name  = u.name || u.email;
        $('#userName').textContent = u.name || u.email;
        const roleEl = $('#userRole');
        roleEl.textContent = ROLE_LABEL_KO[u.role] || u.role;
        roleEl.dataset.role = u.role;
        roleEl.style.display = '';
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.view === 'detail') { goList(); }
      });

      renderList();
    }

    function navigateTo(path) {
      state.currentPage = path;
      urlText.textContent = path;
      urlOpen.href = path;
      syncMenuFromPath(path);
      state.iframeReady = false;
      showLoading(true);
      iframe.src = path;
    }
    function showLoading(on) { browserLoading.classList.toggle('is-on', !!on); }

    // Activate an L1 chip — repopulates L2 select and navigates to either
    // the requested L2 path, the current page if it lives under that L1,
    // or the L1's first child by default.
    // Pure UI update — picks the appropriate L2 path and returns it.
    // Caller decides whether to actually navigate.
    function selectL1(l1id, preferL2Path) {
      const item = MENU.find((m) => m.l1 === l1id) || MENU[0];
      menuL1.querySelectorAll('.menu-l1__chip').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.l1 === item.l1);
      });
      l2Select.innerHTML = item.children
        .map((c) => `<option value="${c.path}">${escapeHtml(c.label)}</option>`).join('');
      l2Select.disabled = item.children.length <= 1;
      let target;
      if (preferL2Path && item.children.some((c) => c.path === preferL2Path)) target = preferL2Path;
      else if (item.children.some((c) => c.path === state.currentPage))      target = state.currentPage;
      else                                                                   target = item.children[0].path;
      l2Select.value = target;
      return target;
    }
    // Reflect a path change (iframe internal nav, sidebar jump, etc.)
    // back into the menu UI without triggering navigation.
    function syncMenuFromPath(path) {
      const m = findMenuByPath(path);
      if (!m) return;
      menuL1.querySelectorAll('.menu-l1__chip').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.l1 === m.l1.l1);
      });
      // rebuild L2 options if the L1 group changed
      const currentValues = Array.from(l2Select.options).map((o) => o.value);
      const expected = m.l1.children.map((c) => c.path);
      const same = currentValues.length === expected.length && currentValues.every((v, i) => v === expected[i]);
      if (!same) {
        l2Select.innerHTML = m.l1.children
          .map((c) => `<option value="${c.path}">${escapeHtml(c.label)}</option>`).join('');
        l2Select.disabled = m.l1.children.length <= 1;
      }
      l2Select.value = path;
    }

    function postIframe(msg) {
      try { iframe.contentWindow && iframe.contentWindow.postMessage(msg, '*'); }
      catch {}
    }

    // ====================================================
    // List
    // ====================================================
    function renderList() {
      const all = state.comments;
      const onPage = all.filter((c) => c.page === state.currentPage);
      const open   = all.filter((c) => c.status !== 'resolved');
      const done   = all.filter((c) => c.status === 'resolved');

      $('#cntAll').textContent = all.length;
      $('#cntPage').textContent = onPage.length;
      $('#cntOpen').textContent = open.length;
      $('#cntResolved').textContent = done.length;

      let list;
      if (state.filter === 'page') list = onPage;
      else if (state.filter === 'open') list = open;
      else if (state.filter === 'resolved') list = done;
      else list = all;

      list = [...list].sort((a, b) => {
        const ap = a.page === state.currentPage ? 0 : 1;
        const bp = b.page === state.currentPage ? 0 : 1;
        if (ap !== bp) return ap - bp;
        return b.createdAt - a.createdAt;
      });

      cmtCount.textContent = list.length;

      if (list.length === 0) {
        cmtList.innerHTML = `
          <div class="side__empty">
            <div class="em">💭</div>
            <div>${state.filter === 'page'
              ? '이 페이지에 코멘트가 없습니다.<br/>데모의 <span class="accent">우하단 💬 버튼</span>으로<br/>현업이 의견을 남기면 여기에 표시됩니다.'
              : '조건에 맞는 코멘트가 없습니다.'}</div>
          </div>`;
        return;
      }

      const idxByPage = new Map();
      [...state.comments].sort((a, b) => a.createdAt - b.createdAt).forEach((c) => {
        const arr = idxByPage.get(c.page) || [];
        arr.push(c.id);
        idxByPage.set(c.page, arr);
      });
      const idxOf = (c) => (idxByPage.get(c.page) || []).indexOf(c.id) + 1;

      cmtList.innerHTML = list.map((c) => {
        const last = c.thread[c.thread.length - 1];
        const cls = ['cmt'];
        if (c.status === 'resolved') cls.push('is-resolved');
        if (c.page !== state.currentPage) cls.push('is-other-page');
        if (c.proposal && (c.proposal.note || c.proposal.css)) cls.push('has-proposal');
        if (state.simActive.has(c.id)) cls.push('is-sim-active');
        return `
          <div class="${cls.join(' ')}" data-cmt-id="${c.id}">
            <div class="cmt__head">
              <span class="cmt__num" style="background:${roleColor(c.authorRole, c.author)};">${idxOf(c)}</span>
              <span class="cmt__target">${escapeHtml(shortTarget(c))}</span>
              ${state.simActive.has(c.id) ? '<span class="cmt__sim">SIM</span>' : ''}
              <span class="cmt__status">${c.status === 'resolved' ? '해결됨' : '미해결'}</span>
            </div>
            <div class="cmt__page">📄 ${escapeHtml(pageLabel(c.page))}</div>
            <div class="cmt__body">${escapeHtml(last ? last.text : '')}</div>
            <div class="cmt__meta">
              <span class="author">${escapeHtml(c.author || '익명')}</span>
              <span>·</span>
              <span>${relTime(c.createdAt)}</span>
              ${c.thread.length > 1 ? `<span class="cmt__replies">💬 ${c.thread.length}</span>` : ''}
              ${c.proposal && (c.proposal.note || c.proposal.css) ? '<span class="cmt__proposal-flag">· 개선안 있음</span>' : ''}
            </div>
          </div>`;
      }).join('');

      cmtList.querySelectorAll('.cmt').forEach((el) => {
        el.addEventListener('click', () => openDetail(el.dataset.cmtId));
      });
    }

    function onFilterClick(e) {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      filters.querySelectorAll('.chip').forEach((b) => b.classList.toggle('is-active', b === btn));
      state.filter = btn.dataset.filter;
      renderList();
    }

    // ====================================================
    // Detail
    // ====================================================
    function openDetail(id) {
      const c = findById(id);
      if (!c) return;

      // If comment is on a different page, switch iframe first then open detail.
      if (c.page !== state.currentPage) {
        state.selectedId = id;
        navigateTo(c.page);
        // wait until iframe ready, then locate + render
        const onReady = (e) => {
          if (!e.data || e.data.type !== 'voc-ready') return;
          window.removeEventListener('message', onReady);
          renderDetail(c);
          showDetail();
          flashLocate(c);
        };
        window.addEventListener('message', onReady);
        return;
      }

      state.selectedId = id;
      renderDetail(c);
      showDetail();
      flashLocate(c);
    }

    function showDetail() {
      state.view = 'detail';
      listView.hidden = true;
      detailView.hidden = false;
    }
    function goList() {
      state.view = 'list';
      state.selectedId = null;
      listView.hidden = false;
      detailView.hidden = true;
      renderList();
    }

    function renderDetail(c) {
      const idx = indexOfInPage(c);
      dNum.textContent = String(idx);
      dNum.classList.toggle('is-resolved', c.status === 'resolved');
      // resolved keeps the green badge; otherwise tint by author color
      dNum.style.background = c.status === 'resolved' ? '' : roleColor(c.authorRole, c.author);
      dPage.textContent = c.page;
      dStatus.textContent = c.status === 'resolved' ? '해결됨' : '미해결';
      dStatus.classList.toggle('is-resolved', c.status === 'resolved');

      dTag.textContent = '<' + (c.elementTag || '').toLowerCase() + '>';
      dText.textContent = c.elementText || '(텍스트 없음)';
      dSel.textContent = c.selector || '—';
      dCoord.textContent = `x: ${c.x}, y: ${c.y}`;
      dSelHint.textContent = c.selector || '<selector>';

      // Replies
      dReplies.innerHTML = c.thread.map((r) => `
        <div class="reply" data-reply-id="${r.id}">
          <div class="reply__meta">
            <span class="reply__author">${escapeHtml(r.author || '익명')}</span>
            <span>·</span>
            <span>${relTime(r.createdAt)}</span>
            ${r.author === state.user.email ? `<button class="reply__del" data-del="${r.id}" title="삭제">삭제</button>` : ''}
          </div>
          <div class="reply__body">${escapeHtml(r.text)}</div>
        </div>
      `).join('');
      dReplies.querySelectorAll('[data-del]').forEach((b) => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteReply(c.id, b.dataset.del);
        });
      });

      dReply.value = '';

      // Proposal
      const p = c.proposal || {};
      dNote.value = p.note || '';
      dCss.value  = p.css  || defaultCssTemplate(c);

      // Resolve button label
      $('#dResolveBtn').textContent = c.status === 'resolved' ? '↩ 미해결로 되돌리기' : '✓ 해결됨으로 표시';
      // Sim button label
      const isSim = state.simActive.has(c.id);
      const simBtn = $('#simApplyBtn');
      simBtn.textContent = isSim ? '🔄 시뮬 다시 적용' : '▶ 시뮬레이션 적용';
      $('#simResetBtn').disabled = !isSim;

      flashSavedLabel(false);
    }

    function flashSavedLabel(on) {
      dSaved.classList.toggle('is-on', !!on);
      if (on) setTimeout(() => dSaved.classList.remove('is-on'), 1400);
    }

    // ====================================================
    // Mutations
    // ====================================================
    function onReply() {
      const c = findById(state.selectedId);
      if (!c) return;
      const text = dReply.value.trim();
      if (!text) { dReply.focus(); return; }
      c.thread.push({ id: uid('r'), author: state.user.email, text, createdAt: now() });
      persist();
      renderDetail(c);
      renderList();
      showToast('답글 등록');
    }

    function deleteReply(commentId, replyId) {
      const c = findById(commentId);
      if (!c) return;
      if (c.thread.length === 1) {
        if (!confirm('마지막 코멘트입니다. 핀 전체가 삭제됩니다. 계속할까요?')) return;
        return doDelete(c.id);
      }
      c.thread = c.thread.filter((r) => r.id !== replyId);
      persist();
      renderDetail(c);
      renderList();
    }

    function saveProposal(announce) {
      const c = findById(state.selectedId);
      if (!c) return;
      const note = dNote.value;
      const css  = dCss.value;
      const had = c.proposal;
      c.proposal = {
        note,
        css,
        updatedAt: now(),
        updatedBy: state.user.email,
      };
      // if note + css are both empty/default, clear proposal
      if (!note.trim() && (!css.trim() || css.trim() === defaultCssTemplate(c).trim())) {
        delete c.proposal;
      }
      persist();
      renderList();
      flashSavedLabel(true);
      if (announce) showToast(c.proposal ? '개선안 저장' : '개선안 비움');
      // if a sim is currently applied for this comment, refresh it with new CSS
      if (state.simActive.has(c.id) && c.proposal) {
        postIframe({ type: 'voc-sim-apply', id: c.id, css: c.proposal.css });
      }
    }

    function onSimApply() {
      const c = findById(state.selectedId);
      if (!c) return;
      // Make sure latest CSS is saved
      saveProposal(false);
      const css = (c.proposal && c.proposal.css) || dCss.value || '';
      if (!css.trim()) { showToast('CSS 가 비어있습니다'); return; }

      // Sim only works on current page.
      if (c.page !== state.currentPage) {
        navigateTo(c.page);
        const onReady = (e) => {
          if (!e.data || e.data.type !== 'voc-ready') return;
          window.removeEventListener('message', onReady);
          postIframe({ type: 'voc-sim-apply', id: c.id, css });
          state.simActive.add(c.id);
          updateSimStatus();
          renderDetail(c);
          renderList();
          flashLocate(c);
        };
        window.addEventListener('message', onReady);
        return;
      }
      postIframe({ type: 'voc-sim-apply', id: c.id, css });
      state.simActive.add(c.id);
      updateSimStatus();
      renderDetail(c);
      renderList();
      flashLocate(c);
      showToast('시뮬레이션 적용 — 데모에 즉시 반영됨');
    }

    function onSimReset() {
      const c = findById(state.selectedId);
      if (!c) return;
      postIframe({ type: 'voc-sim-reset', id: c.id });
      state.simActive.delete(c.id);
      updateSimStatus();
      renderDetail(c);
      renderList();
      showToast('시뮬 해제');
    }
    function onSimResetAll() {
      postIframe({ type: 'voc-sim-reset-all' });
      state.simActive.clear();
      updateSimStatus();
      if (state.view === 'detail') {
        const c = findById(state.selectedId);
        if (c) renderDetail(c);
      }
      renderList();
      showToast('모든 시뮬 해제');
    }
    function updateSimStatus() {
      const n = state.simActive.size;
      simStatusEl.hidden = n === 0;
      simStatusCount.textContent = String(n);
    }

    function onResolveToggle() {
      const c = findById(state.selectedId);
      if (!c) return;
      c.status = c.status === 'resolved' ? 'open' : 'resolved';
      persist();
      renderDetail(c);
      renderList();
      showToast(c.status === 'resolved' ? '해결됨으로 표시' : '미해결로 되돌림');
    }
    function onDelete() {
      const c = findById(state.selectedId);
      if (!c) return;
      if (!confirm('이 핀과 모든 코멘트를 삭제할까요?')) return;
      doDelete(c.id);
    }
    function doDelete(id) {
      // also reset sim if active
      if (state.simActive.has(id)) {
        postIframe({ type: 'voc-sim-reset', id });
        state.simActive.delete(id);
      }
      state.comments = state.comments.filter((x) => x.id !== id);
      persist();
      goList();
      renderList();
      updateSimStatus();
      showToast('핀 삭제됨');
    }

    function onLocate() {
      const c = findById(state.selectedId);
      if (!c) return;
      flashLocate(c);
    }
    function flashLocate(c) {
      if (c.page !== state.currentPage) return;
      postIframe({ type: 'voc-flash', selector: c.selector, x: c.x, y: c.y });
    }

    // ====================================================
    // Toast
    // ====================================================
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('is-on');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 1800);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
