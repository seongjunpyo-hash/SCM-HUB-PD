<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCM HUB · VOC 코멘트 대시보드</title>
  <script src="/auth-gate.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg:        #0E0E14;
      --surface:   #15151D;
      --surface-h: #1B1B25;
      --line:      #25252F;
      --line-2:    #34344A;
      --fg:        #FFFFFF;
      --fg-mute:   rgba(255,255,255,0.62);
      --fg-dim:    rgba(255,255,255,0.40);
      --accent:    #6E6BFF;
      --accent-bg: rgba(110,107,255,0.14);
      --ok:        #34D399;
      --ok-bg:     rgba(52,211,153,0.14);
      --warn:      #F59E0B;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.01em; min-height: 100vh; min-width: 1280px;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    .shell { max-width: 1280px; margin: 0 auto; padding: 56px 64px 96px; }

    .top { display: flex; align-items: center; justify-content: space-between; padding: 0 0 28px; }
    .top__brand { font-weight: 700; font-size: 14px; color: var(--fg); letter-spacing: 0.4px; }
    .top__brand .dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--accent); margin: 0 8px 1px; vertical-align: middle; }
    .top__back {
      font-size: 12px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--fg-mute); transition: all 0.12s ease;
    }
    .top__back:hover { color: var(--fg); border-color: var(--line-2); }

    .hero { padding: 24px 0 36px; max-width: 800px; }
    .hero__eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); }
    .hero__title { margin: 12px 0 0; font-size: 36px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
    .hero__sub { margin: 14px 0 0; font-size: 14px; color: var(--fg-mute); line-height: 1.7; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 8px 0 32px; }
    .stat {
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px 18px;
    }
    .stat__label { font-size: 11px; font-weight: 600; color: var(--fg-dim); letter-spacing: 0.6px; text-transform: uppercase; }
    .stat__value { margin-top: 6px; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .stat__value.accent { color: var(--accent); }
    .stat__value.ok { color: var(--ok); }
    .stat__value.warn { color: var(--warn); }

    .toolbar {
      display: flex; align-items: center; gap: 8px; padding: 10px 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      background: transparent; border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12.5px; color: var(--fg-mute);
      transition: all 0.12s ease;
    }
    .chip:hover { color: var(--fg); border-color: var(--line-2); }
    .chip.is-active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .chip .num { font-size: 11px; font-weight: 700; opacity: 0.7; }
    .toolbar__spacer { flex: 1; }
    .toolbar__hint { font-size: 11.5px; color: var(--fg-dim); }

    .group { margin-top: 28px; }
    .group__head {
      display: flex; align-items: baseline; gap: 10px;
      padding: 0 4px 12px;
      border-bottom: 1px solid var(--line);
    }
    .group__title { font-size: 14px; font-weight: 700; color: var(--fg); }
    .group__path {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px; color: var(--fg-dim);
    }
    .group__count {
      margin-left: auto;
      padding: 2px 8px; border-radius: 999px;
      background: var(--bg); border: 1px solid var(--line);
      font-size: 11px; font-weight: 600; color: var(--fg-mute);
    }
    .group__open {
      font-size: 11.5px; color: var(--fg-mute);
      padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
      transition: all 0.12s ease;
    }
    .group__open:hover { color: var(--fg); border-color: var(--line-2); }

    .cmt-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 0; }

    .cmt {
      display: block;
      padding: 14px 16px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 10px;
      transition: border-color 0.12s ease, background 0.12s ease;
      cursor: pointer;
    }
    .cmt:hover { background: var(--surface-h); border-color: var(--line-2); }
    .cmt.is-resolved { opacity: 0.6; }
    .cmt__head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .cmt__num {
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff;
      border-radius: 999px;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }
    .cmt.is-resolved .cmt__num { background: var(--ok); }
    .cmt__target {
      flex: 1; min-width: 0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px; color: var(--fg-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cmt__status {
      flex-shrink: 0;
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      padding: 2px 6px; border-radius: 4px;
      background: var(--accent-bg); color: var(--accent);
    }
    .cmt.is-resolved .cmt__status { background: var(--ok-bg); color: var(--ok); }
    .cmt__body {
      font-size: 13px; color: var(--fg); line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cmt__meta {
      margin-top: 8px;
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--fg-dim);
    }
    .cmt__meta .author { color: var(--fg-mute); }
    .cmt__replies {
      margin-left: 4px; color: var(--accent);
      display: inline-flex; align-items: center; gap: 4px;
    }

    .empty {
      padding: 96px 24px; text-align: center;
      color: var(--fg-dim); font-size: 14px; line-height: 1.7;
      border: 1px dashed var(--line); border-radius: 12px;
      margin-top: 16px;
    }
    .empty .em { font-size: 36px; margin-bottom: 12px; opacity: 0.6; }
    .empty a { color: var(--accent); }

    .footer {
      margin-top: 56px; padding: 18px 4px 0;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11.5px; color: var(--fg-dim);
    }
    .footer a { color: var(--fg-dim); }
    .footer a:hover { color: var(--fg-mute); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <span class="top__brand">SCM HUB<span class="dot"></span>VOC 코멘트 대시보드</span>
      <a class="top__back" href="/index.html">← Workspace</a>
    </header>

    <section class="hero">
      <span class="hero__eyebrow">Voice of Customer</span>
      <h1 class="hero__title">데모 위에 남긴 코멘트, 한곳에서</h1>
      <p class="hero__sub">각 데모 페이지의 우하단 <b>💬 코멘트</b> 버튼을 눌러 화면 위에 직접 의견을 남겨주세요. 여기서는 모든 페이지의 코멘트를 모아보고, 항목을 클릭하면 해당 페이지로 이동해 핀이 자동으로 열립니다.</p>
    </section>

    <div class="stats">
      <div class="stat"><div class="stat__label">전체</div><div class="stat__value" id="stAll">0</div></div>
      <div class="stat"><div class="stat__label">미해결</div><div class="stat__value accent" id="stOpen">0</div></div>
      <div class="stat"><div class="stat__label">해결됨</div><div class="stat__value ok" id="stResolved">0</div></div>
      <div class="stat"><div class="stat__label">참여 페이지</div><div class="stat__value warn" id="stPages">0</div></div>
    </div>

    <div class="toolbar">
      <button class="chip is-active" data-filter="open">미해결 <span class="num" id="cntOpen">0</span></button>
      <button class="chip" data-filter="resolved">해결됨 <span class="num" id="cntResolved">0</span></button>
      <button class="chip" data-filter="all">전체 <span class="num" id="cntAll">0</span></button>
      <span class="toolbar__spacer"></span>
      <span class="toolbar__hint">항목 클릭 → 데모 페이지에서 핀이 자동으로 열림</span>
    </div>

    <div id="groups"></div>

    <footer class="footer">
      <span>SCM HUB · VOC</span>
      <span><a href="./feedback.html">기존 폼 보기</a></span>
    </footer>
  </div>

  <script>
  (function () {
    'use strict';
    const STORAGE_KEY = 'scm:voc:comments:v1';
    const PAGE_LABELS = {
      '/demo/dashboard.html':                '대시보드',
      '/demo/sku-management.html':           'SKU 관리',
      '/demo/sku-detail.html':               'SKU 상세',
      '/demo/sku-register.html':             'SKU 등록',
      '/demo/editshop-restock-request.html': '편집샵 보충 요청',
      '/demo/editshop-restock-status.html':  '편집샵 보충 현황',
      '/demo/index.html':                    '무탠 전개상품 관리',
    };

    const $ = (s) => document.querySelector(s);
    let comments = load();
    let filter = 'open';

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }
    function relTime(t) {
      const d = (Date.now() - t) / 1000;
      if (d < 60)        return '방금';
      if (d < 3600)      return Math.floor(d / 60) + '분 전';
      if (d < 86400)     return Math.floor(d / 3600) + '시간 전';
      if (d < 86400 * 7) return Math.floor(d / 86400) + '일 전';
      const dt = new Date(t);
      return `${dt.getMonth() + 1}/${dt.getDate()}`;
    }
    function pageLabel(p) { return PAGE_LABELS[p] || p; }
    function formatTarget(c) {
      const tag = (c.elementTag || '').toLowerCase();
      const txt = (c.elementText || '').replace(/\s+/g, ' ').trim();
      if (txt) return `<${tag || 'el'}> "${txt.length > 40 ? txt.slice(0, 40) + '…' : txt}"`;
      return c.selector || `<${tag}>`;
    }

    function render() {
      const all = comments;
      const open = all.filter((c) => c.status !== 'resolved');
      const done = all.filter((c) => c.status === 'resolved');

      $('#stAll').textContent = all.length;
      $('#stOpen').textContent = open.length;
      $('#stResolved').textContent = done.length;
      const pages = new Set(all.map((c) => c.page));
      $('#stPages').textContent = pages.size;
      $('#cntAll').textContent = all.length;
      $('#cntOpen').textContent = open.length;
      $('#cntResolved').textContent = done.length;

      let list;
      if (filter === 'open') list = open;
      else if (filter === 'resolved') list = done;
      else list = all;

      const groups = $('#groups');
      groups.innerHTML = '';

      if (list.length === 0) {
        groups.innerHTML = `
          <div class="empty">
            <div class="em">💭</div>
            <div>${filter === 'open'
              ? '미해결 코멘트가 없습니다.<br/>데모 페이지에서 우하단 💬 버튼을 눌러 의견을 남겨보세요.'
              : '조건에 맞는 코멘트가 없습니다.'}</div>
          </div>
        `;
        return;
      }

      // group by page
      const byPage = new Map();
      list.forEach((c) => {
        if (!byPage.has(c.page)) byPage.set(c.page, []);
        byPage.get(c.page).push(c);
      });
      // page order: known pages first (in PAGE_LABELS order), then unknown
      const orderedPaths = [
        ...Object.keys(PAGE_LABELS).filter((p) => byPage.has(p)),
        ...[...byPage.keys()].filter((p) => !PAGE_LABELS[p]),
      ];

      // global per-page index by createdAt asc (matches overlay numbering)
      const idxByPage = new Map();
      [...comments].sort((a, b) => a.createdAt - b.createdAt).forEach((c) => {
        const arr = idxByPage.get(c.page) || [];
        arr.push(c.id);
        idxByPage.set(c.page, arr);
      });
      const idxOf = (c) => (idxByPage.get(c.page) || []).indexOf(c.id) + 1;

      orderedPaths.forEach((path) => {
        const items = byPage.get(path).sort((a, b) => b.createdAt - a.createdAt);
        const group = document.createElement('section');
        group.className = 'group';
        group.innerHTML = `
          <header class="group__head">
            <span class="group__title">${escapeHtml(pageLabel(path))}</span>
            <span class="group__path">${escapeHtml(path)}</span>
            <span class="group__count">${items.length}</span>
            <a class="group__open" href="${path}" target="_blank" rel="noopener">페이지 열기 ↗</a>
          </header>
          <div class="cmt-list">
            ${items.map((c) => {
              const last = c.thread[c.thread.length - 1];
              const cls = ['cmt']; if (c.status === 'resolved') cls.push('is-resolved');
              return `
                <a class="${cls.join(' ')}" href="${path}#voc=${c.id}" target="_blank" rel="noopener" data-id="${c.id}">
                  <div class="cmt__head">
                    <span class="cmt__num">${idxOf(c)}</span>
                    <span class="cmt__target">${escapeHtml(formatTarget(c))}</span>
                    <span class="cmt__status">${c.status === 'resolved' ? '해결됨' : '미해결'}</span>
                  </div>
                  <div class="cmt__body">${escapeHtml(last ? last.text : '')}</div>
                  <div class="cmt__meta">
                    <span class="author">${escapeHtml(c.author || '익명')}</span>
                    <span>·</span>
                    <span>${relTime(c.createdAt)}</span>
                    ${c.thread.length > 1 ? `<span class="cmt__replies">💬 ${c.thread.length}</span>` : ''}
                  </div>
                </a>
              `;
            }).join('')}
          </div>
        `;
        groups.appendChild(group);
      });
    }

    document.querySelector('.toolbar').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      document.querySelectorAll('.toolbar .chip').forEach((b) => b.classList.toggle('is-active', b === btn));
      filter = btn.dataset.filter;
      render();
    });

    // Refresh when storage changes (other tab posts comment)
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) { comments = load(); render(); }
    });
    // Refresh on focus (came back from a demo tab)
    window.addEventListener('focus', () => { comments = load(); render(); });

    render();
  })();
  </script>
</body>
</html>
