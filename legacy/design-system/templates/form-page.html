<!DOCTYPE html>
<!--
  form-page.html — 폼 페이지 템플릿
  ============================================================
  sku-register 패턴. info-banner + form cards (white/gray) + sticky bottom bar.
============================================================ -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="../layer-desktop.css" />
  {{MODULE_CSS_LINKS}}
  <style>
    .form-shell { padding: 0 28px 120px; }
    .form-stack { display: flex; flex-direction: column; gap: 16px; max-width: 1200px; }
  </style>
</head>
<body>
  <header class="topbar">{{TOPBAR}}</header>
  <div class="app">
    <nav class="lnb" aria-label="주메뉴">{{LNB}}</nav>
    <main class="form-shell">
      <div class="scm-page-head scm-page-head--form scm-page-head--sticky">
        <button class="scm-back-btn" type="button" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 class="scm-page-head__title">{{TITLE}}</h1>
      </div>

      <!-- 안내 배너 -->
      {{INFO_BANNER}}

      <div class="form-stack">
        {{FORM_CARDS}}
      </div>
    </main>
  </div>

  <!-- Sticky bottom bar -->
  <div class="scm-sticky-bottom-bar">
    {{BOTTOM_ACTIONS}}
  </div>

  {{MODULE_JS_SCRIPTS}}
  <script>{{PAGE_SCRIPT}}</script>
</body>
</html>
