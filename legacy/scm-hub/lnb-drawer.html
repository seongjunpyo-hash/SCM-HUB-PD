<!--
  ============================================================
  Expanded LNB drawer — Figma 8002:67543 (isCollapsed=false)
  ============================================================
  사용법: 모든 SCM Hub 페이지에서
  1) <head> 의 <style> 안에 lnb-drawer.css 의 내용 복붙
  2) <body> 닫기 직전에 lnb-drawer.html 의 markup 복붙
  3) <script> 안에 lnb-drawer.js 의 init 코드 복붙
  4) topbar 의 .menu-btn 클릭 → lnbDrawer.open() 호출

  본 파일은 reference. 실제 적용은 각 페이지에 인라인.
-->
