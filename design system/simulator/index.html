        system: '당신은 JSON 만 출력하는 API 입니다. 응답은 반드시 { 로 시작 } 로 끝. markdown 코드블록 / 설명 / 인사말 절대 금지. spec.layout 은 PRD 의 사용자 작업 + 일반 시스템 화면 사용성 원칙으로 7개 (table/cards/master-detail/kanban/dashboard/form/timeline) 중 가장 적합한 1개 선택 — table 을 default 로 두지 말 것. alternatives 는 반드시 3개 — [0] "변형 1" + 메인과 다른 layout, [1] "AI 추천 1 (자유 제안)" + 다른 layout, [2] "AI 추천 2 (자유 제안)" + 또 다른 layout. 메인 + 3 alt = 4개 모두 다른 layout. 모든 variant 가 자체 layoutData 풍부히. customNotes (alt 1~3) 는 사용성 관점 설명. 셀 데이터는 한국 패션 SCM 도메인의 진짜같은 한국어 (placeholder 금지). table 은 컬럼 ≥ 6개 + rowSamples ≥ 6행.',
        messages: [{ role: 'user', content: prompt }],
      }),
    });
    if (!res.ok) {
      var t = await res.text();
      throw new Error(res.status + ': ' + t.substring(0, 200));
    }
    var data = await res.json();
    var raw = (data.content && data.content[0] && data.content[0].text) || '';
    if (!raw) throw new Error('빈 응답');
    var spec = extractJson(raw);
    if (!spec) throw new Error('JSON 파싱 실패: ' + raw.substring(0, 200));
    // 진단용 raw spec dump — 사용자가 콘솔 펼치면 즉시 확인
    console.log('[SCM Sim] AI 원본 spec — filters:', (spec.filters || []).map(function(f){return (f&&f.label)||f;}),
      '| columns:', ((spec.table && spec.table.columns) || []).map(function(c){return c.label;}),
      '| alternatives:', (spec.alternatives || []).length);
    console.log('[SCM Sim] AI 원본 spec (전체)', spec);
    return spec;
  }

  /* ============================================================
   * Assemble — JSON spec → 디자인시스템 컴포넌트 마크업
   * ============================================================ */
  function escH(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  function renderPageHead(ph) {
    var actions = (ph.actions || []).map(function (a) {
      var kind = a.kind === 'danger' ? 'scm-button scm-button--danger'
              : a.kind === 'ghost'  ? 'scm-button scm-button--ghost'
              : 'scm-button scm-button--primary';
      return '<button class="' + kind + '" type="button">' + escH(a.label) + '</button>';
    }).join('\n        ');
    return '<div class="scm-page-head">\n' +
      '  <div class="scm-page-head__titles">\n' +
      '    <h1 class="scm-page-head__title">' + escH(ph.title) + '</h1>' +
      (ph.sub ? '\n    <p class="scm-page-head__sub">' + escH(ph.sub) + '</p>' : '') +
      '\n  </div>\n' +
      (actions ? '  <div class="scm-page-head__actions">\n        ' + actions + '\n  </div>\n' : '') +
      '</div>';
  }

  function renderFilterBar(filters) {
    if (!filters || !filters.length) return '';
    var chips = filters.map(function (f) {
      return '<button class="scm-filter-select" type="button" data-state="placeholder">' +
        '<span class="scm-filter-select__label">' + escH(f.label) + '</span>' +
        '<span class="scm-filter-select__value">' + escH(f.label) + '</span>' +
        '<svg class="scm-filter-select__chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>' +
        '</button>';
    }).join('\n      ');
    return '<div class="scm-filter-bar">\n' +
      '  <button class="scm-filter-chip" type="button">\n' +
      '    <svg viewBox="0 0 20 20"><path d="M6 10h8M4 6h12M8 14h4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>\n' +
      '    <span>전체 필터</span>\n' +
      '  </button>\n' +
      '  <div class="scm-filter-overflow"><div class="scm-filter-overflow__track">\n      ' + chips + '\n  </div></div>\n' +
      '</div>';
  }

  // 컬럼 type 별 dummy 셀 콘텐츠
  function dummyCell(col, rowIdx) {
    var r = rowIdx + 1;
    switch (col.type) {
      case 'number': return String(Math.floor(Math.random() * 999) + 1);
      case 'code-link': return '<a class="scm-code-link">CODE-' + (1000 + r) + '</a>';
      case 'status-chip': {
        var stxs = ['활성', '대기', '완료', '오류'];
        var clss = ['scm-status-chip scm-status-chip--ok', 'scm-status-chip scm-status-chip--warn', 'scm-status-chip scm-status-chip--info', 'scm-status-chip scm-status-chip--err'];
        var i = (rowIdx) % 4;
        return '<span class="' + clss[i] + '">' + stxs[i] + '</span>';
      }
      case 'kind-chip': {
        var kinds = ['일반', '특가', '신상', '시즌'];
        return '<span class="scm-kind-chip">' + kinds[rowIdx % 4] + '</span>';
      }
      case 'platform-tag': {
        var pf = ['29CM', '무신사', '하이버', 'SSF'];
        return '<span class="scm-platform-tag">' + pf[rowIdx % 4] + '</span>';
      }
      case 'product-name':
        return '<span class="scm-product-name">' +
          '<span class="scm-product-name__thumb"></span>' +
          '<span class="scm-product-name__text">샘플 상품 ' + r + ' — 짧은 설명 텍스트가 들어갑니다</span>' +
        '</span>';
      case 'tag': return '<span class="scm-tag">태그' + r + '</span>';
      case 'date': return '2026-05-' + String(r * 3 + 1).padStart(2, '0');
      default: return escH(col.label) + ' ' + r;
    }
  }

  // PRD 도메인 sample 값 → 컬럼 타입에 맞는 마크업으로 wrapping
  function renderTypedCell(type, value, rowIdx) {
    var v = String(value == null ? '' : value);
    switch (type) {
      case 'number':       return escH(v);
      case 'code-link':    return '<a class="scm-code-link">' + escH(v) + '</a>';
      case 'status-chip': {
        var clss = ['scm-status-chip scm-status-chip--ok', 'scm-status-chip scm-status-chip--warn', 'scm-status-chip scm-status-chip--info', 'scm-status-chip scm-status-chip--err'];
        return '<span class="' + clss[rowIdx % 4] + '">' + escH(v) + '</span>';
      }
      case 'kind-chip':    return '<span class="scm-kind-chip">' + escH(v) + '</span>';
      case 'platform-tag': return '<span class="scm-platform-tag">' + escH(v) + '</span>';
      case 'product-name':
        return '<span class="scm-product-name">' +
          '<span class="scm-product-name__thumb"></span>' +
          '<span class="scm-product-name__text">' + escH(v) + '</span>' +
        '</span>';
      case 'tag':  return '<span class="scm-tag">' + escH(v) + '</span>';
      case 'date': return escH(v);
      default:     return escH(v);
    }
  }

  function renderTable(table) {
    var cols = table.columns || [];
    var checkable = !!table.checkable;
    var samples = table.rowSamples || [];

    var thead = '';
    var tbody = '';
    var headerCells = [];
    if (checkable) headerCells.push('<th class="cb-col col-frozen-1"><span class="scm-checkbox" role="checkbox" aria-checked="false" tabindex="0"></span></th>');
    cols.forEach(function (c) {
      var cls = c.width === 'large' ? 'col-large' : c.width === 'medium' ? 'col-medium' : 'col-auto';
      headerCells.push('<th class="' + cls + '">' + escH(c.label) + '</th>');
    });
    thead = '<tr>' + headerCells.join('') + '</tr>';

    var rowCount = Math.max(samples.length, 5);
    for (var r = 0; r < rowCount; r++) {
      var cells = [];
      if (checkable) cells.push('<td class="cb-col col-frozen-1"><span class="scm-checkbox" role="checkbox" aria-checked="false" tabindex="0"></span></td>');
      cols.forEach(function (c, i) {
        var cls = c.width === 'large' ? 'col-large' : c.width === 'medium' ? 'col-medium' : 'col-auto';
        // PRD 도메인 sample 우선, 없으면 fallback
        var sampleValue = (samples[r] && samples[r][i] != null) ? samples[r][i] : null;
        var content = sampleValue != null ? renderTypedCell(c.type, sampleValue, r) : dummyCell(c, r);
        cells.push('<td class="' + cls + '">' + content + '</td>');
      });
      tbody += '<tr>' + cells.join('') + '</tr>';
    }

    return '<div class="mp-table-host">\n' +
      '  <div class="mp-table-scroll">\n' +
      '    <table class="mp-table is-cell-selectable">\n' +
      '      <thead>' + thead + '</thead>\n' +
      '      <tbody>' + tbody + '</tbody>\n' +
      '    </table>\n' +
      '  </div>\n' +
      '</div>';
  }

  // 디자인시스템 핵심 CSS — sku-management.html 데모와 동일 레퍼토리 (테이블 라인/sticky/페이저/액션바 모두 포함)
  var DS_CSS = [
    // 셸
    'topbar/topbar.css',
    'lnb/lnb.css',
    // 헤드 + 액션
    'page-head/page-head.css',
    'button/button.css',
    'search-btn/search-btn.css',
    'download-btn/download-btn.css',
    'filter-reset-btn/filter-reset-btn.css',
    'mini-action/mini-action.css',
    // 필터 시스템
    'filter-bar/filter-bar.css',
    'filter-chip/filter-chip.css',
    'filter-select/filter-select.css',
    'filter-popover/filter-popover.css',
    'filter-drawer/filter-drawer.css',
    // 통계 영역
    'stat/stat.css',
    'stats-bar/stats-bar.css',
    'info-banner/info-banner.css',
    // 테이블 (★ 핵심 — 블랙 라인/sticky/cell-selectable 여기서)
    'scm-table/scm-table.css',
    'scm-table/column-more-menu.css',
    'scm-table/column-filter-popover.css',
    // 테이블 셀 컴포넌트
    'checkbox/checkbox.css',
    'tag/tag.css',
    'status-chip/status-chip.css',
    'kind-chip/kind-chip.css',
    'platform-tag/platform-tag.css',
    'product-name/product-name.css',
    'code-link/code-link.css',
    'code-popover/code-popover.css',
    // 푸터
    'pager/pager.css',
    'pgsize-select/pgsize-select.css',
    // 빈 상태 / 모달 / 토스트 (있어도 와이어프레임 비주얼에는 영향 X, 토큰 일관성 위해)
    'empty-state/empty-state.css',
    'toast/toast.css',
    'backdrop/backdrop.css',
  ];

  // L1 카테고리별 LNB 아이콘 (간단한 인라인 SVG)
  var L1_ICONS = {
    dashboard: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.6" fill="none"/><rect x="13" y="3" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.6" fill="none"/><rect x="3" y="13" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.6" fill="none"/><rect x="13" y="13" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
    store:     '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 8h18l-2 12H5z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M9 8V4h6v4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
    hanger:    '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 4a2 2 0 1 1 2 2c-1 0-2 1-2 2v2M3 18l9-6 9 6v2H3z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
    order:     '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="6" width="16" height="14" rx="1" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M8 6V3M16 6V3M4 10h16" stroke="currentColor" stroke-width="1.6"/></svg>',
    stock:     '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 9l9-5 9 5v9l-9 5-9-5z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M3 9l9 5 9-5M12 14v9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
    control:   '<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M19 12a7 7 0 0 0-.1-1.2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-2.1-1.2L14 3h-4l-.4 2.5a7 7 0 0 0-2.1 1.2l-2.5-1-2 3.5 2.1 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 2.1 1.2L10 21h4l.4-2.5a7 7 0 0 0 2.1-1.2l2.5 1 2-3.5-2.1-1.6c.1-.4.1-.8.1-1.2z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>',
    setting:   '<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M4 21v-1a8 8 0 0 1 16 0v1" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
  };

  function renderTopbar() {
    return '<header class="scm-topbar" role="banner">' +
      '<div class="scm-topbar__left">' +
        '<button class="scm-topbar__menu-btn" type="button" data-scm-lnb-toggle aria-label="메뉴 열기/닫기">' +
          '<svg viewBox="0 0 20 20" width="20" height="20"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6"/></svg>' +
        '</button>' +
        '<a class="scm-topbar__logo" href="#" aria-label="SCM-Hub 홈">SCM-Hub</a>' +
        '<span class="scm-topbar__demo-tag" aria-label="데모 환경">DEMO</span>' +
      '</div>' +
      '<div class="scm-topbar__right" role="button" tabindex="0">' +
        '<span class="scm-topbar__avatar">홍</span>' +
        '<div class="scm-topbar__name-group">' +
          '<span class="scm-topbar__name"><span class="scm-topbar__name-first">홍길동</span><span class="scm-topbar__name-suffix">님</span></span>' +
        '</div>' +
      '</div>' +
    '</header>';
  }

  function renderLnb(prd) {
    var l1Key = prd.category || 'dashboard';
    var l1Label = CAT_LABEL[l1Key] || l1Key;
    var l2Label = prd.menu || prd.name || '새 메뉴';
    var workType = prd.workType || 'new';
    var tagClass = workType === 'improve' ? 'scm-lnb-tag scm-lnb-tag--wip' : 'scm-lnb-tag scm-lnb-tag--new';
    var tagText  = workType === 'improve' ? '개선중' : 'NEW';
    var icon = L1_ICONS[l1Key] || L1_ICONS.dashboard;

    return '<nav class="scm-lnb" aria-label="주메뉴">' +
      '<div class="scm-lnb-item is-open is-active" data-key="' + escH(l1Key) + '">' +
        '<button class="scm-lnb-row" type="button">' +
          '<span class="scm-lnb-icon">' + icon + '</span>' +
          '<span class="scm-lnb-label">' + escH(l1Label) + '</span>' +
          '<span class="scm-lnb-chev"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></span>' +
        '</button>' +
        '<div class="scm-lnb-l2-list">' +
          '<a class="scm-lnb-l2 is-active" href="#" data-key="current">' +
            '<span class="scm-lnb-l2-text">' + escH(l2Label) + '</span>' +
            '<span class="' + tagClass + '">' + tagText + '</span>' +
          '</a>' +
        '</div>' +
      '</div>' +
    '</nav>';
  }

  function assemble(spec, prd) {
    // 절대 URL 로 박아두면 iframe srcdoc + base href 의 quirk 회피 (특히 file:// 환경)
    var baseHref = new URL('.', window.location.href).href;
    var cssLinks = DS_CSS.map(function (p) {
      return '  <link rel="stylesheet" href="' + baseHref + 'components/' + p + '" />';
    }).join('\n');

    return '<!DOCTYPE html>\n' +
'<html lang="ko" class="is-lnb-open">\n' +
'<head>\n' +
'  <meta charset="UTF-8" />\n' +
'  <meta name="viewport" content="width=1440" />\n' +
'  <base href="' + baseHref + '" />\n' +
'  <title>' + escH((spec.pageHead && spec.pageHead.title) || (prd && prd.name) || 'wireframe') + '</title>\n' +
'  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />\n' +
'  <link rel="stylesheet" href="' + baseHref + 'layer-desktop.css" />\n' +
cssLinks + '\n' +
'  <style>\n' +
'    /* === 데모 페이지 (sku-management.html) 와 100% 동일한 셸 셋업 === */\n' +
'    :root { --scm-lnb-width: 56px; --scm-sticky-gnb: 64px; --scm-sticky-filter: 76px; }\n' +
'    html.is-lnb-open { --scm-lnb-width: 260px; }\n' +
'    /* body 셀렉터 specificity 강화 (layer-desktop 의 body * override 차단) */\n' +
'    html body { margin: 0; font-family: var(--ld-font-family-base, "Pretendard Variable", Pretendard, sans-serif); color: var(--ld-fg, #000); background: #fff; min-width: 1440px; }\n' +
'    body > .app { display: grid; grid-template-columns: var(--scm-lnb-width) minmax(0, 1fr); transition: grid-template-columns 0.2s ease; }\n' +
'    /* main 셀렉터 specificity 강화 — 다른 CSS 의 main padding 을 확실히 winner */\n' +
'    body .app > main { min-width: 0; padding: 0 28px 40px; }\n' +
'    /* sticky stack */\n' +
'    .scm-filter-bar { top: var(--scm-sticky-gnb); }\n' +
'    .scm-stats-bar--sticky { top: calc(var(--scm-sticky-gnb) + var(--scm-sticky-filter)); }\n' +
'    .mp-table-host { margin-top: 0; }\n' +
'    .mp-table .cell-numeric { font-variant-numeric: tabular-nums; text-align: right; }\n' +
'    /* 와이어프레임 메타 푸터 */\n' +
'    .ds-meta { margin-top: 28px; padding-top: 18px; border-top: 1px solid #E5E5E5; font-size: 12px; color: #8A8A8A; line-height: 1.55; }\n' +
'  </style>\n' +
'</head>\n' +
'<body>\n' +
renderTopbar() + '\n' +
'<div class="app">\n' +
renderLnb(prd) + '\n' +
'<main>\n' +
renderPageHead(spec.pageHead || { title: prd.name || 'Untitled' }) + '\n' +
renderFilterBar(spec.filters) + '\n' +
renderTable(spec.table || { columns: [] }) + '\n' +
'<div class="ds-meta">※ AI 가 추출한 페이지 구조를 SCM Hub 디자인시스템(topbar + lnb + scm-table 등)에 자동 조립한 와이어프레임' + (spec.empty ? ' · 빈 상태: 「' + escH(spec.empty) + '」' : '') + '</div>\n' +
'</main>\n' +
'</div>\n' +
'<' + 'script>\n' +
'(function () {\n' +
'  var btn = document.querySelector("[data-scm-lnb-toggle]");\n' +
'  if (btn) btn.addEventListener("click", function () { document.documentElement.classList.toggle("is-lnb-open"); });\n' +
'})();\n' +
'<\/script>\n' +
'</body>\n' +
'</html>';
  }

  /* ============================================================
   * 라우팅
   * ============================================================ */
  if (!isValidated()) { renderLocked(); return; }
  var prd = loadPrd();
  if (!prd || !prd.name) { renderLocked(); return; }
  renderActive(prd, loadText(), loadSupp());
})();
</script>

</body>
</html>
