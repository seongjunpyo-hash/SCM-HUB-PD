<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시뮬레이터 — SCM Hub Simulation System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <style>
    :root {
      --bg:        #FAFAFB;
      --surface:   #FFFFFF;
      --line:      #E5E5E5;
      --line-2:    #BFBFBF;
      --fg:        #000000;
      --fg-mute:   #555555;
      --fg-dim:    #8A8A8A;
      --accent:    #4F46E5;
      --accent-bg: #EEF0FF;
      --ok:        #1B9E4F;
      --ok-bg:     #E5F4EA;
      --warn:      #B7791F;
      --err:       #DD3D3D;
      --err-bg:    #FFECEC;
      --soft:      #F5F5F7;
      --soft-h:    #EEEEEE;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.01em;
      font-size: 16px;
      min-width: 1280px;
    }
    a { color: inherit; }

    .shell { max-width: none; margin: 0 auto; padding: 20px 32px 40px; }

    .top { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 28px; font-size: 14px; color: var(--fg-mute); }
    .top a { color: var(--fg-mute); text-decoration: none; }
    .top a:hover { color: var(--fg); }
    .top .sep { margin: 0 10px; color: var(--fg-dim); }

    .hero { padding: 4px 0 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .hero__main { min-width: 0; }
    .hero__eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); }
    .hero__title { margin: 6px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2; }
    .hero__sub  { margin: 4px 0 0; font-size: 13px; color: var(--fg-mute); max-width: 820px; line-height: 1.55; }
    .hero__toggle {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 14px;
      background: var(--surface); color: var(--fg-mute);
      border: 1px solid var(--line); border-radius: 8px;
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .hero__toggle:hover { background: var(--soft); color: var(--fg); }

    .locked { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 56px 40px; text-align: center; max-width: 560px; margin: 80px auto; }
    .locked__icon { width: 72px; height: 72px; margin: 0 auto 20px; background: var(--soft); color: var(--fg-mute); border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .locked__icon svg { width: 32px; height: 32px; }
    .locked h2 { margin: 0 0 10px; font-size: 22px; font-weight: 700; }
    .locked p  { margin: 0 0 28px; font-size: 15px; color: var(--fg-mute); line-height: 1.6; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 48px; padding: 0 22px; border-radius: 8px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; text-decoration: none; border: 1px solid transparent; white-space: nowrap;
    }
    .btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn--primary:hover { background: #5C59E8; }
    .btn--primary:disabled { background: var(--soft-h); color: var(--fg-dim); border-color: var(--line); cursor: not-allowed; }
    .btn--ghost { background: transparent; color: var(--fg-mute); border-color: var(--line); }
    .btn--ghost:hover { background: var(--soft); color: var(--fg); }
    .btn svg { width: 16px; height: 16px; }
    .btn .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; margin-top: 4px; align-items: start; transition: grid-template-columns 0.2s ease; }
    .layout.is-collapsed { grid-template-columns: 0 1fr; gap: 0; }
    .layout.is-collapsed > aside { display: none; }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; position: sticky; top: 24px; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .panel__title { margin: 0; font-size: 16px; font-weight: 700; }
    .panel__edit  { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600; }
    .panel__edit:hover { text-decoration: underline; }
    .panel__row { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line); }
    .panel__row:first-of-type { border-top: 0; padding-top: 0; }
    .panel__row .k { font-size: 12px; color: var(--fg-dim); letter-spacing: 0.4px; font-weight: 600; text-transform: uppercase; }
    .panel__row .v { font-size: 14px; color: var(--fg); word-break: break-word; line-height: 1.5; }
    .panel__row .v small { color: var(--fg-mute); }

    .work-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; background: var(--accent-bg); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }

    .panel__actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
    .panel__hint { margin-top: 14px; padding: 12px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); font-size: 12.5px; color: var(--fg-mute); line-height: 1.55; }
    .panel__hint strong { color: var(--fg); font-weight: 700; }

    .panel__ai { margin-top: 16px; padding: 16px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); }
    .panel__ai-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .panel__ai-tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); font-weight: 700; letter-spacing: 0.4px; }
    .panel__ai-hint { margin: 0 0 12px; font-size: 12px; color: var(--fg-mute); line-height: 1.55; }
    .panel__ai-label { display: block; margin-top: 10px; margin-bottom: 5px; font-size: 12px; font-weight: 600; color: var(--fg-mute); }
    .panel__ai .input { width: 100%; padding: 11px 13px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; font-family: ui-monospace, monospace; font-size: 13px; outline: none; }
    .panel__ai .input:focus { border-color: var(--accent); }
    .panel__ai-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; }
    .panel__ai-link:hover { text-decoration: underline; }
    .panel__ai-small { display: block; margin-top: 5px; font-size: 11.5px; color: var(--fg-dim); line-height: 1.5; }
    .panel__ai-or { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; font-size: 11px; font-weight: 600; color: var(--fg-dim); letter-spacing: 0.6px; }
    .panel__ai-or::before, .panel__ai-or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .panel__ai-status { margin-top: 12px; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; line-height: 1.5; }
    .panel__ai-status--ok { background: var(--ok-bg); color: var(--ok); }
    .panel__ai-status--warn { background: var(--err-bg); color: var(--err); }

    /* Key 상태 (단순 한 줄) */
    .panel__keystatus { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-mute); }
    .panel__keystatus__dot { display: inline-flex; align-items: center; gap: 6px; }
    .panel__keystatus__dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .panel__keystatus.is-warn .panel__keystatus__dot::before { background: var(--err); }
    .panel__keystatus__btn { background: transparent; border: 0; color: var(--accent); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; padding: 0; }
    .panel__keystatus__btn:hover { text-decoration: underline; }

    /* AI 추출 spec 디버그 영역 */
    .panel__spec {
      margin-top: 14px; padding: 14px;
      background: var(--accent-bg); border: 1px solid var(--line); border-radius: 10px;
    }
    .panel__spec-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
      color: var(--accent); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .panel__spec-title::before { content: '🤖'; font-size: 14px; }
    .panel__spec .panel__row { padding: 8px 0; }
    .panel__spec .k { color: var(--fg-mute); }
    .panel__spec .v { font-size: 13px; color: var(--fg); }
    .panel__chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .panel__chip {
      display: inline-flex; align-items: center;
      height: 22px; padding: 0 8px;
      background: var(--surface); color: var(--fg);
      border: 1px solid var(--line); border-radius: 4px;
      font-size: 11.5px; font-weight: 500;
    }
    .panel__chip--primary { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* 편집 가능 chip — 호버 시 강조, X 버튼 보임 */
    .panel__chip--editable { cursor: pointer; padding-right: 4px; transition: background 0.15s ease, border-color 0.15s ease; }
    .panel__chip--editable:hover { background: var(--accent-bg); border-color: var(--accent); }
    .panel__chip__del {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; margin-left: 4px;
      background: transparent; color: var(--fg-dim);
      border: 0; border-radius: 50%;
      font-family: inherit; font-size: 13px; line-height: 1; cursor: pointer;
      padding: 0; opacity: 0.5;
    }
    .panel__chip__del:hover { background: var(--err); color: #fff; opacity: 1; }
    .panel__chip__add {
      display: inline-flex; align-items: center;
      height: 22px; padding: 0 8px; margin-left: 2px;
      background: transparent; color: var(--accent);
      border: 1px dashed var(--accent); border-radius: 4px;
      font-family: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .panel__chip__add:hover { background: var(--accent); color: #fff; }
    .panel__spec-rows {
      margin-top: 4px; max-height: 120px; overflow: auto;
      font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.55;
      color: var(--fg-mute); background: var(--surface);
      border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
      white-space: pre-wrap; word-break: break-word;
    }

    .preview { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-height: calc(100vh - 160px); }
    .preview__head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--line); background: var(--soft); }
    .preview__head .meta { display: inline-flex; align-items: center; gap: 12px; font-size: 13px; color: var(--fg-mute); }
    .preview__head .dots { display: inline-flex; gap: 6px; }
    .preview__head .dots span { width: 11px; height: 11px; border-radius: 50%; }
    .preview__head .dots span:nth-child(1) { background: #FF5F57; }
    .preview__head .dots span:nth-child(2) { background: #FEBC2E; }
    .preview__head .dots span:nth-child(3) { background: #28C840; }
    .preview__head .actions { display: flex; gap: 6px; }
    .preview__head .actions button { height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--fg-mute); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-family: inherit; }
    .preview__head .actions button:hover { color: var(--fg); border-color: var(--line-2); }
    .preview__head .actions button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 데모 후보 chip */
    .preview__variants { display: inline-flex; gap: 4px; margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--line); }
    .preview__variants:empty { display: none; }
    .preview__variant {
      height: 26px; padding: 0 11px;
      background: var(--surface); color: var(--fg-mute);
      border: 1px solid var(--line); border-radius: 999px;
      font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
      transition: all 0.15s ease;
    }
    .preview__variant:hover { color: var(--fg); border-color: var(--line-2); }
    .preview__variant.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .preview__variant--ai { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
    .preview__variant--ai::before { content: '✨'; margin-right: 2px; }
    .preview__variant--ai.is-active { background: var(--accent); color: #fff; }

    .preview__frame { flex: 1; background: #FFFFFF; position: relative; min-height: calc(100vh - 220px); }
    .preview__frame iframe { width: 100%; height: 100%; border: 0; display: block; min-height: calc(100vh - 220px); }
    .preview__empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--fg-dim); background: var(--soft); text-align: center; padding: 40px; }
    .preview__empty svg { width: 56px; height: 56px; opacity: 0.5; margin-bottom: 16px; }
    .preview__empty h3 { margin: 0 0 8px; font-size: 16px; color: var(--fg-mute); font-weight: 700; }
    .preview__empty p  { margin: 0; font-size: 14px; line-height: 1.55; max-width: 360px; }
    .preview__empty p strong { color: var(--accent); }
    .preview__empty.is-hide { display: none; }

    .preview__loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px); z-index: 10; }
    .preview__loading.is-hide { display: none; }
    .preview__loading-ring { width: 48px; height: 48px; border: 3px solid var(--soft-h); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
    .preview__loading h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--fg); }
    .preview__loading p { margin: 0; font-size: 13px; color: var(--fg-mute); max-width: 360px; text-align: center; line-height: 1.55; }

    .preview__error { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--err-bg); color: var(--err); padding: 40px; text-align: center; }
    .preview__error.is-hide { display: none; }
    .preview__error h3 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
    .preview__error pre { margin: 8px 0 16px; font-size: 12px; color: var(--err); white-space: pre-wrap; max-width: 600px; line-height: 1.55; max-height: 200px; overflow: auto; }

    .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 22px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.10); opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.2s ease, transform 0.25s ease; }
    .toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast--ok  { border-color: rgba(27,158,79,0.40); }
    .toast--err { border-color: rgba(221,61,61,0.40); }
  </style>
</head>
<body>

<div class="shell" id="shell">
  <header class="top">
    <span><a href="../prd-validate/">← PRD 검증</a></span>
    <span>v0.4 · 디자인시스템 자동 조립</span>
  </header>
  <div id="root"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  /* ============================================================
   * 상수 / 스토리지
   * ============================================================ */
  var STORAGE_FLAG = 'scm-prd-validated';
  var STORAGE_DATA = 'scm-prd-data';
  var STORAGE_TEXT = 'scm-prd-text';
  var STORAGE_SUPP = 'scm-prd-supp';
  var STORAGE_AI_HINT = 'scm-prd-ai-hint';
  var STORAGE_KEY  = 'scm-ai-key';
  var STORAGE_HTML = 'scm-prd-wireframe-html';
  var STORAGE_SPEC = 'scm-prd-wireframe-spec';
  var STORAGE_PROXY = 'scm-proxy-url';

  var PROXY_URL = '';
  try { var sp = localStorage.getItem(STORAGE_PROXY); if (sp) PROXY_URL = sp; } catch (_) {}

  function isValidated() { try { return localStorage.getItem(STORAGE_FLAG) === '1'; } catch (_) { return false; } }
  function loadPrd()    { try { return JSON.parse(localStorage.getItem(STORAGE_DATA) || 'null'); } catch (_) { return null; } }
  function loadText()   { try { return localStorage.getItem(STORAGE_TEXT) || ''; } catch (_) { return ''; } }
  function loadSupp()   { try { return JSON.parse(localStorage.getItem(STORAGE_SUPP) || 'null'); } catch (_) { return null; } }
  function loadAiHint() { try { return localStorage.getItem(STORAGE_AI_HINT) || ''; } catch (_) { return ''; } }
  function loadCachedHtml() { try { return localStorage.getItem(STORAGE_HTML) || ''; } catch (_) { return ''; } }
  function saveCachedHtml(h){ try { localStorage.setItem(STORAGE_HTML, h || ''); } catch (_) {} }
  function captureWireframeHtml(ifr) {
    try {
      var doc = ifr.contentDocument || (ifr.contentWindow && ifr.contentWindow.document);
      if (!doc || !doc.documentElement) return '';
      var baseHref = (ifr.contentWindow && ifr.contentWindow.location && ifr.contentWindow.location.href) || ifr.src;
      var clone = doc.documentElement.cloneNode(true);
      var head = clone.querySelector('head');
      if (head) {
        var baseTag = head.querySelector('base');
        if (!baseTag) {
          baseTag = doc.createElement('base');
          head.insertBefore(baseTag, head.firstChild);
        }
        baseTag.setAttribute('href', baseHref);
      }
      return '<!DOCTYPE html>\n' + clone.outerHTML;
    } catch (e) {
      console.warn('[SCM Sim] captureWireframeHtml 실패', e);
      return '';
    }
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function showToast(msg, variant) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast is-show ' + (variant === 'err' ? 'toast--err' : 'toast--ok');
    setTimeout(function () { t.classList.remove('is-show'); }, 2400);
  }

  var CAT_LABEL = { dashboard: '대시보드', store: '스토어', hanger: '상품 관리', order: '발주/입고 관리', stock: '재고 관리', control: '운영 설정', setting: '관리자' };
  var WORK_LABEL = { 'new': '신규', 'feature': '기능 추가', 'improve': '개선' };
  var SOURCE_LABEL = { text: '텍스트', pdf: 'PDF', image: '이미지', url: 'URL' };

  /* ============================================================
   * Locked
   * ============================================================ */
  function renderLocked() {
    document.getElementById('root').innerHTML =
      '<div class="locked"><div class="locked__icon"><svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></div>' +
      '<h2>시뮬레이터 잠금 상태</h2><p>먼저 <strong>① PRD 검증</strong>을 통과해야 와이어프레임을 생성할 수 있습니다.</p>' +
      '<a class="btn btn--primary" href="../prd-validate/">PRD 검증으로 이동 →</a></div>';
  }

  /* ============================================================
   * Active
   * ============================================================ */
  function renderActive(prd, prdText, supp) {
    var html =
      '<section class="hero">' +
        '<div class="hero__main">' +
          '<span class="hero__eyebrow">Step 03 · Wireframe Auto-Assemble</span>' +
          '<h1 class="hero__title">디자인시스템으로 자동 조립된 와이어프레임</h1>' +
          '<p class="hero__sub">PRD → JSON → SCM Hub 실제 컴포넌트로 자동 마크업.</p>' +
        '</div>' +
        '<button class="hero__toggle" type="button" id="btn-panel-toggle">' +
          '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 4h10M3 8h10M3 12h10" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>' +
          '<span id="panel-toggle-label">PRD 패널 숨기기</span>' +
        '</button>' +
      '</section>' +

      '<div class="layout" id="layout">' +
        '<aside><div class="panel">' +
          '<div class="panel__head"><h3 class="panel__title">PRD 요약</h3><a class="panel__edit" href="../prd-validate/">편집 →</a></div>' +

          '<div class="panel__row"><span class="k">작업 유형</span><span class="v"><span class="work-tag">' + (WORK_LABEL[prd.workType] || '-') + '</span></span></div>' +
          '<div class="panel__row"><span class="k">페이지 / 기능</span><span class="v">' + esc(prd.name || '-') + ' <small>· ' + esc(prd.id || '-') + '</small></span></div>' +
          '<div class="panel__row"><span class="k">LNB 위치</span><span class="v">' + (CAT_LABEL[prd.category] || '-') + ' › ' + esc(prd.menu || '-') + '</span></div>' +
          '<div class="panel__row"><span class="k">주 사용자</span><span class="v">' + esc(prd.user || '-') + '</span></div>' +

             '👉 https://console.anthropic.com/settings/billing\n\n' +

    }
    if (/rate.?limit|429|too\s*many\s*requests/i.test(s)) {
      return '⏱ Anthropic API rate limit — 잠시 후 다시 시도하세요.\n\n' + s.substring(0, 200);
    }
    if (/overloaded|529/i.test(s)) {
      return '🔥 Anthropic API 일시 과부하 — 1분 정도 후 다시 시도하세요.\n\n' + s.substring(0, 200);
    }

      return '🔑 API 키가 유효하지 않습니다. 좌측 「변경」 버튼으로 새 sk-ant-... 키 입력하세요.\n\n' + s;
    }
    return s;
  }

  function extractJson(text) {
    if (!text) return null;
    // 1) markdown code block
    var cb = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (cb) { try { return JSON.parse(cb[1]); } catch (_) {} }
    // 2) full text
    try { return JSON.parse(text); } catch (_) {}
    // 3) first { ... last }
    var s = text.indexOf('{');
    var e = text.lastIndexOf('}');
    if (s !== -1 && e !== -1 && e > s) {
      try { return JSON.parse(text.substring(s, e + 1)); } catch (_) {}
    }
    // 4) 끊긴 JSON 복구 — max_tokens 한도 초과로 응답 truncated 된 경우.
    //    open 된 string/array/object 를 자동으로 닫아서 partial spec 이라도 살림.
    if (s !== -1) {
      var repaired = repairTruncatedJson(text.substring(s));
      if (repaired) {
        try {
          var obj = JSON.parse(repaired);
          console.warn('[SCM Sim] 응답이 truncated 되어 JSON 복구로 partial spec 살림 (alternatives 일부 누락 가능)');
          return obj;
        } catch (_) {}
      }
    }
    return null;
  }

  // 끊긴 JSON 문자열을 복구. 미닫힘 string/array/object 를 자동으로 닫음.
  // 마지막 valid 경계까지 자르고 닫음 — 보수적으로 동작.
  function repairTruncatedJson(s) {
    if (!s) return null;
    // 마지막 콤마/콜론 뒤 조각을 자름 (불완전한 key/value 제거)
    var i = s.length;
    while (i > 0 && /[,:\s]/.test(s[i - 1])) i--;
    s = s.substring(0, i);

    // string / object / array 깊이 추적
    var stack = [];   // '"' | '{' | '['
    var inStr = false;
    var esc = false;
    for (var j = 0; j < s.length; j++) {
      var c = s[j];
      if (inStr) {
        if (esc) { esc = false; continue; }
        if (c === '\\') { esc = true; continue; }
        if (c === '"') { inStr = false; stack.pop(); }
        continue;
      }
      if (c === '"') { inStr = true; stack.push('"'); continue; }
      if (c === '{') { stack.push('{'); continue; }
      if (c === '[') { stack.push('['); continue; }
      if (c === '}') { if (stack[stack.length - 1] === '{') stack.pop(); continue; }
      if (c === ']') { if (stack[stack.length - 1] === '[') stack.pop(); continue; }
    }

    // 마지막 비완료 조각 (예: '"key"' 가 있는데 콜론도 값도 없음) 잘라냄
    // 간단 휴리스틱: 마지막 '"' 이후가 '}' 이나 ']' 으로 닫혀있지 않으면 그 '"' 부터 잘라냄
    if (inStr) {
      // 미닫힘 string — 가장 최근 따옴표 시작 직전까지 잘라냄
      var lastQuote = s.lastIndexOf('"');
      if (lastQuote !== -1) {
        // string 시작 따옴표 위치 찾기 — 이전 따옴표
        var prevQuote = s.lastIndexOf('"', lastQuote - 1);
        // 미닫힘 string 의 시작 따옴표 직전까지 자르기
        s = s.substring(0, lastQuote);
        // 잘렸으니 stack 도 마지막 '"' 제거
        if (stack[stack.length - 1] === '"') stack.pop();
      }
    }
    // 끝부분 트레일링 콤마/콜론 다시 정리
    s = s.replace(/[,:\s]+$/, '');
    // 마지막 토큰이 key 만 있고 value 없는 경우 ("foo": ) 잘라냄
    s = s.replace(/,\s*"[^"]*"\s*:?\s*$/, '');
    s = s.replace(/"[^"]*"\s*:\s*$/, '');
    // 다시 끝 정리
    s = s.replace(/[,\s]+$/, '');

    // 남은 stack 을 역순으로 닫음
    while (stack.length) {
      var top = stack.pop();
      if (top === '{') s += '}';
      else if (top === '[') s += ']';
      else if (top === '"') s += '"';
    }
    return s;
  }

  function showLoading(on) {

  function showError(msg) {
    document.getElementById('preview-empty').classList.add('is-hide');
    document.getElementById('preview-loading').classList.add('is-hide');
    document.getElementById('preview-error').classList.remove('is-hide');
    var msgEl = document.getElementById('preview-error-msg');
    var text = msg || '알 수 없는 오류';
    // URL 자동 링크화 — billing 안내 등 클릭 가능하게
    msgEl.innerHTML = '';
    var parts = String(text).split(/(https?:\/\/[^\s]+)/g);
    parts.forEach(function (p) {
      if (/^https?:\/\//.test(p)) {
        var a = document.createElement('a');
        a.href = p;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = p;
        a.style.color = 'var(--accent)';
        a.style.textDecoration = 'underline';
        msgEl.appendChild(a);
      } else {
        msgEl.appendChild(document.createTextNode(p));
      }
    });
  }

    if (!td || text == null) return;
    // product-name (thumb + text) — text 부분만
    var pnText = td.querySelector('.scm-product-name__text');
    if (pnText) { pnText.textContent = text; return; }
    // chip 계열 (status-chip / tag / kind-chip / platform-tag / sku-status-pill)

  function pickFallbackLayout(prd, spec) {
    var hay = ((prd && prd.name) || '') + ' ' + ((prd && prd.menu) || '') + ' ' +
              ((spec && spec.pageHead && spec.pageHead.title) || '') + ' ' +
              ((spec && spec.pageHead && spec.pageHead.sub) || '');
    hay = hay.toLowerCase();
    if (/등록|신규|작성|입력|편집|수정|register|create|new|edit|form/.test(hay)) return 'form';
    if (/상태|흐름|진행|승인|반려|단계|process|status|workflow|kanban/.test(hay)) return 'kanban';
    if (/이력|히스토리|로그|감사|활동|타임라인|history|log|audit|timeline|activity/.test(hay)) return 'timeline';
    if (/현황|대시보드|요약|통계|kpi|summary|dashboard|overview/.test(hay)) return 'dashboard';
    if (/상세|detail|편집/.test(hay)) return 'master-detail';
    return 'cards'; // 기본 fallback
  }

  // 이미 사용된 layout 들을 피해서 가장 적합한 신규 layout 을 선택. usedLayouts 에 들어있는
  // layout 은 제외. 모든 layout 이 다 쓰였다면 'cards' 로 fallback.
  function pickFreshLayout(prd, spec, usedLayouts) {
    var preferred = pickFallbackLayout(prd, spec);
    var candidates = [preferred, 'cards', 'kanban', 'master-detail', 'dashboard', 'form', 'timeline'];
    for (var i = 0; i < candidates.length; i++) {
      if (usedLayouts.indexOf(candidates[i]) === -1) return candidates[i];
    }
    return 'cards';
  }

  // table.columns + rowSamples 를 기반으로 layout 별 layoutData 자동 합성
  // (AI 가 layoutData 안 채웠을 때 fallback — 빈 화면 방지)
  function synthesizeLayoutData(kind, spec) {
    var cols = (spec.table && spec.table.columns) || [];
    var rows = (spec.table && spec.table.rowSamples) || [];
    var labelCol = cols.findIndex(function (c) { return /상품|name|title|이름|제목|sku|code|코드|번호/i.test(c.label || ''); });
    var subCol   = cols.findIndex(function (c) { return /설명|sub|브랜드|brand|매장|store|카테고리|category/i.test(c.label || ''); });
    var statusCol = cols.findIndex(function (c) { return /상태|status/i.test(c.label || '') || c.type === 'status-chip'; });
    if (labelCol < 0) labelCol = 0;

    // 한국 패션/SCM 도메인 실데이터 풀 — AI 데이터 부족 시 fallback
    var POOL = {
      products: ['무탠다드 코튼 옥스포드 셔츠', '29CM 데님 와이드 팬츠', '아크테릭스 베타 자켓', '이지부스트 350 V2', '무탠다드 베이직 후디', '라이즈앤빌로우 크루넥 니트', 'MUSINSA STANDARD 셔츠', '무탠다드 트레이닝 팬츠', '나이키 에어포스 1', '아디다스 사니스 트레이너', '컨버스 척테일러 70', '폴로 랄프로렌 옥스포드'],
      brands: ['(주)무신사', '29CM', '무탠다드', 'MUSINSA STANDARD', '라이즈앤빌로우', '아크테릭스', 'YEEZY', '나이키', '아디다스'],
      stores: ['무신사 스탠다드 홍대', '29CM 성수 쇼룸', '무탠다드 강남', '무신사 스탠다드 명동', 'SSF 강남', '하이버 한남', '29CM 분당'],
      mds: ['김민준 MD', '이서연 MD', '박지훈 MD', '최유진 MD', '정수빈 MD', '한도윤 MD'],
      categories: ['상의 > 셔츠 > 옥스포드 셔츠', '하의 > 데님 팬츠 > 와이드 핏', '아우터 > 자켓 > 다운', '신발 > 스니커즈 > 캐주얼', '상의 > 니트 > 크루넥'],
      statuses: ['활성', '활성', '대기', '처리중', '완료', '완료', '오류', '승인', '반려'],
      prices: ['₩39,000', '₩89,000', '₩129,000', '₩239,000', '₩459,000', '₩1,247,500', '₩89,500'],
      qty: ['1,247', '530', '86', '12,540', '320', '4,580', '210'],
    };
    function pick(arr, i) { return arr[i % arr.length]; }
    function ensureRow(i) {
      if (rows[i] && rows[i].length) return rows[i];
      // synthetic row
      return [
        'SKU-2026-' + (1000 + i + 47),
        pick(POOL.products, i),
        pick(POOL.brands, i),
        pick(POOL.stores, i),
        pick(POOL.statuses, i),
        pick(POOL.mds, i),
        pick(POOL.prices, i),
        pick(POOL.qty, i),
      ];
    }

    if (kind === 'cards') {
      var cards = [];
      for (var i = 0; i < 12; i++) {
        var r = ensureRow(i);
        var meta = [pick(POOL.brands, i), pick(POOL.prices, i), '재고 ' + pick(POOL.qty, i)];
        cards.push({
          title: (rows[i] && rows[labelCol] !== undefined && rows[i][labelCol]) || pick(POOL.products, i),
          subtitle: (rows[i] && subCol >= 0 && rows[i][subCol]) || pick(POOL.categories, i),
          status: (rows[i] && statusCol >= 0 && rows[i][statusCol]) || pick(POOL.statuses, i),
          meta: meta,
        });
      }
      return { cards: cards };
    }
    if (kind === 'master-detail') {
      var list = rows.slice(0, 10).map(function (r, i) {
        return {
          title: r[labelCol] || ('항목 ' + (i + 1)),
          subtitle: subCol >= 0 ? r[subCol] : '',
          status: statusCol >= 0 ? r[statusCol] : '',
        };
      });
      while (list.length < 6) list.push({ title: '항목 ' + (list.length + 1), subtitle: '서브 정보' });
      var firstRow = rows[0] || [];
      var fields = cols.slice(0, 8).map(function (c, i) {
        return { label: c.label || '필드 ' + (i + 1), value: firstRow[i] || '-' };
      });
      return { list: list, detail: { sections: [{ title: '기본 정보', fields: fields.slice(0, 4) }, { title: '추가 정보', fields: fields.slice(4) }] } };
    }
    if (kind === 'kanban') {
      var statusValues = statusCol >= 0
        ? Array.from(new Set(rows.map(function (r) { return r[statusCol]; }).filter(Boolean)))
        : ['대기', '처리중', '완료', '승인'];
      if (!statusValues.length) statusValues = ['대기', '처리중', '완료'];
      var grouped = statusValues.map(function (sv, sIdx) {
        var groupRows = statusCol >= 0 ? rows.filter(function (r) { return r[statusCol] === sv; }) : [];
        var cards = groupRows.map(function (r, i) {
          var meta = [];
          for (var j = 0; j < cols.length && meta.length < 2; j++) {
            if (j === labelCol || j === statusCol) continue;
            if (r[j]) meta.push(r[j]);
          }
          if (!meta.length) meta = [pick(POOL.brands, sIdx * 3 + i), pick(POOL.mds, sIdx * 3 + i)];
          return { title: r[labelCol] || pick(POOL.products, sIdx * 3 + i), meta: meta };
        });
        // 데이터 부족 → 도메인 fallback 카드
        while (cards.length < 3) {
          var idx = cards.length + sIdx * 3;
          cards.push({
            title: 'PO-2026-' + (40 + idx) + ' ' + pick(POOL.products, idx),
            meta: [pick(POOL.brands, idx), pick(POOL.mds, idx)],
          });
        }
        return { label: sv, count: cards.length, cards: cards };
      });
      return { columns: grouped };
    }
    if (kind === 'dashboard') {
      var rc = rows.length || 12453;
      var stats = [
        { label: '전체 SKU', value: rc.toLocaleString(), delta: '+128' },
        { label: '활성', value: Math.floor(rc * 0.84).toLocaleString(), delta: '+92' },
        { label: '대기', value: Math.floor(rc * 0.08).toLocaleString() },
        { label: '오류', value: Math.floor(rc * 0.02).toLocaleString(), delta: '-3' },
      ];
      return {
        stats: stats,
        charts: [
          { title: '일별 등록 추이 (최근 30일)', hint: 'line chart · 일별 SKU 등록 건수' },
          { title: '카테고리별 비율', hint: 'pie chart · 상의/하의/아우터/신발/액세서리' },
        ],
      };
    }
    if (kind === 'form') {
      var formFields = cols.slice(0, 10).map(function (c) {
        var t = 'text';
        if (c.type === 'date') t = 'date';
        else if (c.type === 'number') t = 'number';
        else if (/설명|메모|notes|description/i.test(c.label || '')) t = 'textarea';
        else if (c.type === 'kind-chip' || c.type === 'status-chip' || c.type === 'platform-tag') t = 'select';
        return { label: c.label || '필드', type: t, placeholder: c.label ? (c.label + ' 입력') : '' };
      });
      // 필드 부족 시 도메인 기본 필드 추가
      if (formFields.length < 6) {
        var defaults = [
          { label: '상품명', type: 'text', placeholder: '예: 무탠다드 코튼 옥스포드 셔츠' },
          { label: '브랜드', type: 'select', placeholder: '브랜드 선택' },
          { label: '카테고리', type: 'select', placeholder: '카테고리 선택' },
          { label: '판매가', type: 'number', placeholder: '예: 39000' },
          { label: '담당 MD', type: 'select', placeholder: '담당자 선택' },
          { label: '상품 설명', type: 'textarea', placeholder: '상품 상세 설명을 입력하세요' },
        ];
        defaults.forEach(function (d) {
          if (!formFields.some(function (f) { return f.label === d.label; })) formFields.push(d);
        });
      }
      return {
        sections: [
          { title: '기본 정보', fields: formFields.slice(0, 5) },
          { title: '추가 정보', fields: formFields.slice(5) },
        ],
      };
    }
    if (kind === 'timeline') {
      var items = rows.slice(0, 8).map(function (r, i) {
        var hh = (10 + i % 8).toString().padStart(2, '0');
        var mm = (i * 7 % 60).toString().padStart(2, '0');
        return {
          time: '2026-05-' + String((i % 28) + 1).padStart(2, '0') + ' ' + hh + ':' + mm,
          actor: pick(POOL.mds, i),
          action: r[labelCol] || (pick(POOL.products, i) + ' 등록'),
          detail: subCol >= 0 && r[subCol] ? r[subCol] : (pick(POOL.brands, i) + ' / ' + pick(POOL.categories, i)),
        };
      });
      while (items.length < 8) {
        var idx = items.length;
        items.push({
          time: '2026-05-' + String(idx + 1).padStart(2, '0') + ' ' + (9 + idx) + ':' + ((idx * 11) % 60).toString().padStart(2, '0'),
          actor: pick(POOL.mds, idx),
          action: pick(['신규 등록', '상태 변경', '가격 수정', '재고 조정', '승인 요청', '반려 처리'], idx),
          detail: pick(POOL.products, idx) + ' (' + pick(POOL.brands, idx) + ')',
        });
      }
      return { items: items };
    }
    return {};
  }

  function renderLayoutByKind(kind, spec, prd) {
    var data = spec.layoutData || {};
    if (kind === 'cards')         return renderCardsLayout(data);
    if (kind === 'master-detail') return renderSplitLayout(data);
    if (kind === 'kanban')        return renderKanbanLayout(data);
    if (kind === 'dashboard')     return renderDashboardLayout(data, spec);
    if (kind === 'form')          return renderFormLayout(data, spec);
    if (kind === 'timeline')      return renderTimelineLayout(data);
    return '<div class="wf-section" style="padding: 32px; color: #888;">알 수 없는 layout: ' + escH(kind) + '</div>';
  }

  function renderCardsLayout(data) {
    var cards = (data.cards || []);
    if (!cards.length) {
      // fallback dummy 8장
      cards = [];
      for (var i = 0; i < 8; i++) cards.push({ title: '카드 항목 ' + (i + 1), subtitle: '서브 정보', status: '활성', meta: ['메타1', '메타2'] });
    }
    var cardsHtml = cards.map(function (c) {
      var metaHtml = (c.meta || []).map(function (m) { return '<span>' + escH(m) + '</span>'; }).join('');
      return '<article class="wf-card">' +
        '<div class="wf-card__thumb"></div>' +
        '<h3 class="wf-card__title">' + escH(c.title || '제목') + '</h3>' +
        (c.subtitle ? '<p class="wf-card__sub">' + escH(c.subtitle) + '</p>' : '') +
        (metaHtml ? '<div class="wf-card__meta">' + metaHtml + '</div>' : '') +
        (c.status ? '<div class="wf-card__chips"><span class="' + statusChipClass(c.status) + '">' + escH(c.status) + '</span></div>' : '') +
        '</article>';
    }).join('');
    return '<div class="wf-cards">' + cardsHtml + '</div>';
  }

  function renderSplitLayout(data) {
    var list = data.list || [];
    if (!list.length) for (var i = 0; i < 8; i++) list.push({ title: '항목 ' + (i + 1), subtitle: '서브 정보', status: '활성' });
    var detail = data.detail || { sections: [{ title: '기본 정보', fields: [{ label: '필드 1', value: '값 1' }, { label: '필드 2', value: '값 2' }] }] };
    var listHtml = list.map(function (it, i) {
      return '<div class="wf-split__item' + (i === 0 ? ' is-active' : '') + '">' +
        '<span class="wf-split__item-title">' + escH(it.title || '항목') + '</span>' +
        (it.subtitle ? '<span class="wf-split__item-sub">' + escH(it.subtitle) + '</span>' : '') +
        '</div>';
    }).join('');
    var detailHtml = (detail.sections || []).map(function (s) {
      var fields = (s.fields || []).map(function (f) {
        return '<dt>' + escH(f.label || '') + '</dt><dd>' + escH(f.value || '-') + '</dd>';
      }).join('');
      return '<div class="wf-split__detail-section"><h3>' + escH(s.title || '섹션') + '</h3>' +
        '<dl class="wf-split__detail-fields">' + fields + '</dl></div>';
    }).join('');
    return '<div class="wf-split">' +
      '<aside class="wf-split__list">' +
        '<div class="wf-split__search"><input type="text" placeholder="검색" /></div>' +
        '<div class="wf-split__items">' + listHtml + '</div>' +
      '</aside>' +
      '<section class="wf-split__detail">' + detailHtml + '</section>' +
      '</div>';
  }

  function renderKanbanLayout(data) {
    var cols = data.columns || [];
    if (!cols.length) cols = [
      { label: '대기', count: 3, cards: [{ title: '항목 1', meta: ['홍길동', '2026-05-01'] }, { title: '항목 2', meta: ['김민준', '2026-05-02'] }, { title: '항목 3', meta: ['이서연', '2026-05-02'] }] },
      { label: '처리중', count: 2, cards: [{ title: '항목 4', meta: ['박지훈', '2026-05-03'] }, { title: '항목 5', meta: ['최유진', '2026-05-03'] }] },
      { label: '완료', count: 4, cards: [{ title: '항목 6', meta: ['홍길동', '2026-05-04'] }, { title: '항목 7', meta: ['김민준', '2026-05-04'] }] },
    ];
    var colsHtml = cols.map(function (col) {
      var cardsHtml = (col.cards || []).map(function (c) {
        var metaHtml = (c.meta || []).map(function (m) { return '<span>' + escH(m) + '</span>'; }).join('');
        return '<div class="wf-kanban__card">' +
          '<h4 class="wf-kanban__card-title">' + escH(c.title || '항목') + '</h4>' +
          (metaHtml ? '<div class="wf-kanban__card-meta">' + metaHtml + '</div>' : '') +
          '</div>';
      }).join('');
      return '<div class="wf-kanban__col">' +
        '<div class="wf-kanban__col-head">' +
          '<span class="wf-kanban__col-label">' + escH(col.label || '컬럼') + '</span>' +
          '<span class="wf-kanban__col-count">' + (col.count != null ? col.count : (col.cards || []).length) + '</span>' +
        '</div>' +
        '<div class="wf-kanban__cards">' + cardsHtml + '</div>' +
        '</div>';
    }).join('');
    return '<div class="wf-kanban">' + colsHtml + '</div>';
  }

  function renderDashboardLayout(data, spec) {
    var stats = data.stats || [{ label: '전체', value: '1,234', delta: '+12' }, { label: '활성', value: '987' }, { label: '오류', value: '12', delta: '-3' }, { label: '대기', value: '45' }];
    var charts = data.charts || [{ title: '추이', hint: 'line chart' }, { title: '비율', hint: 'pie chart' }];
    var statsHtml = stats.map(function (s) {
      var deltaCls = !s.delta ? '' : (/^-/.test(String(s.delta)) ? 'wf-stat__delta--down' : 'wf-stat__delta--up');
      return '<div class="wf-stat">' +
        '<div class="wf-stat__label">' + escH(s.label || '') + '</div>' +
        '<div class="wf-stat__value">' + escH(s.value || '0') + '</div>' +
        (s.delta ? '<span class="wf-stat__delta ' + deltaCls + '">' + escH(s.delta) + '</span>' : '') +
        '</div>';
    }).join('');
    var chartsHtml = charts.map(function (c) {
      return '<div class="wf-chart"><h3 class="wf-chart__title">' + escH(c.title || '차트') + '</h3>' +
        '<div class="wf-chart__placeholder">' + escH(String(c.hint || 'CHART').toUpperCase()) + '</div></div>';
    }).join('');
    return '<div class="wf-dashboard">' +
      '<div class="wf-dashboard__stats">' + statsHtml + '</div>' +
      '<div class="wf-dashboard__charts">' + chartsHtml + '</div>' +
      '</div>';
  }

  function renderFormLayout(data, spec) {
    var sections = data.sections || [{ title: '기본 정보', fields: [{ label: '이름', type: 'text', placeholder: '예: 홍길동' }, { label: '카테고리', type: 'select' }, { label: '설명', type: 'textarea' }] }];
    var sectionsHtml = sections.map(function (s) {
      var fieldsHtml = (s.fields || []).map(function (f) {
        var t = f.type || 'text';
        var placeholder = f.placeholder || (f.label ? f.label + ' 입력' : '');
        var input;
        if (t === 'textarea')      input = '<textarea class="wf-form__textarea" placeholder="' + escH(placeholder) + '"></textarea>';
        else if (t === 'select')   input = '<div class="wf-form__select"><input class="wf-form__input" placeholder="' + escH(placeholder) + '" readonly /></div>';
        else if (t === 'number')   input = '<input type="number" class="wf-form__input" placeholder="' + escH(placeholder) + '" />';
        else if (t === 'date')     input = '<input type="date" class="wf-form__input" />';
        else                       input = '<input type="text" class="wf-form__input" placeholder="' + escH(placeholder) + '" />';
        return '<label class="wf-form__label">' + escH(f.label || '') + '</label><div>' + input + '</div>';
      }).join('');
      return '<section class="wf-form__section">' +
        '<h3 class="wf-form__section-title">' + escH(s.title || '섹션') + '</h3>' +
        '<div class="wf-form__fields">' + fieldsHtml + '</div>' +
        '</section>';
    }).join('');
    return '<div class="wf-form">' + sectionsHtml +
      '<div class="wf-form__footer">' +
        '<button class="scm-button" type="button">취소</button>' +
        '<button class="scm-button scm-button--primary" type="button">저장</button>' +
      '</div>' +
      '</div>';
  }

  function renderTimelineLayout(data) {
    var items = data.items || [];
    if (!items.length) for (var i = 0; i < 6; i++) items.push({ time: '2026-05-0' + (i + 1) + ' 14:23', actor: '홍길동', action: '항목 변경', detail: '필드 A 를 "값 1" → "값 2" 로 변경.' });

      return '<li class="wf-timeline__item">' +
        '<span class="wf-timeline__dot"></span>' +
        '<div class="wf-timeline__time">' + escH(it.time || '') + '</div>' +
        '<div class="wf-timeline__head">' +
          '<span class="wf-timeline__actor">' + escH(it.actor || '시스템') + '</span>' +
          '<span class="wf-timeline__action">' + escH(it.action || '') + '</span>' +
        '</div>' +
        (it.detail ? '<div class="wf-timeline__detail">' + escH(it.detail) + '</div>' : '') +
        '</li>';
    }).join('');
    return '<ul class="wf-timeline">' + itemsHtml + '</ul>';
  }

  // wireframe-template.html 의 DOM 을 PRD spec 으로 강제 변형
  function injectPrd(iframe, prd, spec) {
    console.log('[SCM Sim] injectPrd 호출됨', { hasSpec: !!spec, prd: prd && prd.name, columns: spec && spec.table && spec.table.columns && spec.table.columns.length });
    try {
      var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
      if (!doc) {
        console.warn('[SCM Sim] iframe.contentDocument 접근 실패 — cross-origin 차단? URL:', iframe.src);
        return false;
      }
      console.log('[SCM Sim] doc 접근 OK, title:', doc.title, '| body:', !!doc.body);

      // 와이어프레임 모든 layout 에 상호작용 CSS + JS 주입 (filter chip 클릭 toast / row hover / 체크박스 토글 등)
      ensureLayoutCss(doc);

      // === 1. <title> ===
      if (prd.name) doc.title = prd.name + ' — SCM Hub';

      // === 2. LNB 1뎁스 (아이콘 + 라벨) + 2뎁스 (메뉴 + NEW/개선중) ===
      var l1Key = prd.category || 'dashboard';
      var l1Label = CAT_LABEL[l1Key] || l1Key;
      var l1IconHtml = L1_ICONS[l1Key] || L1_ICONS.dashboard;
      var lnbIcon = doc.querySelector('[data-wf-lnb-icon]');
      if (lnbIcon) lnbIcon.innerHTML = l1IconHtml;
      var lnbLabel = doc.querySelector('[data-wf-lnb-label]') || doc.querySelector('.scm-lnb-item.is-active .scm-lnb-label');
      if (lnbLabel) lnbLabel.textContent = l1Label;
      var l2text = doc.querySelector('.scm-lnb-l2.is-active .scm-lnb-l2-text');
      if (l2text && prd.menu) l2text.textContent = prd.menu;
      var l2tag = doc.querySelector('.scm-lnb-l2.is-active .scm-lnb-tag');
      if (l2tag) {
        l2tag.classList.remove('scm-lnb-tag--new', 'scm-lnb-tag--wip');
        if (prd.workType === 'improve') { l2tag.classList.add('scm-lnb-tag--wip'); l2tag.textContent = '개선중'; }
        else                            { l2tag.classList.add('scm-lnb-tag--new'); l2tag.textContent = 'NEW'; }
      }

      // === 3. page-head title (sub 는 wireframe-template 에서 제거됨) ===
      var h1 = doc.querySelector('.scm-page-head__title');
      if (h1 && prd.name) h1.textContent = prd.name;

      if (!spec) return true;

      // === 4. page-head 액션 버튼 — 갯수 + 라벨 ===
      var actionsContainer = doc.querySelector('.scm-page-head__actions');
      if (actionsContainer && spec.pageHead && spec.pageHead.actions) {
        actionsContainer.innerHTML = '';
        spec.pageHead.actions.forEach(function (a) {
          var btn = doc.createElement('button');
          btn.type = 'button';
          btn.className = a.kind === 'primary' ? 'scm-button scm-button--primary'
                        : a.kind === 'danger'  ? 'scm-button scm-button--danger'
                        : 'scm-button';
          btn.textContent = a.label || '';
          actionsContainer.appendChild(btn);
        });
      }

      // === 4-1. layout 디스패치 — table 이 아니면 main 의 filter-bar 이하 영역을
      //          layout 별 마크업으로 교체하고 종료 (table 분기 5~9 스킵).
      var layoutKind = spec.layout || 'table';
      if (layoutKind !== 'table') {
        ensureLayoutCss(doc);
        var mainEl = doc.querySelector('main');
        if (mainEl) {
          var pageHeadEl = mainEl.querySelector('.scm-page-head');
          mainEl.innerHTML = (pageHeadEl ? pageHeadEl.outerHTML : '') +
            renderLayoutByKind(layoutKind, spec, prd);
        }
        return true;
      }

      // === 5. 필터 — 갯수 + 라벨 ===
      var filterTrack = doc.querySelector('.scm-filter-overflow__track');
      if (filterTrack && spec.filters && spec.filters.length) {
        filterTrack.innerHTML = '';
        spec.filters.forEach(function (f) {
          var label = (f && f.label) || f || '';
          var filter = doc.createElement('button');
          filter.type = 'button';
          filter.className = 'scm-filter-select';
          filter.setAttribute('data-state', 'placeholder');
          filter.innerHTML = '<span class="scm-filter-select__label">' + escH(label) + '</span>' +
            '<span class="scm-filter-select__value">' + escH(label) + '</span>' +
            '<svg class="scm-filter-select__chev" viewBox="0 0 16 16"><path d="M3 5.5l5 5 5-5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>';
          filterTrack.appendChild(filter);
        });
      }

      // === 6. stats-bar 의 "전체 N" ===
      var statNum = doc.querySelector('.scm-stats-bar__counts .scm-stat__num');
      var rowCount = (spec.table && spec.table.rowSamples && spec.table.rowSamples.length) || 5;
      if (statNum) statNum.textContent = rowCount;

      // === 7. 테이블 — cb-col + col-no + 데이터 컬럼 + col-spacer 구조 유지 ===
      var thead = doc.querySelector('.mp-table thead tr');
      var tbody = doc.querySelector('.mp-table tbody');
      if (thead && tbody && spec.table && spec.table.columns) {
        var newCols = spec.table.columns;
        var rowSamples = spec.table.rowSamples || [];
        var checkable = spec.table.checkable !== false;

        // 체크박스 미노출 처리 (html.no-checkbox)
        var html = doc.documentElement;
        if (checkable) html.classList.remove('no-checkbox');
        else           html.classList.add('no-checkbox');

        // === thead: cb-col + col-no(frozen-2) + 새 데이터 컬럼들 + col-spacer ===
        thead.innerHTML =
          '<th class="cb-col col-frozen-1"><span class="scm-checkbox" role="checkbox" aria-checked="false" tabindex="0"></span></th>' +
          '<th class="col-auto col-no col-frozen-2">No</th>' +
          newCols.map(function (col) {
            var cls = col.width === 'large' ? 'col-large' : col.width === 'medium' ? 'col-medium' : 'col-auto';
            return '<th class="' + cls + '">' + escH(col.label || '') + '</th>';
          }).join('') +
          '<th class="col-spacer" data-empty="true" aria-hidden="true"></th>';

        // === tbody: 각 행마다 cb-col + col-no + 데이터 + col-spacer ===
        var rows = Math.max(rowSamples.length, 5);
        var tbodyHtml = '';
        for (var r = 0; r < rows; r++) {
          tbodyHtml += '<tr>' +
            '<td class="cb-col col-frozen-1"><span class="scm-checkbox" role="checkbox" aria-checked="false" tabindex="0"></span></td>' +
            '<td class="col-auto col-no col-frozen-2">' + (r + 1) + '</td>' +
            newCols.map(function (col, c) {
              var cls = col.width === 'large' ? 'col-large' : col.width === 'medium' ? 'col-medium' : 'col-auto';
              var sampleValue = (rowSamples[r] && rowSamples[r][c] != null) ? String(rowSamples[r][c]) : '';
              return '<td class="' + cls + '">' + renderTypedCellHTML(col.type, sampleValue, r) + '</td>';
            }).join('') +
            '<td class="col-spacer" aria-hidden="true"></td>' +
          '</tr>';
        }
        tbody.innerHTML = tbodyHtml;
      }

      // === 8. thead 첫 행 모든 th 에 검정 1.5px 라인 강제 (inline style — 모든 cascade 우선)
      if (thead) {
        var firstRowThs = thead.querySelectorAll('tr:first-child > th');
        firstRowThs.forEach(function (th) {
          th.style.borderTop = '1.5px solid #000';
          th.style.position = 'relative';
        });
      }

      // === 9. (sticky thead 시스템 비활성화로 SCMTable.init 호출 불필요)
      return true;
    } catch (e) {
      console.warn('[SCM Sim] PRD 주입 실패 (cross-origin?):', e && e.message);
      return false;
    }
  }

  function renderIframe(prd, url, spec) {
    // 캐시 무효화 — wireframe-template 가 변경될 때 옛 버전 로드 차단
    var bustedUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + 'ts=' + Date.now();
    console.log('[SCM Sim] renderIframe 호출 — url:', bustedUrl, 'spec 있음:', !!spec);
    var frame = document.getElementById('preview-frame');
    var existing = document.getElementById('preview-iframe');
    if (existing) existing.remove();
    var ifr = document.createElement('iframe');
    ifr.id = 'preview-iframe';
    ifr.src = bustedUrl;
    ifr.addEventListener('load', function () {
      console.log('[SCM Sim] iframe load 이벤트 fire — injectPrd 호출 시작');
      var ok = injectPrd(ifr, prd, spec);
      console.log('[SCM Sim] injectPrd 결과:', ok);
      if (!ok) {
        showToast('주입 실패 — F12 콘솔 확인', 'err');
        return;
      }
      setTimeout(function () {
        var snapshot = captureWireframeHtml(ifr);
        if (snapshot) {
          currentHtml = snapshot;
          saveCachedHtml(snapshot);
        }
      }, 60);
    });
    frame.appendChild(ifr);
    document.getElementById('preview-empty').classList.add('is-hide');
  }

  async function build(prd, prdText, supp) {
    clearError();
    showLoading(true);

    var byokKey = '';
    try { byokKey = (localStorage.getItem(STORAGE_KEY) || '').trim(); } catch (_) {}
    if (!byokKey || !/^sk-ant-/.test(byokKey)) {
      showLoading(false);
      showError('Anthropic 키가 설정되지 않았습니다.\n좌측 「키 입력」 버튼으로 sk-ant-... 키를 입력하세요.');
      return;
    }

    // 1) 데모 페이지 매핑 — 가장 유사한 실제 데모를 base 로
    var candidates = pickDemoCandidates(prd);
    var demoUrl = candidates[0].url;

    // 2) AI spec 받기 — PRD 의 진짜 구조
    var spec = null;
    try {
      spec = await fetchSpec(byokKey, prd, prdText, supp);
      try { localStorage.setItem(STORAGE_SPEC, JSON.stringify(spec)); } catch (_) {}
    } catch (e) {
      showLoading(false);
      showError(friendlyApiError((e && e.message) || String(e)));
      showToast('AI 호출 실패', 'err');
      return;
    }

    // 2-1) deep clone — alternatives 가 main spec 의 table/filters reference 공유 차단
    spec = JSON.parse(JSON.stringify(spec));
    if (!spec.layout) spec.layout = 'table';

    // 3) AI 응답 검증/보강 — 필터 ↔ 컬럼 1:1 매칭 강제 (table 레이아웃에만 적용)
    reconcileSpec(spec);
    console.log('[SCM Sim] reconcileSpec 후 — main columns:', ((spec.table && spec.table.columns) || []).map(function(c){return c.label;}));

    // 3-1) 메인 spec + alternatives 를 variant 후보로 묶음
    var allVariants = [{ label: '메인 (PRD 그대로)', spec: spec }];
    if (spec.alternatives && spec.alternatives.length) {
      var usedLayouts = [spec.layout || 'table']; // 이미 사용된 layout 추적 — 중복 방지
      spec.alternatives.forEach(function (alt, altIdx) {
        var isAiVariant = /AI\s*추천|자유\s*제안/.test(alt.label || '') || altIdx >= 1;
        var altLayout = alt.layout || 'table';
        var altLayoutData = alt.layoutData || null;

        // ★ AI 추천 variant 가 이미 사용된 layout 과 같으면 강제로 다른 layout 으로 전환.
        //   메인과도, 다른 AI 추천과도 겹치지 않게.
        if (isAiVariant && usedLayouts.indexOf(altLayout) !== -1) {
          altLayout = pickFreshLayout(prd, spec, usedLayouts);
          altLayoutData = altLayoutData || synthesizeLayoutData(altLayout, spec);
          alt.customNotes = alt.customNotes ||
            'AI 가 다른 variant 와 동일한 layout 을 제안해서 PRD 본문 키워드 기반으로 "' + altLayout + '" 로 자동 전환했습니다.';
        }
        // layout != 'table' 인데 layoutData 비어있으면 합성 — 빈 화면 방지
        if (altLayout !== 'table' && (!altLayoutData || Object.keys(altLayoutData).length === 0)) {
          altLayoutData = synthesizeLayoutData(altLayout, spec);
        }
        usedLayouts.push(altLayout);

        var altSpec = {
          pageHead: spec.pageHead,
          filters: alt.filters || spec.filters,
          table: alt.table || spec.table,
          empty: spec.empty,
          customNotes: alt.customNotes || '',
          layout: altLayout,
          layoutData: altLayoutData,
        };
        allVariants.push({ label: alt.label || '변형', spec: altSpec });
      });
    }

    // 4) 데모 페이지 iframe.src 직접 로드 → load 후 DOM 강제 변형
    showLoading(false);
    currentSpec = spec;
    currentPrd = prd;
    currentDemoUrl = demoUrl;
    renderIframe(prd, demoUrl, spec);
    renderVariantChipsForSpec(prd, allVariants, 0);
    fillSpecPanel(spec);
    enableActions();

    // 5) 학습 history 저장
    saveHistoryEntry(prd, spec, '메인 (PRD 그대로)');

    var c = (spec.table && spec.table.columns && spec.table.columns.length) || 0;
    var f = (spec.filters && spec.filters.length) || 0;
    var a = (spec.pageHead && spec.pageHead.actions && spec.pageHead.actions.length) || 0;
    var altCount = (spec.alternatives && spec.alternatives.length) || 0;
    showToast('PRD 적용 · 컬럼 ' + c + ' · 필터 ' + f + ' · 액션 ' + a + (altCount ? ' · 변형 ' + altCount + '개' : ''), 'ok');
  }

  // 필터 라벨 → 컬럼 type 자동 추론
  function inferColumnTypeFromLabel(label) {
    var l = String(label || '').toLowerCase();
    if (/상태|status/.test(l)) return 'status-chip';
    if (/일자|날짜|date|등록일|수정일/.test(l)) return 'date';
    if (/번호|코드|code\b|id\b|sku|po\b|uid/.test(l)) return 'code-link';
    if (/플랫폼|platform|채널/.test(l)) return 'platform-tag';
    if (/유형|kind|타입|분류|구분/.test(l)) return 'kind-chip';
    if (/상품명|product|name/.test(l)) return 'product-name';
    if (/수량|금액|가격|qty|price|amount/.test(l)) return 'number';
    return 'text';
  }

  // 필터 라벨 → dummy 데이터 자동 추론
  function inferDummyValue(label, rowIdx) {
    var l = String(label || '').toLowerCase();
    var r = rowIdx + 1;
    if (/상태/.test(l)) return ['활성', '대기', '완료', '오류', '처리중'][rowIdx % 5];
    if (/일자|날짜|date|등록일/.test(l)) return '2026-05-' + String(r * 3 + 1).padStart(2, '0');
    if (/번호|코드/.test(l)) return 'CD-' + (1000 + r);
    if (/플랫폼|platform/.test(l)) return ['29CM', '무신사', '하이버', 'SSF', '무탠다드'][rowIdx % 5];
    if (/유형|타입|분류|구분/.test(l)) return ['일반', '특가', '신상', '시즌'][rowIdx % 4];
    if (/매장/.test(l)) return ['무신사 스탠다드 홍대점', '29CM 성수점', '무탠다드 강남점'][rowIdx % 3];
    if (/브랜드/.test(l)) return ['(주)무신사', '29CM', '무탠다드'][rowIdx % 3];
    if (/MD|담당/.test(l)) return ['김민준 MD', '이서연 MD', '박지훈 MD'][rowIdx % 3];
    if (/여부/.test(l)) return ['초도', '재입고'][rowIdx % 2];
    return '샘플 ' + r;
  }

  // 라벨 정규화 — 공백/대소문자/특수문자 차이 무시
  function normalizeLabel(s) {
    return String(s || '').trim().toLowerCase()
      .replace(/\s+/g, ' ')        // 다중 공백 → 1개
      .replace(/[()[\]·.,/]/g, ''); // 흔한 특수문자 제거
  }

  // 필터 항목을 정규화된 라벨로 변환 (배열/객체/string 모두 처리)
  function getFilterLabel(f) {
    if (typeof f === 'string') return f;
    if (f && typeof f === 'object') return f.label || f.name || '';
    return '';
  }

  // 필터 ↔ 컬럼 매칭 보장 + alternatives 도 동일 처리
  function reconcileSpec(spec) {
    if (!spec) { console.warn('[SCM Sim] reconcileSpec: spec 없음'); return; }
    var fixOne = function (s, tag) {
      if (!s) return;
      // layout != 'table' 인 경우 컬럼/필터 보정 스킵 — 카드/칸반/대시보드/폼/타임라인은
      // 자체 layoutData 로 렌더되므로 table 강제 보강하면 오히려 의미 없는 데이터 생김
      var layoutKind = s.layout || (s.table ? 'table' : 'table');
      if (layoutKind !== 'table' && layoutKind !== 'dashboard' && layoutKind !== 'master-detail') {
        console.log('[SCM Sim] reconcileSpec ' + tag + ': layout=' + layoutKind + ' — 테이블 보강 스킵');
        return;
      }
      if (!s.table) {
        console.warn('[SCM Sim] reconcileSpec ' + tag + ': spec.table 없음');
        return;
      }
      // filters 가 array 가 아니어도 처리 (가설 D)
      if (!Array.isArray(s.filters)) {
        console.warn('[SCM Sim] reconcileSpec ' + tag + ': filters 가 array 아님 — 빈 배열로 강제', s.filters);
        s.filters = [];
      }
      s.table.columns = s.table.columns || [];
      s.table.rowSamples = s.table.rowSamples || [];

      // 정규화된 라벨로 매칭 (가설 B)
      var existingNormalized = s.table.columns.map(function (c) { return normalizeLabel(c.label); });
      var addedCount = 0;
      var skippedSamples = [];

      s.filters.forEach(function (f) {
        var label = getFilterLabel(f);
        if (!label) return;
        var n = normalizeLabel(label);
        if (existingNormalized.indexOf(n) !== -1) {
          skippedSamples.push(label);
          return;
        }
        var col = {
          label: label,
          type: inferColumnTypeFromLabel(label),
          width: /상품명|product/.test(String(label).toLowerCase()) ? 'large' : 'auto',
        };
        s.table.columns.push(col);
        existingNormalized.push(n);
        var rowCount = Math.max(s.table.rowSamples.length, 5);
        for (var r = 0; r < rowCount; r++) {
          if (!s.table.rowSamples[r]) s.table.rowSamples[r] = [];
          s.table.rowSamples[r].push(inferDummyValue(label, r));
        }
        addedCount++;
      });
      console.log('[SCM Sim] reconcileSpec ' + tag + ': filters=' + s.filters.length + ', columns 보강 전=' + (s.table.columns.length - addedCount) + ', 추가=' + addedCount + ', 보강 후=' + s.table.columns.length + (skippedSamples.length ? ', 이미매칭=[' + skippedSamples.join(', ') + ']' : ''));
    };
    fixOne(spec, 'main');
    if (spec.alternatives) spec.alternatives.forEach(function (alt, i) {
      // alt 가 일부만 override 하는 경우 deep clone 으로 main 과 분리
      var altClone = JSON.parse(JSON.stringify({
        filters: alt.filters || spec.filters,
        table: alt.table || spec.table,
      }));
      fixOne(altClone, 'alt[' + i + '] ' + (alt.label || ''));
      alt.filters = altClone.filters;
      alt.table = altClone.table;
    });
  }

  // 학습 history 저장 (최대 10개)
  function saveHistoryEntry(prd, spec, selectedVariant) {
    try {
      var history = JSON.parse(localStorage.getItem('scm-prd-history') || '[]');
      var entry = {
        ts: Date.now(),
        name: prd.name,
        menu: prd.menu,
        category: prd.category,
        columns: ((spec.table && spec.table.columns) || []).map(function (c) { return c.label; }),
        filters: (spec.filters || []).map(function (f) { return f.label || f; }),
        actions: ((spec.pageHead && spec.pageHead.actions) || []).map(function (a) { return a.label; }),
        selectedVariant: selectedVariant,
      };
      history.push(entry);
      // 최대 10개만 유지
      if (history.length > 10) history = history.slice(-10);
      localStorage.setItem('scm-prd-history', JSON.stringify(history));
    } catch (_) {}
  }

  // Variant chip — 메인 + alternatives 묶어서 노출
  function renderVariantChipsForSpec(prd, variants, currentIdx) {
    var container = document.getElementById('preview-variants');
    if (!container) return;
    if (!variants || variants.length <= 1) { container.innerHTML = ''; return; }

    container.innerHTML = variants.map(function (v, i) {
      var isActive = (i === currentIdx);
      var isAI = /AI\s*추천|자유\s*제안/.test(v.label || '') || (v.spec && v.spec.customNotes);
      var cls = 'preview__variant' + (isActive ? ' is-active' : '') + (isAI ? ' preview__variant--ai' : '');
      return '<button class="' + cls + '" type="button" data-idx="' + i + '" title="' + esc(v.label) + (isAI ? ' — 신규 컴포넌트/레이아웃 제안 포함' : '') + '">' + esc(v.label) + '</button>';
    }).join('');

    container.querySelectorAll('.preview__variant').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        var v = variants[idx];
        if (!v) return;
        // active 갱신
        container.querySelectorAll('.preview__variant').forEach(function (x) {
          x.classList.toggle('is-active', x === btn);
        });
        // iframe 통째로 새로 로드 — 이전 variant 가 비-table layout 이었다면 main 의
        // filter-bar/stats-bar/table 이 모두 교체된 상태라 in-place mutation 으로는
        // table layout 으로 돌아갈 수 없음. 깨끗한 template 위에서 다시 inject.
        currentSpec = v.spec;
        currentPrd = prd;
        renderIframe(prd, currentDemoUrl, v.spec);
        fillSpecPanel(v.spec);
        saveHistoryEntry(prd, v.spec, v.label);
        showToast('"' + v.label + '" 적용', 'ok');
      });
    });
  }

  // 좌측 패널의 "AI 추출 spec" — 편집 가능한 chip + 추가 버튼 (사용자가 직접 와이어프레임 다듬기)
  function fillSpecPanel(spec) {
    var box = document.getElementById('panel-spec');
    if (!box) return;
    if (!spec) { box.style.display = 'none'; return; }
    box.style.display = 'block';

    var pageSub = (spec.pageHead && spec.pageHead.sub) || '-';
    document.getElementById('spec-sub').textContent = pageSub;

    // layout — table / cards / master-detail / kanban / dashboard / form / timeline
    var layoutEl = document.getElementById('spec-layout');
    if (layoutEl) {
      var l = spec.layout || 'table';
      var emoji = ({ table: '🧮', cards: '🃏', 'master-detail': '📑', kanban: '📋', dashboard: '📊', form: '📝', timeline: '🕒' })[l] || '🧩';
      layoutEl.textContent = emoji + '  ' + l;
      layoutEl.style.fontWeight = '600';
    }

    // customNotes — 'AI 추천 (자유 제안)' variant 의 자유 형식 제안 메모
    var notesRow = document.getElementById('spec-notes-row');
    var notesEl = document.getElementById('spec-notes');
    if (spec.customNotes && String(spec.customNotes).trim()) {
      notesRow.style.display = '';
      notesEl.textContent = String(spec.customNotes).trim();
      notesEl.style.fontSize = '12.5px';
      notesEl.style.lineHeight = '1.55';
      notesEl.style.color = 'var(--fg)';
      notesEl.style.whiteSpace = 'pre-wrap';
    } else {
      notesRow.style.display = 'none';
    }

    // 컬럼 — 편집 가능 chip + ＋ 추가 버튼
    var cols = (spec.table && spec.table.columns) || [];
    document.getElementById('spec-cols-count').textContent = cols.length;
    document.getElementById('spec-cols').innerHTML =
      cols.map(function (c, i) {
        return '<span class="panel__chip panel__chip--editable" data-edit="col" data-idx="' + i + '" title="클릭하여 수정 / × 클릭하여 삭제">' +
          esc(c.label) +
          '<small style="opacity:0.6;margin-left:4px;">·' + esc(c.type || 'text') + '</small>' +
          '<button class="panel__chip__del" data-del="col" data-idx="' + i + '" title="삭제">×</button>' +
        '</span>';
      }).join('') +
      '<button class="panel__chip__add" data-add="col">＋ 컬럼</button>';

    // 필터 — 편집 가능 chip + ＋ 추가 버튼
    var filters = spec.filters || [];
    document.getElementById('spec-filters-count').textContent = filters.length;
    document.getElementById('spec-filters').innerHTML =
      filters.map(function (f, i) {
        var label = (f && f.label) || f || '';
        return '<span class="panel__chip panel__chip--editable" data-edit="filter" data-idx="' + i + '" title="클릭 수정 / × 삭제">' +
          esc(label) +
          '<button class="panel__chip__del" data-del="filter" data-idx="' + i + '">×</button>' +
        '</span>';
      }).join('') +
      '<button class="panel__chip__add" data-add="filter">＋ 필터</button>';

    // 액션 — 편집 가능 chip + ＋ 추가 버튼
    var actions = (spec.pageHead && spec.pageHead.actions) || [];
    document.getElementById('spec-actions-count').textContent = actions.length;
    document.getElementById('spec-actions').innerHTML =
      actions.map(function (a, i) {
        var cls = a.kind === 'primary' ? 'panel__chip panel__chip--primary panel__chip--editable' : 'panel__chip panel__chip--editable';
        return '<span class="' + cls + '" data-edit="action" data-idx="' + i + '" title="클릭 수정 / × 삭제">' +
          esc(a.label || '') +
          '<button class="panel__chip__del" data-del="action" data-idx="' + i + '">×</button>' +
        '</span>';
      }).join('') +
      '<button class="panel__chip__add" data-add="action">＋ 액션</button>';

    var rows = (spec.table && spec.table.rowSamples) || [];
    document.getElementById('spec-rows-count').textContent = rows.length;
    document.getElementById('spec-rows').textContent = rows.length
      ? rows.map(function (r) { return '· ' + (r || []).join(' | '); }).join('\n')
      : '(없음)';

    bindSpecPanelEdits();

    // refine 패널 노출 + 버튼 활성화 동기화
    var refineBox = document.getElementById('panel-refine');
    if (refineBox) refineBox.style.display = '';
  }

  // 편집 / 삭제 / 추가 핸들러 — chip 클릭 시 spec 갱신 → 즉시 iframe 재 inject + history 저장
  function bindSpecPanelEdits() {
    var box = document.getElementById('panel-spec');
    if (!box) return;

    // 삭제 (X 버튼) — bubbling 막기 위해 먼저 처리
    box.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var type = btn.getAttribute('data-del');
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        deleteSpecItem(type, idx);
      });
    });
    // 편집 (chip 자체 클릭)
    box.querySelectorAll('[data-edit]').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var type = chip.getAttribute('data-edit');
        var idx = parseInt(chip.getAttribute('data-idx'), 10);
        editSpecItem(type, idx);
      });
    });
    // 추가
    box.querySelectorAll('[data-add]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var type = btn.getAttribute('data-add');
        addSpecItem(type);
      });
    });
  }

  function deleteSpecItem(type, idx) {
    if (!currentSpec) return;
    if (type === 'col') {
      currentSpec.table.columns.splice(idx, 1);
      // rowSamples 도 같은 컬럼 제거
      (currentSpec.table.rowSamples || []).forEach(function (row) {
        if (Array.isArray(row)) row.splice(idx, 1);
      });
    } else if (type === 'filter') {
      currentSpec.filters.splice(idx, 1);
    } else if (type === 'action') {
      currentSpec.pageHead.actions.splice(idx, 1);
    }
    applyEditedSpec('삭제');
  }

  function editSpecItem(type, idx) {
    if (!currentSpec) return;
    if (type === 'col') {
      var col = currentSpec.table.columns[idx];
      var newLabel = window.prompt('컬럼 이름', col.label);
      if (newLabel == null) return;
      newLabel = newLabel.trim();
      if (!newLabel) return;
      var newType = window.prompt('컬럼 타입 (text/number/code-link/status-chip/kind-chip/platform-tag/product-name/tag/date)', col.type || 'text');
      if (newType == null) return;
      var newWidth = window.prompt('width (auto/medium/large)', col.width || 'auto');
      if (newWidth == null) return;
      col.label = newLabel;
      col.type = newType.trim() || 'text';
      col.width = newWidth.trim() || 'auto';
    } else if (type === 'filter') {
      var f = currentSpec.filters[idx];
      var label = (f && f.label) || f || '';
      var nv = window.prompt('필터 이름', label);
      if (nv == null) return;
      nv = nv.trim();
      if (!nv) return;
      currentSpec.filters[idx] = { label: nv };
    } else if (type === 'action') {
      var a = currentSpec.pageHead.actions[idx];
      var nl = window.prompt('액션 라벨', a.label || '');
      if (nl == null) return;
      nl = nl.trim();
      if (!nl) return;
      var nk = window.prompt('kind (primary/ghost/danger)', a.kind || 'ghost');
      if (nk == null) return;
      a.label = nl;
      a.kind = nk.trim() || 'ghost';
    }
    applyEditedSpec('수정');
  }

  function addSpecItem(type) {
    if (!currentSpec) return;
    if (type === 'col') {
      var label = window.prompt('새 컬럼 이름');
      if (label == null) return;
      label = label.trim();
      if (!label) return;
      var t = window.prompt('타입 (text/number/code-link/status-chip/kind-chip/platform-tag/product-name/tag/date)', 'text');
      if (t == null) return;
      var w = window.prompt('width (auto/medium/large)', 'auto');
      if (w == null) return;
      currentSpec.table.columns.push({ label: label, type: t.trim() || 'text', width: w.trim() || 'auto' });
      // rowSamples 도 새 컬럼 dummy 데이터 추가
      (currentSpec.table.rowSamples || []).forEach(function (row, r) {
        if (Array.isArray(row)) row.push(inferDummyValue(label, r));
      });
    } else if (type === 'filter') {
      var fl = window.prompt('새 필터 이름');
      if (fl == null) return;
      fl = fl.trim();
      if (!fl) return;
      currentSpec.filters = currentSpec.filters || [];
      currentSpec.filters.push({ label: fl });
    } else if (type === 'action') {
      var al = window.prompt('새 액션 라벨');
      if (al == null) return;
      al = al.trim();
      if (!al) return;
      var ak = window.prompt('kind (primary/ghost/danger)', 'ghost');
      if (ak == null) return;
      currentSpec.pageHead = currentSpec.pageHead || {};
      currentSpec.pageHead.actions = currentSpec.pageHead.actions || [];
      currentSpec.pageHead.actions.push({ label: al, kind: ak.trim() || 'ghost' });
    }
    applyEditedSpec('추가');
  }

  // spec 변경 후 iframe 재 로드 + 좌측 패널 갱신 + history 저장
  // (in-place mutation 대신 iframe 새로 로드 — layout 전환 시 stale DOM 방지)
  function applyEditedSpec(actionLabel) {
    if (currentPrd && currentSpec) {
      renderIframe(currentPrd, currentDemoUrl, currentSpec);
      fillSpecPanel(currentSpec);
      try { localStorage.setItem(STORAGE_SPEC, JSON.stringify(currentSpec)); } catch (_) {}
      saveHistoryEntry(currentPrd, currentSpec, '사용자 편집 — ' + actionLabel);
      showToast(actionLabel + ' 완료 — 학습 history 에 누적됨', 'ok');
    }
  }

  // AI 다듬기 — 현재 spec + 사용자 변경 요청 → AI 가 spec 재생성
  async function refineSpec(userPrompt) {
    if (!currentSpec || !currentPrd) {
      showToast('먼저 와이어프레임 생성', 'err');
      return;
    }
    var byokKey = '';
    try { byokKey = (localStorage.getItem(STORAGE_KEY) || '').trim(); } catch (_) {}
    if (!byokKey || !/^sk-ant-/.test(byokKey)) {
      showToast('Anthropic 키 미설정 — 좌측 「키 입력」', 'err');
      return;
    }

    var statusEl = document.getElementById('refine-status');
    var btn = document.getElementById('btn-refine');
    var input = document.getElementById('refine-input');
    function setStatus(msg, kind) {
      if (!statusEl) return;
      statusEl.style.display = msg ? '' : 'none';
      statusEl.textContent = msg || '';
      statusEl.classList.remove('panel__ai-status--ok', 'panel__ai-status--warn');
      if (kind === 'ok')   statusEl.classList.add('panel__ai-status--ok');
      if (kind === 'warn') statusEl.classList.add('panel__ai-status--warn');
    }
    if (btn) btn.disabled = true;
    setStatus('AI 가 변경 사항 적용 중… (5~15초)', '');

    var specForAi = JSON.parse(JSON.stringify(currentSpec));
    delete specForAi.alternatives;  // refinement 는 메인 spec 만

    var prompt = [
      '당신은 SCM Hub 디자인시스템 와이어프레임 전문가입니다.',
      '아래 [현재 spec] 을 [사용자 변경 요청] 에 맞춰 수정해서 새로운 spec 을 출력하세요.',
      '',
      '[규칙]',
      '· 사용자 요청과 무관한 부분은 그대로 유지 — 함부로 다른 곳까지 바꾸지 말 것.',
      '· spec.layout 은 그대로 유지하되, 사용자가 명시적으로 다른 형태 (카드·칸반·폼·대시보드·마스터-디테일·타임라인) 를 요청하면 변경.',
      '  layout 변경 시에는 layoutData 도 그 layout 에 맞춰 채울 것 (cards/columns/sections/items/list+detail/stats+charts).',
      '· filters · columns · rowSamples 는 layout="table" 일 때만 의미 있음 — 다른 layout 은 layoutData 가 메인.',
      '· filters ↔ columns 1:1 매칭 (table layout 한정).',
      '· customNotes 는 사용자가 신규 컴포넌트/레이아웃을 요청한 경우에만 한국어로 짧게 작성.',
      '· alternatives 는 출력하지 말 것 — 메인 spec 만.',
      '',
      '[현재 spec]',
      JSON.stringify(specForAi, null, 2),
      '',
      (function () {
        var hint = '';
        try { hint = (localStorage.getItem('scm-prd-ai-hint') || '').trim(); } catch (_) {}
        return hint ? '[★ 사용자가 PRD 업로드 시 적은 AI 추가 지시사항 — 항상 우선 반영]\n' + hint.substring(0, 2000) + '\n' : '';
      })(),
      '[사용자 변경 요청]',
      String(userPrompt || '').substring(0, 2000),
      '',
      '[출력 — JSON only, { 로 시작 } 로 끝, 다른 텍스트 절대 금지]',
    ].join('\n');

    try {
      var res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': byokKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 24000,
          system: '당신은 JSON 만 출력하는 API 입니다. 응답은 반드시 { 로 시작 } 로 끝. markdown 코드블록 / 설명 / 인사말 절대 금지. 셀 데이터는 한국 패션/SCM 도메인의 진짜같은 한국어 (placeholder 금지).',
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      if (!res.ok) {
        var t = await res.text();
        throw new Error(res.status + ': ' + t.substring(0, 200));
      }
      var data = await res.json();
      var raw = (data.content && data.content[0] && data.content[0].text) || '';
      var refined = extractJson(raw);
      if (!refined) throw new Error('JSON 파싱 실패: ' + raw.substring(0, 200));

      reconcileSpec(refined);
      currentSpec = refined;
      // iframe 새로 로드 — layout 변경 가능성 때문에 in-place mutation 으로는 불충분
      renderIframe(currentPrd, currentDemoUrl, currentSpec);
      fillSpecPanel(currentSpec);
      try { localStorage.setItem(STORAGE_SPEC, JSON.stringify(currentSpec)); } catch (_) {}
      saveHistoryEntry(currentPrd, currentSpec, 'AI 다듬기 — ' + (userPrompt || '').substring(0, 30));

      setStatus('변경 완료 — 다시 입력하면 추가 수정 가능', 'ok');
      if (input) input.value = '';
      showToast('AI 변경 적용 완료', 'ok');
    } catch (e) {
      var em = friendlyApiError((e && e.message) || String(e));
      // refine 패널은 좁아서 너무 긴 메시지면 첫 줄만 (전체는 콘솔)
      console.warn('[SCM Sim] refineSpec 실패:', em);
      var firstLine = em.split('\n')[0];
      setStatus(firstLine, 'warn');
      showToast('AI 변경 실패', 'err');
    } finally {
      if (btn) btn.disabled = !(input && input.value.trim());
    }
  }

  // 데모 후보 chip 렌더 + 클릭 시 iframe 전환
  function renderVariantChips(prd, candidates, currentUrl, spec) {
    var container = document.getElementById('preview-variants');
    if (!container) return;
    if (!candidates || candidates.length <= 1) { container.innerHTML = ''; return; }

    container.innerHTML = candidates.map(function (c) {
      var isActive = (c.url === currentUrl);
      return '<button class="preview__variant' + (isActive ? ' is-active' : '') + '" type="button" data-url="' + c.url + '">' + esc(c.label) + '</button>';
    }).join('');

    container.querySelectorAll('.preview__variant').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var url = btn.getAttribute('data-url');
        // active 갱신
        container.querySelectorAll('.preview__variant').forEach(function (x) {
          x.classList.toggle('is-active', x === btn);
        });
        // iframe 전환 (spec 그대로 재사용)
        renderIframe(prd, url, spec);
      });
    });
  }

        model: 'claude-sonnet-4-6',
