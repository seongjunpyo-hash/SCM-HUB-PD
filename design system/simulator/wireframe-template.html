<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440" />
  <title>Wireframe Template — SCM Hub</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="../layer-desktop.css" />

  <!-- 디자인시스템 컴포넌트 — sku-management.html 데모와 동일한 셋업 -->
  <link rel="stylesheet" href="../components/backdrop/backdrop.css" />
  <link rel="stylesheet" href="../components/checkbox/checkbox.css" />
  <link rel="stylesheet" href="../components/tag/tag.css" />
  <link rel="stylesheet" href="../components/toast/toast.css" />

  <link rel="stylesheet" href="../components/search-btn/search-btn.css" />
  <link rel="stylesheet" href="../components/filter-reset-btn/filter-reset-btn.css" />
  <link rel="stylesheet" href="../components/download-btn/download-btn.css" />
  <link rel="stylesheet" href="../components/pager/pager.css" />
  <link rel="stylesheet" href="../components/pgsize-select/pgsize-select.css" />
  <link rel="stylesheet" href="../components/mini-action/mini-action.css" />
  <link rel="stylesheet" href="../components/info-banner/info-banner.css" />
  <link rel="stylesheet" href="../components/code-link/code-link.css" />
  <link rel="stylesheet" href="../components/code-popover/code-popover.css" />
  <link rel="stylesheet" href="../components/radio/radio.css" />
  <link rel="stylesheet" href="../components/select/select.css" />
  <link rel="stylesheet" href="../components/platform-tag/platform-tag.css" />
  <link rel="stylesheet" href="../components/status-chip/status-chip.css" />
  <link rel="stylesheet" href="../components/kind-chip/kind-chip.css" />
  <link rel="stylesheet" href="../components/filter-chip/filter-chip.css" />
  <link rel="stylesheet" href="../components/filter-select/filter-select.css" />
  <link rel="stylesheet" href="../components/filter-bar/filter-bar.css" />
  <link rel="stylesheet" href="../components/filter-popover/filter-popover.css" />
  <link rel="stylesheet" href="../components/filter-drawer/filter-drawer.css" />
  <link rel="stylesheet" href="../components/stat/stat.css" />
  <link rel="stylesheet" href="../components/stats-bar/stats-bar.css" />
  <link rel="stylesheet" href="../components/page-head/page-head.css" />
  <link rel="stylesheet" href="../components/scm-table/scm-table.css" />
  <link rel="stylesheet" href="../components/scm-table/column-more-menu.css" />
  <link rel="stylesheet" href="../components/scm-table/column-filter-popover.css" />
  <link rel="stylesheet" href="../components/topbar/topbar.css" />
  <link rel="stylesheet" href="../components/lnb/lnb.css" />
  <link rel="stylesheet" href="../components/product-name/product-name.css" />
  <link rel="stylesheet" href="../components/empty-state/empty-state.css" />

  <style>
    :root {
      --scm-lnb-width: 56px;
      --scm-sticky-gnb: 64px;
      --scm-sticky-filter: 76px;
    }
    html.is-lnb-open { --scm-lnb-width: 260px; }

    body { margin: 0; font-family: var(--ld-font-family-base); color: var(--ld-fg); background: #fff; min-width: 1440px; }

    .app { display: grid; grid-template-columns: var(--scm-lnb-width) minmax(0, 1fr); transition: grid-template-columns 0.2s ease; }

    main { min-width: 0; padding: 0 28px 40px; }

    /* sticky stack */
    .scm-filter-bar { top: var(--scm-sticky-gnb); }
    .scm-stats-bar--sticky { top: calc(var(--scm-sticky-gnb) + var(--scm-sticky-filter)); }
    .mp-table-host { margin-top: 0; }

    /* 셀 default 좌측정렬 강제 (다른 CSS override 차단) */
    .mp-table thead th,
    .mp-table tbody td { text-align: left !important; }
    /* cell-numeric 만 예외적으로 우측 */
    .mp-table th.cell-numeric,
    .mp-table td.cell-numeric { font-variant-numeric: tabular-nums; text-align: right !important; }
    /* No 컬럼 — 가운데정렬 + 가는 폭 */
    .mp-table th.col-no,
    .mp-table td.col-no { text-align: center !important; min-width: 48px; width: 48px; }
    /* 체크박스 컬럼 hide — html.no-checkbox 시 */
    html.no-checkbox .mp-table .cb-col { display: none; }
    /* ★ 셀 콘텐츠 잘림 방지 — scm-table.css 의 col-auto width:1% / min-width:min-content override */
    .mp-table th, .mp-table td {
      white-space: nowrap !important;
      overflow: visible !important;
    }
    .mp-table th.col-auto, .mp-table td.col-auto {
      width: auto !important;
      min-width: max-content !important;
    }
    .mp-table th.col-medium, .mp-table td.col-medium {
      width: auto !important;
      min-width: 140px !important;
    }
    .mp-table th.col-large, .mp-table td.col-large {
      width: auto !important;
      min-width: 240px !important;
      max-width: 360px !important;
      white-space: normal !important;
    }
    .mp-table th.col-large .scm-product-name__text,
    .mp-table td.col-large .scm-product-name__text {
      display: inline-block; max-width: 280px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      vertical-align: middle;
    }
    /* col-spacer — 마지막 빈 컬럼이 나머지 폭 차지 (단 데이터 컬럼들이 좁게 안 잡히게) */
    .mp-table th.col-spacer, .mp-table td.col-spacer { width: 100% !important; padding: 0 !important; }
    /* 테이블 자체 — fixed 가 아닌 자동 layout 으로 데이터 콘텐츠 width 자동 잡힘 */
    .mp-table { table-layout: auto !important; width: auto !important; min-width: 100% !important; }
    /* ★ thead 상단 검정 1.5px 라인 — 데모 페이지의 mp-thead-sticky::before 와 같은 효과 (mp-thead-sticky 없는 와이어프레임용) */
    .mp-table-host { position: relative; }
    .mp-table-scroll { position: relative; }
    .mp-table-scroll > .mp-table > thead {
      position: relative !important;
      isolation: isolate;
    }
    .mp-table-scroll > .mp-table > thead::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: #000;
      z-index: 10;
    }
    /* fallback — ::before 가 일부 브라우저에서 thead 의 absolute 컨테이너 처리 안 될 때 th 의 border-top */
    .mp-table-scroll > .mp-table > thead > tr:first-child > th {
      border-top: 1.5px solid #000 !important;
    }

    /* ★ LNB 의 모든 메뉴 텍스트 — disabled 회색 → 블랙 강제 (와이어프레임 = 새 메뉴이므로 활성 상태로) */
    .scm-lnb-row,
    .scm-lnb-row .scm-lnb-label,
    .scm-lnb-row .scm-lnb-icon,
    .scm-lnb-l2,
    .scm-lnb-l2 .scm-lnb-l2-text {
      color: #000 !important;
      opacity: 1 !important;
    }
  </style>

  <script>
    try { document.documentElement.classList.add('is-lnb-open'); } catch(_) {}
  </script>
</head>
<body>

<!-- ============== Topbar (scm-topbar 모듈) — 데모와 100% 동일 ============== -->

  <div class="scm-topbar__left">

        <path d="M4 12H20.0714M4 6H20.0714M4 18H20.0714" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
    <a class="scm-topbar__logo" href="#" aria-label="SCM-Hub 홈">

        <path d="M59.9746 1.61133V7.78516H67.6074V1.61133H69.9287V16.5107H67.6074V10.0635H59.9746V16.5107H57.6543V1.61133H59.9746Z" fill="currentColor"/>
        <path d="M55.085 9.69727V11.9971H48.9004V9.69727H55.085Z" fill="currentColor"/>
        <path d="M33.2148 1.61133L33.2441 1.6582L38.4297 10.0664L43.6367 1.6582L43.666 1.61133H46.3213V16.5107H44.0215V5.16895L39.4814 12.4941L39.4521 12.542H37.4082L37.3789 12.4941L32.8604 5.1709V16.5107H30.5605V1.61133H33.2148Z" fill="currentColor"/>
        <path d="M20.8125 1.40039C24.402 1.40039 27.1131 3.42106 27.9238 6.51465L27.9561 6.63965H25.4473L25.4238 6.5752C24.7679 4.833 23.1271 3.6582 20.8125 3.6582C17.6172 3.65842 15.4953 6.02401 15.4951 9.05957C15.4951 12.0935 17.6362 14.4617 20.9385 14.4619C23.2565 14.4619 25.0415 13.2841 25.6963 11.5449L25.7207 11.4805H28.2295L28.1963 11.6055C27.3849 14.7011 24.5254 16.7197 20.9385 16.7197C16.3491 16.7195 13.1113 13.5053 13.1113 9.05957C13.1115 4.61571 16.2847 1.4006 20.8125 1.40039Z" fill="currentColor"/>
        <path d="M6.58008 1.40039C8.00725 1.40041 9.16335 1.8319 9.96289 2.61523C10.7625 3.39871 11.1952 4.52346 11.1953 5.88867V5.98926H8.76855V5.61621C8.76855 4.9693 8.54277 4.47783 8.16309 4.14746C7.78158 3.81556 7.23461 3.63673 6.58008 3.63672C5.91491 3.63672 5.3783 3.81593 5.00977 4.12988C4.64309 4.44242 4.43268 4.89677 4.43262 5.46875C4.43262 5.97 4.57135 6.33564 4.92578 6.66309C5.28822 6.99784 5.88072 7.29742 6.80371 7.64355L7.64453 7.95801C8.9502 8.44273 9.74471 8.86969 10.3906 9.55859C11.0368 10.2478 11.4258 11.0278 11.4258 12.252C11.4258 14.6421 9.42384 16.7197 6.60059 16.7197C5.21506 16.7196 3.97684 16.2828 3.08398 15.46C2.18996 14.6359 1.65039 13.4321 1.65039 11.916V11.8164H4.07617V12.126C4.07617 12.8674 4.33961 13.4538 4.78125 13.8555C5.2239 14.258 5.85415 14.4833 6.60059 14.4834C7.34821 14.4834 7.94765 14.2683 8.3584 13.8975C8.76809 13.5275 9 12.9936 9 12.3359C8.99999 11.9579 8.93955 11.6633 8.82812 11.4238C8.71705 11.1853 8.55272 10.9951 8.33398 10.8301C7.88946 10.4948 7.23524 10.27 6.37695 9.95215L5.36914 9.57324C4.25265 9.15193 3.47465 8.74531 2.91113 8.05176C2.35254 7.36415 2.00684 6.58617 2.00684 5.51074C2.0069 4.54201 2.3672 3.51388 3.12109 2.72754C3.87671 1.93954 5.02247 1.40039 6.58008 1.40039Z" fill="currentColor"/>
      </svg>
    </a>
    <span class="scm-topbar__demo-tag" aria-label="시뮬레이션 환경" style="background:#000;color:#fff;border-color:#000;">SIMULATION</span>
  </div>
  <div class="scm-topbar__right" role="button" tabindex="0">
    <span class="scm-topbar__avatar">홍</span>
    <div class="scm-topbar__name-group">
      <span class="scm-topbar__name">
        <span class="scm-topbar__name-first">홍길동</span>
        <span class="scm-topbar__name-suffix">님</span>
      </span>
      <span class="scm-topbar__chev">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 6 L8 11 L13 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </span>
    </div>
  </div>
</header>

<!-- ============== App (LNB + main) ============== -->
<div class="app">

  <!-- LNB — 1뎁스 1개 + 2뎁스 1개 (template, JS 가 PRD 의 카테고리/메뉴/아이콘으로 변형) -->
  <nav class="scm-lnb" aria-label="주메뉴">
    <div class="scm-lnb-item is-open is-active" data-key="placeholder">
      <button class="scm-lnb-row" type="button" data-nav-toggle>
        <span class="scm-lnb-icon" data-wf-lnb-icon>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.6" y="3.6" width="7.2" height="7.2" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/>
            <rect x="13.2" y="3.6" width="7.2" height="4.8" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/>
            <rect x="3.6" y="13.2" width="7.2" height="7.2" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/>
            <rect x="13.2" y="10.8" width="7.2" height="9.6" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/>
          </svg>
        </span>
        <span class="scm-lnb-label" data-wf-lnb-label>카테고리</span>
        <span class="scm-lnb-chev">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 10 L8 5 L13 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </span>
      </button>
      <div class="scm-lnb-l2-list">
        <a class="scm-lnb-l2 is-active" href="#" data-key="current">
          <span class="scm-lnb-l2-text">메뉴명</span>
          <span class="scm-lnb-tag scm-lnb-tag--new">NEW</span>
        </a>
      </div>
    </div>
  </nav>

  <main>
    <!-- ===== Page Head (sub 미노출, 액션 1개 template) ===== -->
    <div class="scm-page-head scm-page-head--list">
      <div class="scm-page-head__titles">
        <h1 class="scm-page-head__title">페이지 제목</h1>
      </div>
      <div class="scm-page-head__actions">
        <button class="scm-button scm-button--primary" type="button">액션</button>
      </div>
    </div>

    <!-- ===== Filter Bar — 검색 + 초기화 버튼까지 ===== -->
    <div class="scm-filter-bar">
      <button class="scm-filter-chip" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="round">
            <path d="M10.625 13.4375L3.125 13.4375"/>
            <path d="M16.875 13.4375L13.125 13.4375"/>
            <path d="M5.625 6.56257L3.125 6.5625"/>
            <path d="M16.875 6.5625L8.125 6.56257"/>
            <path d="M8.125 4.6875V8.4375"/>
            <path d="M13.125 15.3125V11.5625"/>
          </g>
        </svg>
        <span>전체 필터</span>
      </button>
      <div class="scm-filter-overflow">
        <div class="scm-filter-overflow__track">
          <button class="scm-filter-select" type="button" data-state="placeholder">
            <span class="scm-filter-select__label">필터</span>
            <span class="scm-filter-select__value">필터</span>
            <svg class="scm-filter-select__chev" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 5.5l5 5 5-5" stroke="currentColor" stroke-width="1.5" fill="none"/>
            </svg>
          </button>
        </div>
        <div class="scm-filter-overflow__fade scm-filter-overflow__fade--left" style="opacity:0;"></div>
        <div class="scm-filter-overflow__fade scm-filter-overflow__fade--right" style="opacity:0;"></div>
      </div>
      <div class="scm-filter-actions">
        <button class="scm-search-btn" type="button" disabled>검색</button>
      </div>
    </div>

    <!-- ===== Stats Bar (테이블 액션바 + 페이저) ===== -->
    <div class="scm-stats-bar scm-stats-bar--sticky">
      <div class="scm-stats-bar__left">
        <div class="scm-stats-bar__counts-wrap">
          <div class="scm-stats-bar__counts">
            <span class="scm-stat scm-stat--all">
              <span class="scm-stat__label">전체</span>
              <span class="scm-stat__num">5</span>
            </span>
          </div>
        </div>
        <div class="scm-stats-bar__mini-actions">
          <button class="scm-mini-action" type="button">액션</button>
          <button class="scm-mini-action scm-mini-action--primary" type="button" disabled>일괄 액션</button>
        </div>
      </div>
      <div class="scm-stats-bar__right">
        <button class="scm-download-btn" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3 16.5H17M10 13.5V3.5M10 13.5L14 9.5M10 13.5L6 9.5" stroke="currentColor" fill="none"/>
          </svg>
          <span>전체 엑셀 다운로드</span>
        </button>
        <span class="scm-stats-bar__v-divider"></span>
        <span class="scm-pager">
          <strong class="scm-pager__current">1</strong>
          <span class="scm-pager__total">/ <span>1</span> 페이지</span>
          <button class="scm-pager-btn" type="button" aria-label="이전 페이지" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M12.5 16L6.71213 10.212C6.59497 10.0948 6.59498 9.90486 6.71213 9.7877L12.5 4" stroke="currentColor" fill="none"/>
            </svg>
          </button>
          <button class="scm-pager-btn" type="button" aria-label="다음 페이지" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M7.5 16L13.2879 10.2121C13.405 10.095 13.405 9.90503 13.2879 9.78787L7.5 4" stroke="currentColor" fill="none"/>
            </svg>
          </button>
        </span>
        <span class="scm-pgsize-wrap" id="pgsize">
          <button class="scm-pgsize" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="scm-pgsize__label">100개씩</span>
            <svg class="scm-pgsize__chev" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 5.5l5 5 5-5" stroke="currentColor" stroke-width="1.5" fill="none"/>
            </svg>
          </button>
          <ul class="scm-pgsize-popup" role="listbox"></ul>
        </span>
      </div>
    </div>

    <!-- ===== Table — sticky thead 비활성화 (와이어프레임은 단순 thead 만), 5컬럼 5행 default ===== -->
    <div class="mp-table-host">
      <div class="mp-table-scroll">
        <table class="mp-table is-cell-selectable" id="mp-table">
          <thead>
            <tr style="border-top: 1.5px solid #000;">
              <th class="cb-col col-frozen-1" style="border-top: 1.5px solid #000;"><span class="scm-checkbox" role="checkbox" aria-checked="false" tabindex="0"></span></th>
              <th class="col-auto col-no col-frozen-2" style="border-top: 1.5px solid #000;">No</th>
              <th class="col-auto" style="border-top: 1.5px solid #000;">컬럼1</th>
              <th class="col-auto" style="border-top: 1.5px solid #000;">컬럼2</th>
              <th class="col-auto" style="border-top: 1.5px solid #000;">컬럼3</th>
              <th class="col-auto" style="border-top: 1.5px solid #000;">컬럼4</th>
              <th class="col-auto" style="border-top: 1.5px solid #000;">컬럼5</th>
              <th class="col-spacer" data-empty="true" aria-hidden="true" style="border-top: 1.5px solid #000;"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="cb-col col-frozen-1"><span class="scm-checkbox" role="checkbox" aria-checked="false" tabindex="0"></span></td>
              <td class="col-auto col-no col-frozen-2">1</td>
              <td class="col-auto">샘플 1-1</td>
              <td class="col-auto">샘플 1-2</td>
              <td class="col-auto">샘플 1-3</td>
              <td class="col-auto">샘플 1-4</td>
              <td class="col-auto">샘플 1-5</td>
              <td class="col-spacer" aria-hidden="true"></td>
            </tr>
            <tr>
