<!-- ============================================================
     scm-filter-bar — canonical marker
     ============================================================ -->

<div class="scm-filter-bar">
  <button class="scm-filter-chip" type="button">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M3 5h14M6 10h8M9 15h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </svg>
    <span>전체 필터</span>
    <span class="scm-filter-chip__count">3</span>
  </button>

  <div class="scm-filter-overflow">
    <div class="scm-filter-overflow__track">
      <button class="scm-filter-select" type="button" data-state="filled" aria-haspopup="listbox">
        <span class="scm-filter-select__label">시즌</span>
        <span class="scm-filter-select__value">26-SS</span>
        <svg class="scm-filter-select__chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
      <button class="scm-filter-select" type="button" data-state="placeholder" aria-haspopup="listbox">
        <span class="scm-filter-select__label">대표스타일</span>
        <span class="scm-filter-select__value">대표스타일</span>
        <svg class="scm-filter-select__chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
      <button class="scm-filter-select" type="button" data-state="placeholder" aria-haspopup="listbox">
        <span class="scm-filter-select__label">컬러</span>
        <span class="scm-filter-select__value">컬러</span>
        <svg class="scm-filter-select__chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
      <button class="scm-filter-select" type="button" data-state="filled" aria-haspopup="listbox">
        <span class="scm-filter-select__label">스토어 전개 여부</span>
        <span class="scm-filter-select__value">전개중</span>
        <svg class="scm-filter-select__chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
    </div>
    <div class="scm-filter-overflow__fade scm-filter-overflow__fade--left" style="opacity:0;"></div>
    <div class="scm-filter-overflow__fade scm-filter-overflow__fade--right" style="opacity:1;"></div>
  </div>

  <div class="scm-filter-actions">
    <button class="scm-search-btn" type="button">검색</button>
    <button class="scm-filter-reset-btn" type="button">
      <svg viewBox="0 0 20 20"><path d="M4 4V8H8M16 16V12H12M4 8C4.5 6 7 3 10 3C13 3 16 5 16 9M16 12C15.5 14 13 17 10 17C7 17 4 15 4 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>초기화</span>
    </button>
  </div>
</div>
