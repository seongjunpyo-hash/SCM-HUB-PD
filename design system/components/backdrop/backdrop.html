<!-- ============================================================
     scm-backdrop — canonical markers
     이 마크업을 페이지에 그대로 복붙해서 사용.
     ============================================================ -->

<!-- 기본 (어두운 dim) -->
<div class="scm-backdrop"></div>

<!-- 표시 상태 -->
<div class="scm-backdrop is-open"></div>

<!-- 투명 (팝오버 외부 클릭용) -->
<div class="scm-backdrop scm-backdrop--transparent"></div>

<!-- z-index 오버라이드 (예: 팝오버 위에 띄우는 backdrop) -->
<div class="scm-backdrop" style="--scm-backdrop-z: 90;"></div>
