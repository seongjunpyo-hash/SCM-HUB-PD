<!-- ============================================================
     scm-card — canonical markers
     ============================================================ -->

<!-- 기본 (white) — 대시보드 카드 패턴 -->
<article class="scm-card">
  <header class="scm-card-head">
    <h3 class="scm-card-title">최근 활동</h3>
    <a class="scm-card-link" href="#">전체 보기 →</a>
  </header>
  <div class="scm-card-body">
    <p style="margin:0;color:#666;font-size:13px;">카드 본문 컨텐츠</p>
  </div>
</article>

<!-- Body flush (차트, 테이블 등 풀폭) -->
<article class="scm-card">
  <header class="scm-card-head">
    <h3 class="scm-card-title">차트</h3>
  </header>
  <div class="scm-card-body scm-card-body--flush">
    <!-- 차트 -->
  </div>
</article>

<!-- Gray 변형 — 폼 페이지 섹션 그룹 박스 -->
<article class="scm-card scm-card--gray">
  <h3 class="scm-card-title scm-card-title--lg">SKU 분리 기준 속성</h3>
  <div class="scm-card-section">
    <!-- form-row 등 -->
  </div>
  <div class="scm-card-divider"></div>
  <div class="scm-card-section scm-card-section--padded">
    <!-- 다른 섹션 -->
  </div>
</article>
