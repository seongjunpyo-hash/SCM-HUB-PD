<!-- ============================================================
     scm-form-row — canonical markers
     ============================================================ -->

<!-- 기본: 가변 label + full control -->
<div class="scm-form-row">
  <label class="scm-form-label scm-form-label--w140">상품명</label>
  <div class="scm-form-control scm-form-control--full">
    <input class="scm-input" type="text" placeholder="상품명을 입력하세요" />
  </div>
</div>

<!-- Required (라벨 옆 4px 파란 점) -->
<div class="scm-form-row">
  <label class="scm-form-label scm-form-label--w140">
    상품 코드
    <span class="scm-form-row-req"></span>
  </label>
  <div class="scm-form-control scm-form-control--w320">
    <input class="scm-input" type="text" placeholder="필수 입력" />
  </div>
</div>

<!-- 좁은 라벨 + 좁은 컨트롤 -->
<div class="scm-form-row">
  <label class="scm-form-label scm-form-label--w60">색상</label>
  <div class="scm-form-control scm-form-control--w360">
    <input class="scm-input" type="text" placeholder="색상명" />
  </div>
</div>
