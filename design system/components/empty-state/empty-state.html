<!-- ============================================================
     scm-empty-state — canonical markers
     ============================================================ -->

<!-- 기본 (오렌지 톤 알림) -->
<div class="scm-empty-state">
  <span class="scm-empty-state__icon">
    <svg viewBox="0 0 48 48"><use href="#ic-alertTriangle"/></svg>
  </span>
  <div class="scm-empty-state__title">조건에 맞는 결과가 없습니다</div>
  <div class="scm-empty-state__desc">필터를 다시 설정하거나 검색어를 변경해보세요.</div>
</div>

<!-- 회색 톤 -->
<div class="scm-empty-state">
  <span class="scm-empty-state__icon scm-empty-state__icon--gray">
    <svg viewBox="0 0 48 48"><use href="#ic-fileEmpty"/></svg>
  </span>
  <div class="scm-empty-state__title">아직 등록된 항목이 없습니다</div>
  <div class="scm-empty-state__desc">상단의 등록 버튼으로 새 항목을 추가하세요.</div>
</div>

<!-- 하단 보더 없는 변형 -->
<div class="scm-empty-state scm-empty-state--no-border">
  <span class="scm-empty-state__icon">
    <svg viewBox="0 0 48 48"><use href="#ic-alertTriangle"/></svg>
  </span>
  <div class="scm-empty-state__title">조건에 맞는 결과가 없습니다</div>
</div>
