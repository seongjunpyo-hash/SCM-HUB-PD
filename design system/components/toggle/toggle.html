<!-- ============================================================
     scm-toggle — canonical markers
     ============================================================ -->

<!-- Marker A: input 기반 (실제 폼 인풋) -->
<label class="scm-toggle">
  <input type="checkbox" class="scm-toggle-input" />
  <span class="scm-toggle-track"></span>
  <span class="scm-toggle-knob"></span>
</label>

<!-- Marker A + 라벨 셀 (예: "전개"/"미전개") -->
<label class="scm-toggle-cell">
  <span class="scm-toggle">
    <input type="checkbox" class="scm-toggle-input" checked />
    <span class="scm-toggle-track"></span>
    <span class="scm-toggle-knob"></span>
  </span>
  <span class="scm-toggle-label">전개</span>
</label>

<!-- Marker B: div 기반 (mock, 클릭으로 토글) -->
<span class="scm-toggle is-on">
  <span class="scm-toggle-track"></span>
  <span class="scm-toggle-knob"></span>
</span>

<!-- Small 변형 -->
<span class="scm-toggle scm-toggle--sm">
  <span class="scm-toggle-track"></span>
  <span class="scm-toggle-knob"></span>
</span>

<!-- Disabled -->
<span class="scm-toggle is-disabled">
  <span class="scm-toggle-track"></span>
  <span class="scm-toggle-knob"></span>
</span>
