<!-- ============================================================
     scm-table — canonical marker
     ============================================================
     SCM Hub 4개 데이터 리스트 페이지 (무탠 / SKU / 편집샵 보충
     요청 / 편집샵 보충 현황) 의 공통 테이블 패턴.

     주의: 현재 클래스명은 legacy `mp-*` (mp-table, mp-thead-sticky 등)
     그대로 유지. Stage 12 풀 마이그레이션 시 `scm-table-*` 로 일괄 리네임 예정.

     포함:
     - 컬럼 폭 시스템 (col-auto / col-small / col-medium / col-large / col-spacer)
     - cell-clamp / cell-clamp-2 (1줄 / 2줄 wrap)
     - Frozen 컬럼 (col-frozen-1 ~ N)
     - Sticky thead 듀얼 테이블 (별도 컨테이너)
     - 셀 선택 (Excel-like)

     초기화:
     <script src=".../scm-table.js"></script>
     <script>SCMTable.init();</script>
     ============================================================ -->

<!-- 단일 thead (default variant) -->
<div class="mp-table-host">
  <div class="mp-thead-sticky">
    <div class="mp-thead-scroll">
      <table class="mp-table">
        <colgroup>
          <col style="width:40px"/>
          <col style="width:140px"/>
          <col/>
          <col/>
        </colgroup>
        <thead>
          <tr>
            <th class="cb-col"><span class="mp-cb" role="checkbox" aria-checked="false" tabindex="0"></span></th>
            <th class="col-auto">대표스타일</th>
            <th class="col-auto">컬러</th>
            <th class="col-large">스타일명</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
  <div class="mp-table-scroll">
    <table class="mp-table is-cell-selectable">
      <colgroup>
        <col style="width:40px"/>
        <col style="width:140px"/>
        <col/>
        <col/>
      </colgroup>
      <tbody>
        <tr>
          <td class="cb-col"><span class="mp-cb" role="checkbox" aria-checked="false" tabindex="0"></span></td>
          <td class="col-auto">MMJTS6Z19</td>
          <td class="col-auto">미디엄 인디고</td>
          <td class="col-large"><div class="cell-clamp">[시티 레저] 벨티드 데님 파라슈트 팬츠</div></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Grouped (2단) thead variant — SKU 관리 패턴 -->
<div class="mp-table-host">
  <div class="mp-thead-sticky">
    <div class="mp-thead-scroll">
      <table class="mp-table mp-table--grouped">
        <thead>
          <tr>
            <th rowspan="2" class="cb-col"><span class="mp-cb" role="checkbox" aria-checked="false" tabindex="0"></span></th>
            <th colspan="2" class="col-frozen-3 col-frozen-group">상품</th>
            <th colspan="3">SKU</th>
          </tr>
          <tr>
            <th class="col-auto">대표스타일</th>
            <th class="col-auto">컬러</th>
            <th class="col-auto">SKU번호</th>
            <th class="col-auto">바코드</th>
            <th class="col-large">상품명</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
  <div class="mp-table-scroll">
    <table class="mp-table mp-table--grouped is-cell-selectable">
      <tbody>
        <!-- rows -->
      </tbody>
    </table>
  </div>
</div>
