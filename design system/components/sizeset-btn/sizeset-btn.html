<!-- ============================================================
     scm-sizeset-btn — canonical markers
     ============================================================ -->

<!-- 전개 5/9 -->
<button class="scm-sizeset-btn" type="button">
  <span>전개</span>
  <span class="scm-sizeset-btn__num">
    <em>5</em>
    <span class="divider">/</span>
    <span class="total">9</span>
  </span>
</button>

<!-- 전개 0/0 (전체 미운영) -->
<button class="scm-sizeset-btn" type="button">
  <span>전개</span>
  <span class="scm-sizeset-btn__num">
    <em>0</em>
    <span class="divider">/</span>
    <span class="total">0</span>
  </span>
</button>

<!-- Disabled -->
<button class="scm-sizeset-btn" type="button" disabled>
  <span>전개</span>
  <span class="scm-sizeset-btn__num">
    <em>—</em>
    <span class="divider">/</span>
    <span class="total">—</span>
  </span>
</button>
