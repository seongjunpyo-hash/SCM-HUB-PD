<!-- ============================================================
     scm-input — canonical markers
     ============================================================ -->

<!-- 기본 -->
<input class="scm-input" type="text" placeholder="입력하세요" />

<!-- Disabled -->
<input class="scm-input" type="text" placeholder="비활성" disabled />

<!-- Small -->
<input class="scm-input scm-input--sm" type="text" placeholder="Small" />

<!-- With char counter -->
<div class="scm-input-wrap scm-input-wrap--with-counter">
  <input class="scm-input" type="text" placeholder="최대 30자" maxlength="30" />
  <span class="scm-input-counter">0 / 30</span>
</div>
