<!-- ============================================================
     scm-checkbox — canonical markers
     ============================================================ -->

<!-- 기본 (해제 상태) -->
<span class="scm-checkbox" role="checkbox" aria-checked="false" tabindex="0" aria-label="선택"></span>

<!-- 체크됨 -->
<span class="scm-checkbox" role="checkbox" aria-checked="true" tabindex="0" aria-label="선택"></span>

<!-- Indeterminate (일부만 선택) -->
<span class="scm-checkbox" role="checkbox" aria-checked="mixed" tabindex="0" aria-label="전체 선택"></span>

<!-- Disabled -->
<span class="scm-checkbox is-disabled" role="checkbox" aria-checked="false" aria-disabled="true" aria-label="선택"></span>
