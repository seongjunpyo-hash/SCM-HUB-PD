<!-- ============================================================
     scm-icon-box — canonical markers
     ============================================================ -->

<!-- 기본 (회색) -->
<span class="scm-icon-box">
  <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="currentColor"/></svg>
</span>

<!-- 색상 variants -->
<span class="scm-icon-box scm-icon-box--blue">  <svg viewBox="0 0 20 20"><use href="#ic-checkCircle"/></svg> </span>
<span class="scm-icon-box scm-icon-box--green"> <svg viewBox="0 0 20 20"><use href="#ic-checkCircle"/></svg> </span>
<span class="scm-icon-box scm-icon-box--orange"><svg viewBox="0 0 20 20"><use href="#ic-alertTriangle"/></svg></span>
<span class="scm-icon-box scm-icon-box--red">   <svg viewBox="0 0 20 20"><use href="#ic-close"/></svg></span>

<!-- 작은 사이즈 (activity list 용) -->
<span class="scm-icon-box scm-icon-box--sm scm-icon-box--blue">
  <svg viewBox="0 0 16 16"><use href="#ic-bell"/></svg>
</span>
