<!-- ============================================================
     scm-info-banner — canonical marker
     ============================================================ -->

<div class="scm-info-banner">
  <svg class="scm-info-banner__icon" viewBox="0 0 20 20" aria-hidden="true">
    <circle cx="10" cy="10" r="8" fill="currentColor"/>
    <path d="M10 6V11" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="10" cy="14" r="0.9" fill="#fff"/>
  </svg>
  <div class="scm-info-banner__body">
    <div class="scm-info-banner__title">SKU 등록 시 주의사항</div>
    <div class="scm-info-banner__text">SKU 분리 기준 속성과 옵션 조합은 등록 후 변경할 수 없습니다. 신중히 선택해주세요.</div>
  </div>
  <button class="scm-info-banner__toggle" type="button" aria-label="접기">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M3 6L8 11L13 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<!-- collapsed 상태 -->
<div class="scm-info-banner is-collapsed">
  <svg class="scm-info-banner__icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="currentColor"/><path d="M10 6V11" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14" r="0.9" fill="#fff"/></svg>
  <div class="scm-info-banner__body">
    <div class="scm-info-banner__title">접힌 안내</div>
    <div class="scm-info-banner__text">이 텍스트는 collapsed 상태에서 숨겨집니다.</div>
  </div>
  <button class="scm-info-banner__toggle" type="button" aria-label="펼치기">
    <svg viewBox="0 0 16 16"><path d="M3 6L8 11L13 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
