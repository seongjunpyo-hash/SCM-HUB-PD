<!-- ============================================================
     scm-icon-button — canonical markers
     ============================================================ -->

<!-- 기본 (ghost) -->
<button class="scm-icon-button" type="button" aria-label="설정">
  <svg viewBox="0 0 24 24"><use href="#ic-settings"/></svg>
</button>

<!-- Variants -->
<button class="scm-icon-button scm-icon-button--filled" type="button" aria-label="추가">
  <svg viewBox="0 0 24 24"><use href="#ic-plus"/></svg>
</button>
<button class="scm-icon-button scm-icon-button--outlined" type="button" aria-label="다운로드">
  <svg viewBox="0 0 24 24"><use href="#ic-download"/></svg>
</button>

<!-- Sizes -->
<button class="scm-icon-button scm-icon-button--xl"  type="button" aria-label="X-Large"><svg viewBox="0 0 24 24"><use href="#ic-settings"/></svg></button>
<button class="scm-icon-button scm-icon-button--lg"  type="button" aria-label="Large"><svg viewBox="0 0 24 24"><use href="#ic-settings"/></svg></button>
<button class="scm-icon-button"                      type="button" aria-label="Medium"><svg viewBox="0 0 24 24"><use href="#ic-settings"/></svg></button>
<button class="scm-icon-button scm-icon-button--sm"  type="button" aria-label="Small"><svg viewBox="0 0 20 20"><use href="#ic-settings"/></svg></button>
<button class="scm-icon-button scm-icon-button--xs"  type="button" aria-label="X-Small"><svg viewBox="0 0 20 20"><use href="#ic-settings"/></svg></button>
<button class="scm-icon-button scm-icon-button--2xs" type="button" aria-label="2X-Small"><svg viewBox="0 0 20 20"><use href="#ic-close"/></svg></button>

<!-- Disabled -->
<button class="scm-icon-button"                          type="button" aria-label="Disabled" disabled><svg viewBox="0 0 24 24"><use href="#ic-settings"/></svg></button>
<button class="scm-icon-button scm-icon-button--filled"  type="button" aria-label="Disabled filled" disabled><svg viewBox="0 0 24 24"><use href="#ic-plus"/></svg></button>
<button class="scm-icon-button scm-icon-button--outlined" type="button" aria-label="Disabled outlined" disabled><svg viewBox="0 0 24 24"><use href="#ic-download"/></svg></button>
