<!-- ============================================================
     scm-deploy-pill — canonical markers (table cell 안 사용)
     ============================================================ -->

<!-- 전개중 -->
<div class="scm-deploy-pill scm-deploy-pill--deployed">
  <span class="scm-deploy-pill__pill">
    <span class="scm-deploy-pill__dot"></span>전개중
  </span>
  <button class="scm-deploy-pill__chev" type="button" aria-label="스토어 전개 여부 변경">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<!-- 미전개 -->
<div class="scm-deploy-pill scm-deploy-pill--undeployed">
  <span class="scm-deploy-pill__pill">
    <span class="scm-deploy-pill__dot"></span>미전개
  </span>
  <button class="scm-deploy-pill__chev" type="button" aria-label="스토어 전개 여부 변경">
    <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
  </button>
</div>

<!-- 일부 전개 -->
<div class="scm-deploy-pill scm-deploy-pill--partial">
  <span class="scm-deploy-pill__pill">
    <span class="scm-deploy-pill__dot"></span>일부 전개
  </span>
  <button class="scm-deploy-pill__chev" type="button" aria-label="스토어 전개 여부 변경">
    <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
  </button>
</div>
