<!-- ============================================================
     scm-text-button — canonical markers
     ============================================================ -->

<!-- 기본 (primary) -->
<button class="scm-text-button" type="button">자세히 보기</button>

<!-- Variants -->
<button class="scm-text-button scm-text-button--secondary" type="button">건너뛰기</button>
<button class="scm-text-button scm-text-button--negative"  type="button">삭제</button>
<button class="scm-text-button scm-text-button--accent"    type="button">링크</button>

<!-- Sizes -->
<button class="scm-text-button scm-text-button--sm" type="button">Small</button>
<button class="scm-text-button"                     type="button">Medium (default)</button>
<button class="scm-text-button scm-text-button--lg" type="button">Large</button>
<button class="scm-text-button scm-text-button--xl" type="button">XLarge</button>

<!-- Underline -->
<button class="scm-text-button scm-text-button--underline" type="button">자세히 보기</button>
<button class="scm-text-button scm-text-button--accent scm-text-button--underline" type="button">바로가기</button>

<!-- Disabled -->
<button class="scm-text-button" type="button" disabled>Disabled</button>

<!-- Prefix / suffix icon -->
<button class="scm-text-button scm-text-button--accent" type="button">
  <svg viewBox="0 0 16 16"><use href="#ic-external"/></svg>
  <span>새 창에서 열기</span>
</button>
<button class="scm-text-button" type="button">
  <span>다음</span>
  <svg viewBox="0 0 16 16"><use href="#ic-chevron-right"/></svg>
</button>
