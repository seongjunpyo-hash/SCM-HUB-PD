<!-- ============================================================
     scm-tabs — canonical markers
     ============================================================ -->

<!-- Underline variant (sku-detail 섹션 탭) -->
<div class="scm-tabs scm-tabs--underline" role="tablist">
  <button class="scm-tab is-active" type="button" data-key="used" role="tab" aria-selected="true">
    <span class="scm-tab__label">사용 바코드</span>
    <span class="scm-tab__count">3</span>
  </button>
  <button class="scm-tab" type="button" data-key="unused" role="tab" aria-selected="false">
    <span class="scm-tab__label">미사용</span>
    <span class="scm-tab__count">2</span>
  </button>
</div>

<!-- Pill variant (dashboard period tabs) -->
<div class="scm-tabs scm-tabs--pill" role="tablist">
  <button class="scm-tab is-active" type="button" data-key="7d" role="tab" aria-selected="true">7일</button>
  <button class="scm-tab" type="button" data-key="14d" role="tab" aria-selected="false">14일</button>
  <button class="scm-tab" type="button" data-key="30d" role="tab" aria-selected="false">30일</button>
</div>
