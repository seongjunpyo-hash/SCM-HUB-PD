<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>접근 권한 없음</title>
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #FAFBFC; color: #242424;
    }
    .box {
      text-align: center;
      padding: 48px;
      background: #fff;
      border: 1px solid #EBEBEB;
      border-radius: 8px;
      max-width: 400px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #666; margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 10px 20px;
      background: #242424;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>접근 권한 없음</h1>
    <p>이 도메인에 대한 권한이 없습니다.<br/>관리자에게 문의하세요.</p>
    <a href="/hub/">허브로 돌아가기</a>
  </div>
</body>
</html>
