<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 계정 · SCM HUB</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg:#0E0E14; --surface:#15151D; --surface-h:#1B1B25; --line:#25252F; --line-2:#34344A;
      --fg:#FFFFFF; --fg-mute:rgba(255,255,255,0.62); --fg-dim:rgba(255,255,255,0.40);
      --accent:#6E6BFF; --accent-bg:rgba(110,107,255,0.14);
      --error:#FF6B6B; --success:#10B981; --warn:#F59E0B;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      letter-spacing: -0.01em;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    .shell { max-width: 640px; margin: 0 auto; padding: 32px 32px 96px; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 32px; }
    .top__brand { font-weight: 800; font-size: 18px; letter-spacing: 1.2px; }
    .top__back {
      font-size: 12px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg-mute);
    }
    .top__back:hover { border-color: var(--line-2); color: var(--fg); }

    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 6px; }
    .sub { color: var(--fg-mute); font-size: 13px; line-height: 1.6; margin: 0 0 28px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 28px;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 16px; font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
    .info__row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .info__row:first-of-type { border-top: 0; }
    .info__label { color: var(--fg-mute); }
    .info__val { color: var(--fg); font-weight: 500; }
    .role-badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .role-super { background: rgba(245,158,11,0.16); color: var(--warn); }
    .role-admin { background: var(--accent-bg); color: var(--accent); }
    .role-biz { background: rgba(16,185,129,0.16); color: var(--success); }
    .role-internal { background: rgba(255,255,255,0.08); color: var(--fg-mute); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--fg-mute); margin-bottom: 6px; font-weight: 600; }
    .field input {
      width: 100%; height: 44px; padding: 0 14px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      color: var(--fg); font-size: 13px; font-family: inherit;
      transition: border-color 0.15s;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    .field input::placeholder { color: var(--fg-dim); }
    .hint { font-size: 11px; color: var(--fg-dim); margin-top: 6px; line-height: 1.4; }

    .row { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .btn {
      padding: 10px 18px; border-radius: 10px; border: 0; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 600;
      transition: all 0.15s;
    }
    .btn--primary { background: var(--accent); color: #fff; }
    .btn--primary:hover { background: #8784ff; }
    .btn--ghost { background: transparent; color: var(--fg-mute); border: 1px solid var(--line); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; display: none; }
    .msg--error { background: rgba(255,107,107,0.12); color: var(--error); border: 1px solid rgba(255,107,107,0.3); }
    .msg--success { background: rgba(16,185,129,0.12); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
    .msg.show { display: block; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <span class="top__brand">SCM HUB · 내 계정</span>
      <a class="top__back" href="/">← 워크스페이스</a>
    </header>

    <h1>내 계정</h1>
    <p class="sub">계정 정보 확인 및 비밀번호 변경.</p>

    <section class="panel">
      <h2>계정 정보</h2>
      <div class="info__row"><span class="info__label">이메일</span><span class="info__val" id="email">—</span></div>
      <div class="info__row"><span class="info__label">이름</span><span class="info__val" id="name">—</span></div>
      <div class="info__row"><span class="info__label">역할</span><span class="info__val"><span class="role-badge" id="role">—</span></span></div>
    </section>

    <section class="panel">
      <h2>비밀번호 변경</h2>
      <p class="sub" style="margin-bottom: 16px;">변경하면 다른 기기/세션은 자동으로 로그아웃되고, 현재 기기 세션만 유지됩니다.</p>
      <form id="pwForm" autocomplete="off">
        <div class="field">
          <label for="cur">현재 비밀번호</label>
          <input id="cur" type="password" required autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="new1">새 비밀번호</label>
          <input id="new1" type="password" required minlength="8" placeholder="8자 이상" autocomplete="new-password" />
          <div class="hint">8자 이상. 영문 + 숫자 + 기호 조합 권장.</div>
        </div>
        <div class="field">
          <label for="new2">새 비밀번호 확인</label>
          <input id="new2" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="msg msg--error" id="errMsg"></div>
        <div class="msg msg--success" id="okMsg">비밀번호가 변경되었습니다.</div>
        <div class="row">
          <button type="submit" class="btn btn--primary" id="submit">변경</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    (async () => {
      try {
        const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
        const data = await r.json();
        if (!data.user) {
          location.replace('/login.html?next=' + encodeURIComponent(location.pathname));
          return;
        }
        const u = data.user;
        $('email').textContent = u.email;
        $('name').textContent = u.name || '—';
        $('role').textContent = u.role;
        $('role').className = 'role-badge role-' + u.role;
      } catch {
        location.replace('/login.html?next=' + encodeURIComponent(location.pathname));
      }
    })();

    $('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('errMsg').classList.remove('show');
      $('okMsg').classList.remove('show');

      const cur = $('cur').value;
      const n1 = $('new1').value;
      const n2 = $('new2').value;

      if (n1.length < 8) {
        $('errMsg').textContent = '새 비밀번호는 8자 이상이어야 합니다.';
        $('errMsg').classList.add('show'); return;
      }
      if (n1 !== n2) {
        $('errMsg').textContent = '새 비밀번호가 일치하지 않습니다.';
        $('errMsg').classList.add('show'); return;
      }
      if (cur === n1) {
        $('errMsg').textContent = '현재 비밀번호와 다른 새 비밀번호를 입력하세요.';
        $('errMsg').classList.add('show'); return;
      }

      const submit = $('submit');
      submit.disabled = true; submit.textContent = '변경 중...';

      try {
        const r = await fetch('/api/auth/change-password', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: cur, newPassword: n1 }),
        });
        const data = await r.json();
        if (!r.ok) {
          const m =
            data.error === 'invalid_current' ? '현재 비밀번호가 올바르지 않습니다.' :
            data.error === 'password_too_short' ? '새 비밀번호는 8자 이상이어야 합니다.' :
            data.error === 'same_password' ? '현재 비밀번호와 다른 새 비밀번호를 입력하세요.' :
            data.error === 'unauthorized' ? '로그인 세션이 만료되었습니다.' :
            '변경 실패: ' + (data.error || r.status);
          $('errMsg').textContent = m;
          $('errMsg').classList.add('show');
          submit.disabled = false; submit.textContent = '변경';
          return;
        }
        $('cur').value = ''; $('new1').value = ''; $('new2').value = '';
        $('okMsg').classList.add('show');
        submit.disabled = false; submit.textContent = '변경';
      } catch (err) {
        $('errMsg').textContent = '네트워크 오류: ' + (err.message || err);
        $('errMsg').classList.add('show');
        submit.disabled = false; submit.textContent = '변경';
      }
    });
  </script>
</body>
</html>
