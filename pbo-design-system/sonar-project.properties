# sonar-project.properties
# --- required properties ---
# projectKey 는 unique 한 값이어야 합니다.
sonar.projectKey=layer
# --- optional properties ---
# 소나큐브 주소를 입력합니다.
sonar.host.url=https://sonarqube.musinsa.io
# 커버리지 파일 경로, 언어마다 Key 가 다르기 때문에 공식 문서 확인 부탁드리겠습니다.
# https://docs.sonarsource.com/sonarqube/9.9/analyzing-source-code/test-coverage/overview/
# coverage.xml 파일 경로는 상대 경로입니다.
# sonar.XXX.XXX=coverage.xml
# 서트파티 린터 결과 파일, 언어마다 Key 가 다르기 때문에 공식 문서 확인 부탁드리겠습니다.
# https://docs.sonarsource.com/sonarqube/9.9/analyzing-source-code/importing-external-issues/importing-third-party-issues/
# xxx.json 파일 경로는 상대 경로입니다.
# sonar.XXX.XXX=xxx.json
# define new code 동작이 Previous version 일 경우
# sonar.projectVersion=1.0
# sonar-project.properties 파일이 존재하는 상대 경로를 작성합니다. 
# 루트 디렉토리에 위치할 경우 기본값은 . 입니다.

# 제외할 파일/폴더 설정
sonar.exclusions=**/node_modules/**,**/dist/**,**/docs/**,**/docs-assets/**,**/*.test.ts,**/*.spec.ts,**/*.stories.tsx,**/*.stories.ts,**/*.svg

# 특정 규칙 비활성화 (필요시)
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1234
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts
