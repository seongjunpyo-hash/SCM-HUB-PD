<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>적용된 와이어프레임 — Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.01em;
      background: #FAFAFB; color: #1A1A1A;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px;
      background: #1A1A1A; color: #fff;
      font-size: 13px; font-weight: 500;
    }
    .topbar__title { display: inline-flex; align-items: center; gap: 8px; }
    .topbar__title .badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
      padding: 2px 6px; border-radius: 3px;
      background: rgba(255,255,255,0.16); color: #fff;
      text-transform: uppercase;
    }
    .topbar__name { color: rgba(255,255,255,0.78); font-weight: 400; }
    .topbar__actions { display: inline-flex; align-items: center; gap: 12px; }
    .topbar__actions a, .topbar__actions button {
      color: rgba(255,255,255,0.78); text-decoration: none;
      background: transparent; border: 0; cursor: pointer;
      font-family: inherit; font-size: 13px; padding: 0;
    }
    .topbar__actions a:hover, .topbar__actions button:hover { color: #fff; }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 40px; text-align: center;
    }
    .empty svg { width: 48px; height: 48px; color: #BFBFBF; }
    .empty h2 { margin: 0; font-size: 18px; font-weight: 700; color: #1A1A1A; }
    .empty p { margin: 0; font-size: 14px; color: #6B7280; line-height: 1.55; max-width: 480px; }
    .empty a {
      margin-top: 8px;
      display: inline-flex; align-items: center; height: 40px; padding: 0 18px;
      background: #1A1A1A; color: #fff; border-radius: 4px; text-decoration: none;
      font-size: 14px; font-weight: 500;
    }
    .empty a:hover { background: #333; }
  </style>
</head>
<body>

<header class="topbar">
  <span class="topbar__title">
    <span class="badge">Wireframe Demo</span>
    <span class="topbar__name" id="topbar-name">시뮬레이터에서 적용된 와이어프레임</span>
  </span>
  <span class="topbar__actions">
    <button type="button" id="btn-reload" title="다시 불러오기">↻ 새로고침</button>
    <a href="../design system/simulator/">← 시뮬레이터로</a>
  </span>
</header>

<iframe id="frame" title="적용된 와이어프레임"></iframe>

<div class="empty" id="empty" hidden>
  <svg viewBox="0 0 24 24" fill="none">
    <rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/>
    <path d="M3 9h18M7 13h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <h2>적용된 와이어프레임이 없습니다</h2>
  <p>시뮬레이터에서 와이어프레임을 생성한 뒤 <strong>「데모로 적용」</strong> 버튼을 눌러주세요.</p>
  <a href="../design system/simulator/">시뮬레이터 열기 →</a>
</div>

<script>
(function () {
  var STORAGE_HTML = 'scm-prd-wireframe-html';
  var STORAGE_DATA = 'scm-prd-data';

  function load() {
    var html = '';
    try { html = localStorage.getItem(STORAGE_HTML) || ''; } catch (_) {}
    var frame = document.getElementById('frame');
    var empty = document.getElementById('empty');
    var nameEl = document.getElementById('topbar-name');

    try {
      var prd = JSON.parse(localStorage.getItem(STORAGE_DATA) || 'null');
      if (prd && prd.name) {
        nameEl.textContent = prd.name + (prd.id ? ' · /' + prd.id : '');
      }
    } catch (_) {}

    if (html) {
      empty.hidden = true;
      frame.style.display = '';
      frame.srcdoc = html;
    } else {
      frame.style.display = 'none';
      empty.hidden = false;
    }
  }

  document.getElementById('btn-reload').addEventListener('click', load);
  load();
})();
</script>

</body>
</html>
